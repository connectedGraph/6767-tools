<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid">
  <!-- Loading spinner: dark slate track + cyan arc, for dark theme -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#334155" stroke-width="9" opacity="0.55"/>
  <path d="M50 12 A38 38 0 0 1 88 50" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" calcMode="linear" values="0 50 50;360 50 50" keyTimes="0;1" dur="1s" begin="0s" repeatCount="indefinite"/>
  </path>
</svg>
