<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-ascii" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon-term" x1="8" y1="12" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="ascii-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-ascii)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Terminal Prompt & ASCII Block Letter A -->
  <rect x="8" y="10" width="32" height="28" rx="4" fill="#041f1a" stroke="#059669" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="12" cy="14" r="1.2" fill="#ef4444"/>
  <circle cx="15.5" cy="14" r="1.2" fill="#eab308"/>
  <circle cx="19" cy="14" r="1.2" fill="#22c55e"/>

  <!-- ASCII Art Matrix Glyphs (Stylized Geek A) -->
  <g fill="url(#neon-term)" filter="url(#ascii-glow)">
    <text x="14" y="24" font-family="monospace" font-size="7" font-weight="900"> /\ </text>
    <text x="13" y="30" font-family="monospace" font-size="7" font-weight="900">/__\</text>
    <text x="12" y="35" font-family="monospace" font-size="6" font-weight="bold">/    \</text>
  </g>
  <!-- Cyber Cursor -->
  <rect x="33" y="30" width="3" height="5" fill="#34d399" opacity="0.9"/>
</svg>
