<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="dt-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </linearGradient>
    <linearGradient id="dt-frame" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="dt-sand" x1="18" y1="12" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="dt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#dt-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#dt-glow)">
    <!-- Top & Bottom Wooden/Gold Plates -->
    <rect x="13" y="9" width="22" height="3.5" rx="1.5" fill="url(#dt-frame)" stroke="#fef08a" stroke-width="0.8"/>
    <rect x="13" y="35.5" width="22" height="3.5" rx="1.5" fill="url(#dt-frame)" stroke="#fef08a" stroke-width="0.8"/>

    <!-- Left and Right Ornate Pillars -->
    <line x1="15" y1="12.5" x2="15" y2="35.5" stroke="url(#dt-frame)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="33" y1="12.5" x2="33" y2="35.5" stroke="url(#dt-frame)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Glass Bulb Shape (Curved Double Bulbs) -->
    <path d="M17 12.5 C17 20 22 22 23 24 C22 26 17 28 17 35.5 H31 C31 28 26 26 25 24 C26 22 31 20 31 12.5 Z" fill="#312e81" fill-opacity="0.4" stroke="#c7d2fe" stroke-width="1.2"/>

    <!-- Upper Sand Quantity (Depleting) -->
    <path d="M19 16 C20 19 28 19 29 16 H19 Z" fill="url(#dt-sand)"/>
    <polygon points="19,16 29,16 24,23" fill="url(#dt-sand)"/>

    <!-- Falling Sand Particle Stream -->
    <line x1="24" y1="23" x2="24" y2="31" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="1.5 1"/>

    <!-- Bottom Sand Mound (Accumulating) -->
    <path d="M18 35.5 C19 31 29 31 30 35.5 Z" fill="url(#dt-sand)"/>

    <!-- Time Sparkles on Glass -->
    <circle cx="24" cy="15.5" r="1.5" fill="#fbcfe8" opacity="0.8"/>
    <line x1="23" y1="17.5" x2="25" y2="17.5" stroke="#fbcfe8" stroke-width="0.6" opacity="0.8"/>

    <!-- Sparkle on corner -->
    <path d="M38 12 L39 13.5 L40.5 14 L39 14.5 L38 16 L37 14.5 L35.5 14 L37 13.5 Z" fill="#fb7185"/>
  </g>
</svg>