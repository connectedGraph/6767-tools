<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-oil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1905"/>
      <stop offset="50%" stop-color="#3b3309"/>
      <stop offset="100%" stop-color="#141203"/>
    </linearGradient>
    <linearGradient id="bottle-oil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="glow-oil" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#facc15" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-oil)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(250, 204, 21, 0.25)" stroke-width="1"/>
  
  <!-- Olive Oil Glass Bottle -->
  <path d="M22 7 L26 7 L26 11 L29 15 L29 37 C29 39 27.5 40 25.5 40 L22.5 40 C20.5 40 19 39 19 37 L19 15 L22 11 Z" fill="rgba(250, 204, 21, 0.12)" stroke="#facc15" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- Pour Spout Top -->
  <line x1="21.5" y1="7" x2="26.5" y2="7" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Golden Oil Liquid inside Bottle -->
  <path d="M20 22 C21.5 21 23.5 22.5 25.5 21.5 C26.5 21 27.5 21.8 28 22 L28 37 C28 38.5 27 39 25.5 39 L22.5 39 C21 39 20 38.5 20 37 Z" fill="url(#bottle-oil)" opacity="0.85"/>
  
  <!-- Golden Pure Oil Droplet suspended in center -->
  <path d="M24 25 C24 25 21 29 21 32 A3 3 0 0 0 27 32 C27 29 24 25 24 25 Z" fill="#fef08a" filter="url(#glow-oil)"/>
  
  <!-- Olive Leaves on Branch (Right side) -->
  <path d="M28 29 C32 28 36 24 37 20 C33 21 29 25 28 29 Z" fill="url(#leaf-grad)" stroke="#65a30d" stroke-width="0.8"/>
  <path d="M29 33 C33 34 37 32 38 29 C34 29 30 31 29 33 Z" fill="url(#leaf-grad)" stroke="#65a30d" stroke-width="0.8"/>
  <circle cx="34" cy="27" r="1.5" fill="#3f6212"/>
</svg>
