<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="wor-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="wor-chest" x1="8" y1="20" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wor-dia" x1="18" y1="8" x2="30" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wor-gold" x1="12" y1="18" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="wor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#wor-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#wor-glow)">
    <!-- Treasure Chest Base -->
    <rect x="9" y="24" width="30" height="15" rx="2" fill="url(#wor-chest)" stroke="#fde047" stroke-width="1.5"/>
    <line x1="9" y1="31" x2="39" y2="31" stroke="#fde047" stroke-width="1.2"/>

    <!-- Gold Ingot / Coin Glow from Chest -->
    <ellipse cx="24" cy="24" rx="12" ry="3.5" fill="url(#wor-gold)"/>

    <!-- Raised Chest Lid (Open Backwards) -->
    <path d="M8 24 L11 16 Q24 12 37 16 L40 24 Z" fill="url(#wor-chest)" stroke="#fde047" stroke-width="1.5"/>
    
    <!-- Sparkling Huge Faceted Diamond in Center -->
    <polygon points="24,9 29,14 24,23 19,14" fill="url(#wor-dia)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="21,14 24,9 27,14 24,16" fill="#e0f2fe"/>
    <polygon points="19,14 21,14 24,23" fill="#38bdf8"/>
    <polygon points="29,14 27,14 24,23" fill="#0284c7"/>

    <!-- Golden Lock Keyhole Plate -->
    <rect x="22" y="26" width="4" height="6" rx="1" fill="#fde047" stroke="#78350f" stroke-width="0.8"/>
    <circle cx="24" cy="28" r="0.8" fill="#78350f"/>
    <line x1="24" y1="28.8" x2="24" y2="30.5" stroke="#78350f" stroke-width="0.8"/>

    <!-- Sparkling Shine Flairs -->
    <path d="M33 9 L34 11 L36 12 L34 13 L33 15 L32 13 L30 12 L32 11 Z" fill="#fde047"/>
  </g>
</svg>