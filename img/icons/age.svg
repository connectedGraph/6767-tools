<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="age-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="age-cake" x1="12" y1="20" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="age-frosting" x1="12" y1="18" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="age-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#age-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#fb7185" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#age-glow)">
    <!-- Plate -->
    <ellipse cx="24" cy="38.5" rx="16" ry="2.5" fill="#fda4af" fill-opacity="0.6"/>

    <!-- Cake Lower Tier -->
    <rect x="11" y="27" width="26" height="10" rx="2.5" fill="url(#age-cake)"/>
    <!-- Lower Frosting Drips -->
    <path d="M11 29.5 Q13.5 32 16 29.5 Q18.5 32 21 29.5 Q23.5 32 26 29.5 Q28.5 32 31 29.5 Q33.5 32 37 29.5 V27 H11 Z" fill="url(#age-frosting)"/>

    <!-- Cake Upper Tier -->
    <rect x="15" y="19" width="18" height="8" rx="2" fill="url(#age-cake)"/>
    <!-- Upper Frosting Drips -->
    <path d="M15 21.5 Q18 23.5 21 21.5 Q24 23.5 27 21.5 Q30 23.5 33 21.5 V19 H15 Z" fill="url(#age-frosting)"/>

    <!-- Candles (3) -->
    <rect x="18" y="13" width="2" height="6" rx="0.5" fill="#fde047"/>
    <rect x="23" y="11" width="2" height="8" rx="0.5" fill="#38bdf8"/>
    <rect x="28" y="13" width="2" height="6" rx="0.5" fill="#fde047"/>

    <!-- Flames -->
    <path d="M19 10 C18 11.2 18 12.2 19 13 C20 12.2 20 11.2 19 10 Z" fill="#fbbf24"/>
    <path d="M24 7.5 C22.8 9.2 22.8 10.5 24 11 C25.2 10.5 25.2 9.2 24 7.5 Z" fill="#f59e0b"/>
    <circle cx="24" cy="9.5" r="0.8" fill="#ffffff"/>
    <path d="M29 10 C28 11.2 28 12.2 29 13 C30 12.2 30 11.2 29 10 Z" fill="#fbbf24"/>

    <!-- Celebration Sparkles -->
    <path d="M7 16 L8 18 L10 19 L8 20 L7 22 L6 20 L4 19 L6 18 Z" fill="#fde047" opacity="0.9"/>
    <path d="M40 14 L41 15.5 L43 16 L41 16.5 L40 18 L39 16.5 L37 16 L39 15.5 Z" fill="#fde047" opacity="0.9"/>
  </g>
</svg>