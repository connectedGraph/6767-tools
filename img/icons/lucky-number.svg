<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ln-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ln-shoe" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ln-seven" x1="18" y1="14" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="ln-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#ln-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#ln-glow)">
    <!-- Golden Lucky Horseshoe -->
    <path d="M14 11 V22 C14 30 18.5 37 24 37 C29.5 37 34 30 34 22 V11 H28 V22 C28 25.5 26.5 29 24 29 C21.5 29 20 25.5 20 22 V11 Z" fill="url(#ln-shoe)" stroke="#fef08a" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Nail Holes on Horseshoe (6) -->
    <circle cx="17" cy="16" r="1" fill="#78350f"/>
    <circle cx="17" cy="22" r="1" fill="#78350f"/>
    <circle cx="18.5" cy="28" r="1" fill="#78350f"/>
    <circle cx="31" cy="16" r="1" fill="#78350f"/>
    <circle cx="31" cy="22" r="1" fill="#78350f"/>
    <circle cx="29.5" cy="28" r="1" fill="#78350f"/>

    <!-- Large 3D Lucky Number "7" in Center -->
    <path d="M20 16 H28 L23.5 32 H20.5 L24.5 19 H20 Z" fill="url(#ln-seven)" stroke="#0284c7" stroke-width="1" stroke-linejoin="round"/>

    <!-- Lucky 4-Leaf Clover Accent on Bottom Left -->
    <g transform="translate(9, 30) scale(0.7)">
      <circle cx="4" cy="2" r="2.5" fill="#34d399"/>
      <circle cx="2" cy="4" r="2.5" fill="#34d399"/>
      <circle cx="6" cy="4" r="2.5" fill="#34d399"/>
      <circle cx="4" cy="6" r="2.5" fill="#34d399"/>
      <path d="M4 6 Q3 9 1 10" stroke="#10b981" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Sparkles -->
    <polygon points="38,8 39,10 41,11 39,12 38,14 37,12 35,11 37,10" fill="#fde047"/>
  </g>
</svg>