<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31102e"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="sr-screen" x1="7" y1="9" x2="41" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#sr-bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Screen Monitor Frame -->
  <rect x="8" y="10" width="32" height="23" rx="3.5" fill="#0f172a" stroke="url(#sr-screen)" stroke-width="1.5"/>
  <!-- Monitor Stand -->
  <path d="M21 33L19 39H29L27 33" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="17" y1="39" x2="31" y2="39" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Rec Indicator Pulse Dot -->
  <circle cx="14" cy="16" r="2.2" fill="#ef4444" filter="url(#sr-glow)"/>
  <circle cx="14" cy="16" r="4.2" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="2 2"/>

  <!-- Video Camera Center Glyph -->
  <path d="M20 18H28C28.8 18 29.5 18.7 29.5 19.5V23.5C29.5 24.3 28.8 25 28 25H20C19.2 25 18.5 24.3 18.5 23.5V19.5C18.5 18.7 19.2 18 20 18Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M29.5 20.2L33.5 17.8C33.9 17.5 34.5 17.8 34.5 18.4V24.6C34.5 25.2 33.9 25.5 33.5 25.2L29.5 22.8V20.2Z" fill="#38bdf8"/>
  <circle cx="24" cy="21.5" r="1.5" fill="#0f172a"/>
</svg>
