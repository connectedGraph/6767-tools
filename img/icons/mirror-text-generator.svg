<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-mirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-mirror)" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Central Mirror Symmetry Line -->
  <path d="M24 7 L24 41" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>
  <polygon points="24,6 25.5,8 22.5,8" fill="#38bdf8"/>
  <polygon points="24,42 25.5,40 22.5,40" fill="#38bdf8"/>

