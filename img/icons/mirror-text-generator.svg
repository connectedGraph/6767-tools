  <path d="M11 23 C13 20.5 19 20.5 19 26 C19 31.5 13 31.5 11 29" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Mirrored Letter 'd' -->
