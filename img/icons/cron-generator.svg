<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-cron" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="cron-loop" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-cron)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Outer looping arrows ring -->
  <path d="M34 19a12.5 12.5 0 0 0-20-3.5L12 18" stroke="url(#cron-loop)" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="10 13 12 18 17 17" stroke="url(#cron-loop)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M14 29a12.5 12.5 0 0 0 20 3.5L36 30" stroke="url(#cron-loop)" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="38 35 36 30 31 31" stroke="url(#cron-loop)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clock hands in center -->
  <circle cx="24" cy="24" r="2" fill="#38bdf8"/>
  <line x1="24" y1="24" x2="24" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="29" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 4 Cron Schedule Nodes -->
  <circle cx="24" cy="11.5" r="1.2" fill="#e2e8f0"/>
  <circle cx="36.5" cy="24" r="1.2" fill="#e2e8f0"/>
  <circle cx="24" cy="36.5" r="1.2" fill="#e2e8f0"/>
  <circle cx="11.5" cy="24" r="1.2" fill="#e2e8f0"/>
</svg>
