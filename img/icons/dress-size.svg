<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="ds-dress" x1="14" y1="10" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ds-tag" x1="30" y1="18" x2="42" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="ds-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#ds-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#ds-glow)">
    <!-- Hanger at Top -->
    <path d="M24 7 C23 7 22 8 22 9 C22 10.5 24 11 24 11" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M19 12 L24 10 L29 12" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Evening Dress Silhouette -->
    <!-- Bodice -->
    <path d="M19 12 L17 19 C20 21 22 21 24 21 C26 21 28 21 31 19 L29 12 Z" fill="url(#ds-dress)" stroke="#fdf4ff" stroke-width="1.2"/>
    <!-- Waist Gold Sash -->
    <rect x="18" y="21" width="12" height="2.5" rx="0.5" fill="#fde047" stroke="#ffffff" stroke-width="0.6"/>
    <!-- Flared A-Line Skirt -->
    <path d="M18 23.5 L11 40 C18 42 30 42 37 40 L30 23.5 Z" fill="url(#ds-dress)" stroke="#fdf4ff" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Flowing Skirt Pleats -->
    <path d="M21 24 Q22 32 20 40.5" fill="none" stroke="#f0abfc" stroke-width="1" stroke-linecap="round"/>
    <path d="M24 24 V 41" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <path d="M27 24 Q26 32 28 40.5" fill="none" stroke="#f0abfc" stroke-width="1" stroke-linecap="round"/>

    <!-- Size Tag Floating Right -->
    <g transform="translate(32, 21) rotate(15)">
      <polygon points="0,0 8,0 10,4 8,8 0,8" fill="url(#ds-tag)" stroke="#ffffff" stroke-width="0.8"/>
      <circle cx="2" cy="4" r="0.8" fill="#78350f"/>
      <line x1="4.5" y1="2.5" x2="4.5" y2="5.5" stroke="#78350f" stroke-width="0.8"/>
    </g>
  </g>
</svg>