<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-vcalc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vcalc-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-vcalc)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  
  <!-- 3D Cylinder Body -->
  <path d="M11 14 v18 A13 5 0 0 0 37 32 v-18" fill="#0f172a" stroke="#60a5fa" stroke-width="1.4"/>
  
  <!-- Volumetric Liquid Fill -->
  <path d="M11 23 A13 5 0 0 0 37 23 v9 A13 5 0 0 1 11 32 z" fill="url(#vcalc-liquid)" opacity="0.85"/>
  <ellipse cx="24" cy="23" rx="13" ry="5" fill="#38bdf8" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
  
  <!-- Top Cylinder Face -->
  <ellipse cx="24" cy="14" rx="13" ry="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.4"/>
  
  <!-- Radius Dimension r -->
  <path d="M24 14 h11 m-1.8 -1.2 l1.8 1.2 l-1.8 1.2" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="29.5" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="3.2" font-weight="900" fill="#dbeafe">r</text>
  
  <!-- Height Dimension h -->
  <path d="M7 14 v18 m-1.2 -2 l1.2 2 l1.2 -2 m-2.4 -14 l1.2 -2 l1.2 2" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="5" y="24.5" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="3.5" font-weight="900" fill="#dbeafe">h</text>
  
  <!-- Center Formula V = πr²h -->
  <text x="24" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="4.5" font-weight="900" fill="#ffffff">V=πr²h</text>
</svg>
