<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="rtq-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="rtq-sun" x1="28" y1="8" x2="40" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rtq-chair" x1="10" y1="18" x2="28" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="rtq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#rtq-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#fb923c" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#rtq-glow)">
    <!-- Setting Sun & Sunrays -->
    <circle cx="34" cy="17" r="7" fill="url(#rtq-sun)"/>
    <line x1="34" y1="7" x2="34" y2="5" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="12" x2="44" y2="11" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="44" y1="19" x2="46" y2="20" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="11" x2="24" y2="10" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Horizon Line -->
    <line x1="7" y1="39" x2="41" y2="39" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Rocking Chair -->
    <!-- Curved Rocker Runner -->
    <path d="M10 39 Q 20 42, 32 37" fill="none" stroke="url(#rtq-chair)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Front and Rear Legs -->
    <line x1="16" y1="31" x2="14" y2="39" stroke="url(#rtq-chair)" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="31" x2="27" y2="37" stroke="url(#rtq-chair)" stroke-width="2" stroke-linecap="round"/>
    <!-- Seat -->
    <path d="M14 31 H 28" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Armrest -->
    <path d="M16 26 H 26" stroke="#fdba74" stroke-width="1.75" stroke-linecap="round"/>
    <line x1="24" y1="26" x2="25" y2="31" stroke="#fdba74" stroke-width="1.5"/>
    <!-- High Slanted Chair Back -->
    <line x1="15" y1="31" x2="18" y2="17" stroke="url(#rtq-chair)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="18" y1="31" x2="21" y2="17" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M17 17 Q 21 15, 23 17" fill="none" stroke="url(#rtq-chair)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>