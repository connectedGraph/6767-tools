<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-lc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="ruler-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-lc)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  
  <!-- Precision Ruler Body -->
  <rect x="8" y="12" width="32" height="13" rx="3" fill="url(#ruler-grad)" stroke="#38bdf8" stroke-width="1.3"/>
  
  <!-- Metric Ticks (Top) -->
  <path d="M11 12 v4.5 M14 12 v2.5 M17 12 v2.5 M20 12 v2.5 M24 12 v5 M28 12 v2.5 M31 12 v2.5 M34 12 v2.5 M37 12 v4.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
  
  <!-- Imperial Ticks (Bottom) -->
  <path d="M12 25 v-3.5 M18 25 v-2.2 M24 25 v-4 M30 25 v-2.2 M36 25 v-3.5" stroke="#fbbf24" stroke-width="1.1" stroke-linecap="round"/>
  
  <!-- Units Conversion Badges -->
  <g transform="translate(0, 1)">
    <!-- Meter Pill (m) -->
    <rect x="8" y="28.5" width="13" height="9.5" rx="3" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="14.5" y="35.3" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#e0f2fe">m</text>
    
    <!-- Bidirectional Arrows -->
    <path d="M22.5 32 h3 m-1.2 -1.5 l1.5 1.5 l-1.5 1.5 M25.5 34.5 h-3 m1.2 1.5 l-1.5 -1.5 l1.5 -1.5" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Foot Pill (ft) -->
    <rect x="27" y="28.5" width="13" height="9.5" rx="3" fill="#d97706" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1"/>
    <text x="33.5" y="35.3" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="900" fill="#fef3c7">ft</text>
  </g>
</svg>
