<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-base" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09051d"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="14" y1="24" x2="34" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-base)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Top-left: DEC 10 Badge -->
  <rect x="10" y="11" width="12" height="10" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="16" y="18.5" font-family="monospace" font-weight="bold" font-size="7.5" fill="#38bdf8" text-anchor="middle">10</text>

  <!-- Bottom-right: HEX 16 Badge -->
  <rect x="26" y="27" width="12" height="10" rx="3" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="32" y="34.5" font-family="monospace" font-weight="bold" font-size="7.5" fill="#c084fc" text-anchor="middle">16</text>

  <!-- Dynamic Curved Bidirectional Arrows -->
  <path d="M24 14h5a4 4 0 0 1 4 4v5" stroke="url(#arrow-grad)" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="30 20 33 23 36 20" stroke="url(#arrow-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M24 34h-5a4 4 0 0 1-4-4v-5" stroke="url(#arrow-grad)" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="18 28 15 25 12 28" stroke="url(#arrow-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <circle cx="15" cy="32" r="1" fill="#4ade80"/>
  <circle cx="33" cy="16" r="1" fill="#f472b6"/>
</svg>
