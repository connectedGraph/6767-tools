<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mac-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mac-house" x1="10" y1="12" x2="28" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="mac-gold" x1="28" y1="24" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="mac-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#mac-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#mac-glow)">
    <!-- House Silhouette -->
    <!-- Chimney -->
    <rect x="23" y="14" width="3" height="5" rx="0.5" fill="#a5b4fc"/>
    <!-- Roof & Body -->
    <path d="M9 22 L19 13 L29 22 H26 V35 H12 V22 Z" fill="url(#mac-house)" stroke="#c7d2fe" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Window & Door -->
    <rect x="15" y="22" width="4" height="4" rx="0.5" fill="#fde047" fill-opacity="0.9"/>
    <rect x="16" y="29" width="5" height="6" rx="0.5" fill="#312e81"/>

    <!-- Interest Comparison Curve with Arrow -->
    <path d="M11 36 Q 22 28, 30 18 L 38 10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <polyline points="33,10 38,10 38,15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stacked Gold Coins on right -->
    <!-- Coin 1 (Bottom) -->
    <ellipse cx="34" cy="35" rx="6.5" ry="2.2" fill="#b45309"/>
    <ellipse cx="34" cy="33.5" rx="6.5" ry="2.2" fill="url(#mac-gold)"/>
    <!-- Coin 2 (Middle) -->
    <ellipse cx="34" cy="30" rx="6.5" ry="2.2" fill="#b45309"/>
    <ellipse cx="34" cy="28.5" rx="6.5" ry="2.2" fill="url(#mac-gold)"/>
    <!-- Coin 3 (Top) -->
    <ellipse cx="34" cy="25" rx="6.5" ry="2.2" fill="#b45309"/>
    <ellipse cx="34" cy="23.5" rx="6.5" ry="2.2" fill="url(#mac-gold)" stroke="#fef08a" stroke-width="0.8"/>
  </g>
</svg>