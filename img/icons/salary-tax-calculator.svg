<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="stc-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="stc-bill" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="stc-coin" x1="26" y1="24" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="stc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#stc-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#stc-glow)">
    <!-- Paycheck Slip -->
    <rect x="10" y="10" width="22" height="28" rx="2.5" fill="url(#stc-bill)" fill-opacity="0.95"/>
    <!-- Top header bar on slip -->
    <path d="M10 12.5 C10 11.1 11.1 10 12.5 10 H29.5 C30.9 10 32 11.1 32 12.5 V15 H10 Z" fill="#0d9488"/>
    <!-- Paycheck detail lines -->
    <line x1="14" y1="19" x2="28" y2="19" stroke="#0f766e" stroke-width="1.75" stroke-linecap="round"/>
    <line x1="14" y1="23" x2="24" y2="23" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="27" x2="21" y2="27" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Minus/tax line -->
    <line x1="14" y1="31" x2="20" y2="31" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="23" cy="31" r="1" fill="#f43f5e"/>
    
    <!-- Coin / Calculator Tax Badge -->
    <circle cx="33" cy="30" r="9" fill="url(#stc-coin)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Percentage Symbol on Coin -->
    <path d="M29.5 33.5 L36.5 26.5" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="31" cy="28" r="1.2" fill="#78350f"/>
    <circle cx="35" cy="32" r="1.2" fill="#78350f"/>
  </g>
</svg>