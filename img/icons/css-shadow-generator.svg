<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-cshadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="card-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-cshadow)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Light Source Sun at Top-Left -->
  <circle cx="8" cy="8" r="2.8" fill="#FDE047"/>
  <path d="M11 11l3 3" stroke="#FDE047" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Multi-Layer Soft Drop Shadows Beneath Card -->
  <!-- Deep Ambience Blur Layer -->
  <rect x="15" y="18" width="22" height="18" rx="4" fill="#000000" fill-opacity="0.45"/>
  <!-- Vibrant Glow Shadow Layer -->
  <rect x="17" y="20" width="22" height="18" rx="4" fill="#8B5CF6" fill-opacity="0.55"/>
  <!-- Elevated Floating White/Glass Card -->
  <rect x="10" y="11" width="22" height="18" rx="4" fill="url(#card-front)" stroke="#FFFFFF" stroke-width="1.8"/>
  <!-- UI Details on Floating Card -->
  <circle cx="15" cy="15.5" r="2" fill="#3B82F6"/>
  <line x1="19" y1="15.5" x2="27" y2="15.5" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13.5" y1="20" x2="25" y2="20" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="13.5" y1="23.5" x2="20" y2="23.5" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Shadow Offset Caliper Guide in Bottom-Right -->
  <path d="M34 20v14h-14" fill="none" stroke="#FDE047" stroke-width="1.4" stroke-dasharray="2.5 1.5"/>
  <text x="36" y="31" fill="#FDE047" font-family="system-ui, sans-serif" font-weight="900" font-size="4.2">XY</text>
</svg>
