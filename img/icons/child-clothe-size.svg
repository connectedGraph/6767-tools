<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ccs-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="ccs-suit" x1="10" y1="12" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ccs-ruler" x1="34" y1="10" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="ccs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#ccs-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#ccs-glow)">
    <!-- Baby Romper / Onesie -->
    <!-- Round Neckline -->
    <path d="M15 14 L8 19 L11 23 L14 20 V31 L17 38 H21 L22 34 L23 38 H27 L30 31 V20 L33 23 L36 19 L29 14 C27 17 17 17 15 14 Z" fill="url(#ccs-suit)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Cute Pocket / Bear Motif -->
    <rect x="18" y="22" width="8" height="6" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="20.5" cy="24.5" r="0.7" fill="#0284c7"/>
    <circle cx="23.5" cy="24.5" r="0.7" fill="#0284c7"/>
    <path d="M21 26 Q22 27 23 26" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Bottom Snap Buttons -->
    <circle cx="22" cy="36" r="0.8" fill="#fde047"/>

    <!-- Growth Height Chart / Ruler on the right -->
    <rect x="37" y="10" width="4.5" height="28" rx="1" fill="url(#ccs-ruler)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Ruler markings -->
    <line x1="37" y1="14" x2="39.5" y2="14" stroke="#854d0e" stroke-width="1"/>
    <line x1="37" y1="18" x2="40.5" y2="18" stroke="#854d0e" stroke-width="1.2"/>
    <line x1="37" y1="22" x2="39.5" y2="22" stroke="#854d0e" stroke-width="1"/>
    <line x1="37" y1="26" x2="40.5" y2="26" stroke="#854d0e" stroke-width="1.2"/>
    <line x1="37" y1="30" x2="39.5" y2="30" stroke="#854d0e" stroke-width="1"/>
    <line x1="37" y1="34" x2="40.5" y2="34" stroke="#854d0e" stroke-width="1.2"/>

    <!-- Little Star at Ruler Top -->
    <polygon points="39,6 39.7,7.8 41.5,8 40.1,9.2 40.5,11 39,10 37.5,11 37.9,9.2 36.5,8 38.3,7.8" fill="#fde047"/>
  </g>
</svg>