<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="dc-cal" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="dc-clock" x1="24" y1="22" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#dc-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#dc-glow)">
    <!-- Calendar Body -->
    <rect x="9" y="11" width="28" height="26" rx="3.5" fill="url(#dc-cal)"/>
    <!-- Top red/coral header -->
    <path d="M9 14.5 C9 12.6 10.6 11 12.5 11 H33.5 C35.4 11 37 12.6 37 14.5 V18 H9 Z" fill="#ef4444"/>
    <!-- Binding Rings -->
    <rect x="15" y="8" width="3" height="5" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
    <rect x="28" y="8" width="3" height="5" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
    <!-- Calendar Grid Items -->
    <rect x="13" y="22" width="3" height="3" rx="0.5" fill="#94a3b8"/>
    <rect x="19" y="22" width="3" height="3" rx="0.5" fill="#94a3b8"/>
    <rect x="25" y="22" width="3" height="3" rx="0.5" fill="#94a3b8"/>
    <rect x="13" y="28" width="3" height="3" rx="0.5" fill="#94a3b8"/>
    <rect x="19" y="28" width="3" height="3" rx="0.5" fill="#38bdf8"/>
    
    <!-- Interval Arrow / Count Badge -->
    <line x1="14" y1="33" x2="22" y2="33" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Clock / Countdown Timer Overlay -->
    <circle cx="33" cy="31" r="8.5" fill="url(#dc-clock)" stroke="#ffffff" stroke-width="1.75"/>
    <circle cx="33" cy="31" r="1.2" fill="#ffffff"/>
    <polyline points="33,26 33,31 36.5,31" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>