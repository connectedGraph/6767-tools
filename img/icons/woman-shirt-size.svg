<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="wss-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="wss-blouse" x1="10" y1="12" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="wss-tag" x1="20" y1="6" x2="28" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="wss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#wss-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#fda4af" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#wss-glow)">
    <!-- Elegant Blouse Silhouette -->
    <!-- Sleeves and Body -->
    <path d="M18 12 L10 18 L13 23 L16 20 V38 H32 V20 L35 23 L38 18 L30 12 Z" fill="url(#wss-blouse)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- V-Neck Collar Lapels -->
    <path d="M18 12 L24 20 L30 12" fill="#fff1f2" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="18,12 24,20 22,21 16,14" fill="#ffffff"/>
    <polygon points="30,12 24,20 26,21 32,14" fill="#ffffff"/>

    <!-- Center Button Placket -->
    <line x1="24" y1="20" x2="24" y2="38" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Small Pearl Buttons -->
    <circle cx="24" cy="24" r="1" fill="#fde047"/>
    <circle cx="24" cy="29" r="1" fill="#fde047"/>
    <circle cx="24" cy="34" r="1" fill="#fde047"/>

    <!-- Hanging Collar Size Label -->
    <rect x="21.5" y="7.5" width="5" height="5.5" rx="1" fill="url(#wss-tag)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- "S" on label -->
    <path d="M23 9 C23 8.5 25 8.5 25 9.2 C25 9.8 23 9.8 23 10.5 C23 11.2 25 11.2 25 10.8" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>