<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="wn-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#06282d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="wn-wave" x1="6" y1="20" x2="42" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="wn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#wn-bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Moon and Stars -->
  <path d="M33 13C33 16.31 30.31 19 27 19C26.17 19 25.39 18.83 24.67 18.53C26.1 20.65 28.51 22 31.25 22C35.25 22 38.5 18.75 38.5 14.75C38.5 13.06 37.92 11.5 36.95 10.27C35.73 11.95 34.02 13 33 13Z" fill="#38bdf8" opacity="0.85"/>
  <circle cx="15" cy="14" r="1" fill="#34d399" opacity="0.8"/>
  <circle cx="21" cy="11" r="0.75" fill="#22d3ee" opacity="0.9"/>
  <circle cx="12" cy="19" r="0.6" fill="#a7f3d0" opacity="0.7"/>

  <!-- Audio Wave Bars -->
  <g filter="url(#wn-glow)" stroke="url(#wn-wave)" stroke-width="2.2" stroke-linecap="round">
    <line x1="10" y1="26" x2="10" y2="30"/>
    <line x1="15" y1="22" x2="15" y2="34"/>
    <line x1="20" y1="18" x2="20" y2="38"/>
    <line x1="24" y1="15" x2="24" y2="41"/>
    <line x1="28" y1="20" x2="28" y2="36"/>
    <line x1="33" y1="23" x2="33" y2="33"/>
    <line x1="38" y1="26" x2="38" y2="30"/>
  </g>

  <!-- Rippling Water Arc -->
  <path d="M8 38C12 36 16 40 20 38C24 36 28 40 32 38C36 36 40 40 44 38" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>
