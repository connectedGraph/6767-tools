<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-perim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142503"/>
      <stop offset="50%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-perim)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(163,230,53,0.25)" stroke-width="1"/>
  
  <!-- Polygon Inner Body -->
  <polygon points="24,9 39,18 34,37 14,37 9,18" fill="#1e293b" fill-opacity="0.5" stroke="#4d7c0f" stroke-width="1.2"/>
  
  <!-- Highlighted Glowing Perimeter Stroke -->
  <polygon points="24,9 39,18 34,37 14,37 9,18" fill="none" stroke="#a3e635" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 2.2"/>
  
  <!-- Corner Vertex Nodes -->
  <circle cx="24" cy="9" r="2.2" fill="#bef264" stroke="#1a2e05" stroke-width="1"/>
  <circle cx="39" cy="18" r="2.2" fill="#bef264" stroke="#1a2e05" stroke-width="1"/>
  <circle cx="34" cy="37" r="2.2" fill="#bef264" stroke="#1a2e05" stroke-width="1"/>
  <circle cx="14" cy="37" r="2.2" fill="#bef264" stroke="#1a2e05" stroke-width="1"/>
  <circle cx="9" cy="18" r="2.2" fill="#bef264" stroke="#1a2e05" stroke-width="1"/>
  
  <!-- Center Perimeter Symbol (P = ΣL) -->
  <text x="24" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff">P</text>
</svg>
