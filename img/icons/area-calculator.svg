      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="tri-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-acalc)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(251,113,133,0.25)" stroke-width="1"/>
  
