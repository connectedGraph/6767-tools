<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-prop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-prop)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(232,121,249,0.25)" stroke-width="1"/>
  
  <!-- Glowing Cross-Multiplication Diagonals -->
  <path d="M15 15 L33 33" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="2.5 1.5"/>
  <path d="M15 33 L33 15" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="2.5 1.5"/>
  
  <!-- Center Equals Sign -->
  <circle cx="24" cy="24" r="5" fill="#4a044e" stroke="#f472b6" stroke-width="1"/>
  <path d="M21.5 22.5 h5 M21.5 25.5 h5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 4 Ratio Nodes: A, B, C, D -->
  <!-- Node A (Top Left) -->
  <circle cx="14" cy="14" r="5" fill="#581c87" stroke="#c084fc" stroke-width="1.3"/>
  <text x="14" y="16.2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#ffffff">A</text>
  
  <!-- Node B (Bottom Left) -->
  <circle cx="14" cy="34" r="5" fill="#581c87" stroke="#c084fc" stroke-width="1.3"/>
  <text x="14" y="36.2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#ffffff">B</text>
  
  <!-- Node C (Top Right) -->
  <circle cx="34" cy="14" r="5" fill="#581c87" stroke="#c084fc" stroke-width="1.3"/>
  <text x="34" y="16.2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#ffffff">C</text>
  
  <!-- Node D (Bottom Right) -->
  <circle cx="34" cy="34" r="5" fill="#581c87" stroke="#c084fc" stroke-width="1.3"/>
  <text x="34" y="36.2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#ffffff">D</text>
  
  <!-- Ratio Colons -->
  <circle cx="14" cy="24" r="1" fill="#f472b6"/>
  <circle cx="34" cy="24" r="1" fill="#f472b6"/>
</svg>
