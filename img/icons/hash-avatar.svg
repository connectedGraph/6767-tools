<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ha-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ha-frame" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="ha-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#ha-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#ha-glow)">
    <!-- Cyber Avatar Outer Frame -->
    <rect x="10" y="10" width="28" height="28" rx="4" fill="url(#ha-frame)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- 5x5 Identicon Pixel Matrix Grid -->
    <!-- Row 1: Y=13 (Antenna / Crest) -->
    <rect x="22" y="13" width="4" height="4" rx="1" fill="#fde047"/>

    <!-- Row 2: Y=18 (Forehead / Horns) -->
    <rect x="13.5" y="18" width="4.5" height="4" rx="1" fill="#38bdf8"/>
    <rect x="22" y="18" width="4" height="4" rx="0.5" fill="#f43f5e"/>
    <rect x="30" y="18" width="4.5" height="4" rx="1" fill="#38bdf8"/>

    <!-- Row 3: Y=23 (Glowing Cyber Eyes) -->
    <rect x="13.5" y="23" width="4.5" height="4" rx="1" fill="#22d3ee"/>
    <rect x="19" y="23" width="4.5" height="4" rx="1" fill="#ffffff"/>
    <rect x="24.5" y="23" width="4.5" height="4" rx="1" fill="#ffffff"/>
    <rect x="30" y="23" width="4.5" height="4" rx="1" fill="#22d3ee"/>

    <!-- Pupils -->
    <rect x="20.5" y="24.5" width="2" height="2" fill="#0284c7"/>
    <rect x="25.5" y="24.5" width="2" height="2" fill="#0284c7"/>

    <!-- Row 4: Y=28 (Cheeks & Mouth) -->
    <rect x="18" y="28" width="4" height="3.5" rx="0.5" fill="#f472b6"/>
    <rect x="22.5" y="29" width="3" height="2" rx="0.5" fill="#38bdf8"/>
    <rect x="26" y="28" width="4" height="3.5" rx="0.5" fill="#f472b6"/>

    <!-- Row 5: Y=32.5 (Chin) -->
    <rect x="20" y="33" width="8" height="3" rx="1" fill="#38bdf8"/>

    <!-- Corner Circuit Decors -->
    <circle cx="8" cy="8" r="1.2" fill="#38bdf8"/>
    <circle cx="40" cy="8" r="1.2" fill="#f43f5e"/>
    <circle cx="8" cy="40" r="1.2" fill="#22c55e"/>
    <circle cx="40" cy="40" r="1.2" fill="#fde047"/>
  </g>
</svg>