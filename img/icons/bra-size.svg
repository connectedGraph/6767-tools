<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bra-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86198f"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
    <linearGradient id="bra-silk" x1="12" y1="12" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bra-tape" x1="8" y1="32" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="bra-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bra-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#bra-glow)">
    <!-- Straps -->
    <path d="M17 11 L19 21" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M31 11 L29 21" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bra Cups Silhouette -->
    <!-- Left Cup -->
    <path d="M10 24 C9 18 17 17 21 21 C23.5 23.5 23.5 28 20 29 C15 30 11 28 10 24 Z" fill="url(#bra-silk)" stroke="#fdf2f8" stroke-width="1.2"/>
    <!-- Right Cup -->
    <path d="M38 24 C39 18 31 17 27 21 C24.5 23.5 24.5 28 28 29 C33 30 37 28 38 24 Z" fill="url(#bra-silk)" stroke="#fdf2f8" stroke-width="1.2"/>
    <!-- Center Bridge & Bow/Gem -->
    <path d="M21 24 H27" stroke="#fdf2f8" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="1.5" fill="#fde047"/>

    <!-- Tape Measure Ribbon Underneath -->
    <path d="M8 35 Q 24 40, 40 35" fill="none" stroke="url(#bra-tape)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Ruler Ticks -->
    <line x1="14" y1="34" x2="14" y2="37.5" stroke="#854d0e" stroke-width="1"/>
    <line x1="19" y1="35.5" x2="19" y2="38.5" stroke="#854d0e" stroke-width="1.2"/>
    <line x1="24" y1="36" x2="24" y2="39" stroke="#854d0e" stroke-width="1"/>
    <line x1="29" y1="35.5" x2="29" y2="38.5" stroke="#854d0e" stroke-width="1.2"/>
    <line x1="34" y1="34" x2="34" y2="37.5" stroke="#854d0e" stroke-width="1"/>
  </g>
</svg>