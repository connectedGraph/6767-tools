<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="lw-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="lw-gold" x1="20" y1="4" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="lw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#lw-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#lw-glow)">
    <!-- Main Wheel Outer Ring -->
    <circle cx="24" cy="27" r="14.5" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>

    <!-- 6 Colored Wheel Wedges -->
    <!-- Wedge 1 (Top Right - Ruby) -->
    <path d="M24 27 L24 13.5 A13.5 13.5 0 0 1 35.7 20.25 Z" fill="#f43f5e"/>
    <!-- Wedge 2 (Right - Gold) -->
    <path d="M24 27 L35.7 20.25 A13.5 13.5 0 0 1 35.7 33.75 Z" fill="#fbbf24"/>
    <!-- Wedge 3 (Bottom Right - Emerald) -->
    <path d="M24 27 L35.7 33.75 A13.5 13.5 0 0 1 24 40.5 Z" fill="#10b981"/>
    <!-- Wedge 4 (Bottom Left - Cyan) -->
    <path d="M24 27 L24 40.5 A13.5 13.5 0 0 1 12.3 33.75 Z" fill="#06b6d4"/>
    <!-- Wedge 5 (Left - Purple) -->
    <path d="M24 27 L12.3 33.75 A13.5 13.5 0 0 1 12.3 20.25 Z" fill="#a855f7"/>
    <!-- Wedge 6 (Top Left - Orange) -->
    <path d="M24 27 L12.3 20.25 A13.5 13.5 0 0 1 24 13.5 Z" fill="#f97316"/>

    <!-- Outer Rim Light Pegs (6) -->
    <circle cx="24" cy="14" r="1" fill="#ffffff"/>
    <circle cx="35" cy="20.5" r="1" fill="#ffffff"/>
    <circle cx="35" cy="33.5" r="1" fill="#ffffff"/>
    <circle cx="24" cy="40" r="1" fill="#ffffff"/>
    <circle cx="13" cy="33.5" r="1" fill="#ffffff"/>
    <circle cx="13" cy="20.5" r="1" fill="#ffffff"/>

    <!-- Center Hub & Star -->
    <circle cx="24" cy="27" r="4.5" fill="#fde047" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="24" cy="27" r="2" fill="#b45309"/>

    <!-- Top Indicating Pointer Needle -->
    <polygon points="24,16 20,7 28,7" fill="url(#lw-gold)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="24" cy="8.5" r="1" fill="#ffffff"/>
  </g>
</svg>