<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-wifi-qr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-wifi-qr)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  
  <!-- WiFi Signal Arcs at Top -->
  <path d="M14 14.5 A14 14 0 0 1 34 14.5" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M18.5 18 A8 8 0 0 1 29.5 18" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="24" cy="21.5" r="1.6" fill="#FDE047"/>

  <!-- QR Code Frame -->
  <rect x="10" y="24" width="28" height="18" rx="4" fill="#090F1D" stroke="url(#neon-cyan)" stroke-width="1.4"/>
  
  <!-- QR Eyes -->
  <!-- Eye Left -->
  <rect x="13" y="27" width="6" height="6" rx="1.2" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="14.8" y="28.8" width="2.4" height="2.4" rx="0.5" fill="#38BDF8"/>
  
  <!-- Eye Right -->
  <rect x="29" y="27" width="6" height="6" rx="1.2" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="30.8" y="28.8" width="2.4" height="2.4" rx="0.5" fill="#38BDF8"/>

  <!-- QR Matrix Dots -->
  <rect x="21" y="27" width="2.2" height="2.2" rx="0.5" fill="#2DD4BF"/>
  <rect x="25" y="27" width="2.2" height="2.2" rx="0.5" fill="#2DD4BF"/>
  <rect x="21" y="31" width="2.2" height="2.2" rx="0.5" fill="#2DD4BF"/>
  <rect x="25" y="31" width="2.2" height="2.2" rx="0.5" fill="#FDE047"/>

  <!-- Bottom QR Bits -->
  <rect x="13" y="35.5" width="2.2" height="2.2" rx="0.5" fill="#38BDF8"/>
  <rect x="17" y="35.5" width="2.2" height="2.2" rx="0.5" fill="#38BDF8"/>
  <rect x="21" y="35.5" width="6" height="2.2" rx="0.5" fill="#2DD4BF"/>
  <rect x="29" y="35.5" width="2.2" height="2.2" rx="0.5" fill="#38BDF8"/>
  <rect x="33" y="35.5" width="2.2" height="2.2" rx="0.5" fill="#38BDF8"/>

  <!-- Fast Scan Corner Brackets -->
  <path d="M7 26v-3h3" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41 26v-3h-3" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M7 40v3h3" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41 40v3h-3" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
</svg>
