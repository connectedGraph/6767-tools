<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-run" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d06"/>
      <stop offset="50%" stop-color="#4d1609"/>
      <stop offset="100%" stop-color="#1c0703"/>
    </linearGradient>
    <linearGradient id="runner-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow-run" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-run)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(251, 146, 60, 0.25)" stroke-width="1"/>
  
  <!-- Calorie Flame Trail behind runner -->
  <path d="M10 28 C7 24 9 20 14 18 C12 21 14 23 18 22 C15 25 17 28 13 32 C17 30 19 33 15 37 C21 34 23 28 20 24" fill="url(#runner-fire)" opacity="0.75" filter="url(#glow-run)"/>
  
  <!-- Athletic Runner Figure (Forward sprint motion) -->
  <!-- Head -->
  <circle cx="31" cy="12" r="3" fill="#ffffff"/>
  <!-- Torso & Upper Arm -->
  <path d="M29 16 L24 25 L29 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Arm (Pumping forward) -->
  <path d="M28 19 L35 20 L35 15" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm (Trailing back) -->
  <path d="M27 19 L21 21 L19 26" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lead Leg (High knee & kick) -->
  <path d="M24 25 L31 29 L35 37" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trail Leg -->
  <path d="M24 25 L18 28 L14 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Speed track dashes -->
  <line x1="20" y1="41" x2="38" y2="41" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="12" y1="41" x2="16" y2="41" stroke="#fde047" stroke-width="1.8" stroke-linecap="round"/>
</svg>
