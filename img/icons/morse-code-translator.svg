<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mct-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="mct-brass" x1="12" y1="20" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="mct-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#mct-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#mct-glow)">
    <!-- Morse Code Signals at Top (· — · ·) -->
    <circle cx="11" cy="11" r="2" fill="#38bdf8"/>
    <rect x="16" y="9.5" width="7" height="3" rx="1.5" fill="#fde047"/>
    <circle cx="27" cy="11" r="2" fill="#38bdf8"/>
    <rect x="32" y="9.5" width="7" height="3" rx="1.5" fill="#fde047"/>

    <!-- Radio Waves radiating from key -->
    <path d="M30 18 A5 5 0 0 0 25 23" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M34 16 A9 9 0 0 0 23 25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Telegraph Key Base Platform -->
    <rect x="8" y="34" width="32" height="4.5" rx="1.5" fill="#78350f" stroke="#b45309" stroke-width="1"/>
    <!-- Screws/Terminals on Base -->
    <circle cx="12" cy="36.25" r="1" fill="#fde047"/>
    <circle cx="36" cy="36.25" r="1" fill="#fde047"/>

    <!-- Fulcrum Pivot Bracket -->
    <rect x="18" y="27" width="5" height="7" rx="0.5" fill="url(#mct-brass)" stroke="#ffffff" stroke-width="0.6"/>
    <circle cx="20.5" cy="30.5" r="1" fill="#451a03"/>

    <!-- Lever Arm and Knob -->
    <path d="M12 28.5 L31 25" stroke="url(#mct-brass)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Contact Point Pillar -->
    <rect x="29.5" y="29" width="3" height="5" fill="#fde047"/>

    <!-- Ergonomic Black / Brass Finger Knob -->
    <ellipse cx="31" cy="22" rx="4.5" ry="3" fill="#1c1917" stroke="url(#mct-brass)" stroke-width="1.5"/>
    <circle cx="31" cy="22" r="1.5" fill="#fde047"/>
  </g>
</svg>