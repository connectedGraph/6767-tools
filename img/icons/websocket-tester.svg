<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-ws" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c44"/>
      <stop offset="100%" stop-color="#090f1d"/>
    </linearGradient>
    <linearGradient id="ws-cyan" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="ws-pulse" x1="12" y1="24" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-ws)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Socket Plug & Waves -->
  <!-- Left Endpoint Node -->
  <circle cx="13" cy="24" r="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="13" cy="24" r="1.5" fill="#38bdf8"/>

  <!-- Right Endpoint Node -->
  <circle cx="35" cy="24" r="4" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <circle cx="35" cy="24" r="1.5" fill="#34d399"/>

  <!-- Full-Duplex Bi-directional Wave Line -->
  <path d="M17 24h3l2.5-7 3 14 3-10 2.5 5 2-2h2" stroke="url(#ws-pulse)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Radio Transmission Broadcast Waves (Top & Bottom) -->
  <path d="M19 12a8 8 0 0 1 10 0" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M16 9a13 13 0 0 1 16 0" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.4"/>
  
  <path d="M19 36a8 8 0 0 0 10 0" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M16 39a13 13 0 0 0 16 0" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
