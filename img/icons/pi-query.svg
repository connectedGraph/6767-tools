<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-pi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gold-pi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-pi)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  
  <!-- Orbit Ring around Pi -->
  <ellipse cx="24" cy="22" rx="16" ry="7" transform="rotate(-15 24 22)" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  
  <!-- Golden Greek Pi Symbol -->
  <g transform="translate(0, -2)">
    <!-- Top Horizontal Bar -->
    <path d="M12 16 Q12 14 15 14 H33 Q36 14 36 16 Q34 17.5 31 17.5 H17 Q14 17.5 12 16 Z" fill="url(#gold-pi)" stroke="#fef08a" stroke-width="0.6"/>
    <!-- Left Leg -->
    <path d="M18.5 16.5 V30.5 Q18.5 33 16 33.5 Q14.5 33.8 14.5 32 Q15 30 15.5 29 V16.5 Z" fill="url(#gold-pi)" stroke="#fef08a" stroke-width="0.6"/>
    <!-- Right Leg -->
    <path d="M26.5 16.5 V29.5 Q26.5 33 29 33.5 Q32 34 33.5 31.5 Q34 32.5 33 33.5 Q30.5 35 26.5 34 Q24 33 24 29 V16.5 Z" fill="url(#gold-pi)" stroke="#fef08a" stroke-width="0.6"/>
    
    <!-- Starburst Glint -->
    <polygon points="14,13 15,10.5 16,13 18.5,14 16,15 15,17.5 14,15 11.5,14" fill="#ffffff"/>
  </g>
  
  <!-- Pi Decimal Trail Badge: 3.14159... -->
  <rect x="9" y="35.5" width="30" height="7.5" rx="3.75" fill="#451a03" fill-opacity="0.85" stroke="#fbbf24" stroke-width="0.9"/>
  <text x="24" y="40.8" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="4" font-weight="900" fill="#fef08a" letter-spacing="0.3">3.14159265...</text>
</svg>
