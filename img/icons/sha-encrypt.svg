<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-sha" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0314"/>
    </linearGradient>
    <linearGradient id="sha-chain" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sha-lock" x1="20" y1="20" x2="28" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-sha)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 3 Merkle Hash Chained Node Blocks -->
  <rect x="19" y="10" width="10" height="7" rx="2" fill="#312e81" stroke="url(#sha-chain)" stroke-width="1.8"/>
  <text x="24" y="15.2" font-family="monospace" font-size="4" fill="#e0e7ff" font-weight="bold" text-anchor="middle">H0</text>

  <rect x="10" y="29" width="10" height="7" rx="2" fill="#312e81" stroke="url(#sha-chain)" stroke-width="1.8"/>
  <text x="15" y="34.2" font-family="monospace" font-size="4" fill="#e0e7ff" font-weight="bold" text-anchor="middle">H1</text>

  <rect x="28" y="29" width="10" height="7" rx="2" fill="#312e81" stroke="url(#sha-chain)" stroke-width="1.8"/>
  <text x="33" y="34.2" font-family="monospace" font-size="4" fill="#e0e7ff" font-weight="bold" text-anchor="middle">H2</text>

  <!-- Chained lines -->
  <path d="M21 17L15 29M27 17L33 29M20 32.5h8" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2"/>

  <!-- Central Lock Seal -->
