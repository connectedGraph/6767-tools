  <path d="M22 23v-1.5a2 2 0 0 1 4 0V23" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="21" y="23" width="6" height="4.5" rx="1" fill="url(#sha-lock)"/>
  <circle cx="24" cy="25" r="0.6" fill="#ffffff"/>
