<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="wcs-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="wcs-body" x1="16" y1="12" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="wcs-tape" x1="12" y1="22" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="wcs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#wcs-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#fb7185" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#wcs-glow)">
    <!-- Stand / Base Pole -->
    <line x1="24" y1="33" x2="24" y2="41" stroke="#fbcfe8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M17 41 H31" stroke="#fbcfe8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Mannequin Neck Finial -->
    <circle cx="24" cy="9.5" r="2" fill="#fbbf24" stroke="#fde047" stroke-width="0.8"/>

    <!-- Dressmaker Mannequin Torso -->
    <path d="M21 11 H27 L31 16 C28 19 28 23 29 33 H19 C20 23 20 19 17 16 Z" fill="url(#wcs-body)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Measuring Tape Wrapped Around Waist -->
    <path d="M15 24 Q 24 28, 33 24" fill="none" stroke="url(#wcs-tape)" stroke-width="3" stroke-linecap="round"/>
    <!-- Tape Ticks -->
    <line x1="18" y1="24.5" x2="18" y2="26.5" stroke="#78350f" stroke-width="0.8"/>
    <line x1="22" y1="25.5" x2="22" y2="27.5" stroke="#78350f" stroke-width="0.8"/>
    <line x1="26" y1="25.5" x2="26" y2="27.5" stroke="#78350f" stroke-width="0.8"/>
    <line x1="30" y1="24.5" x2="30" y2="26.5" stroke="#78350f" stroke-width="0.8"/>

    <!-- Diagonal Tailor Bust Line -->
    <path d="M24 11 V20" stroke="#f43f5e" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  </g>
</svg>