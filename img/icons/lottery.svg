<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="lot-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="lot-ticket" x1="8" y1="12" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="lot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#lot-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#lot-glow)">
    <!-- Golden Lottery Ticket Card with Notches -->
    <path d="M9 16 C9 14.5 10.5 13 12 13 H36 C37.5 13 39 14.5 39 16 V22 C37.5 22 36.5 23 36.5 24.5 C36.5 26 37.5 27 39 27 V33 C39 34.5 37.5 36 36 36 H12 C10.5 36 9 34.5 9 33 V27 C10.5 27 11.5 26 11.5 24.5 C11.5 23 10.5 22 9 22 Z" fill="url(#lot-ticket)" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Perforated Stub Divider Line -->
    <line x1="30" y1="14" x2="30" y2="35" stroke="#78350f" stroke-width="1.5" stroke-dasharray="2 1.5"/>

    <!-- Large Golden Star Motif on Main Ticket -->
    <polygon points="19,17 20.5,21 25,21.5 21.7,24.5 22.7,29 19,26.5 15.3,29 16.3,24.5 13,21.5 17.5,21" fill="#78350f"/>
    <circle cx="19" cy="23.5" r="1.5" fill="#fef08a"/>

    <!-- Stub Barcode Lines -->
    <line x1="33" y1="18" x2="33" y2="31" stroke="#78350f" stroke-width="1.2"/>
    <line x1="35" y1="18" x2="35" y2="31" stroke="#78350f" stroke-width="0.8"/>
    <line x1="37" y1="18" x2="37" y2="31" stroke="#78350f" stroke-width="1.5"/>

    <!-- Sparkling 4-point Stars around ticket -->
    <path d="M7 11 L8 13 L10 14 L8 15 L7 17 L6 15 L4 14 L6 13 Z" fill="#fde047"/>
    <path d="M41 9 L42 10.5 L44 11 L42 11.5 L41 13 L40 11.5 L38 11 L40 10.5 Z" fill="#fde047"/>
    <path d="M22 39 L23 40.5 L25 41 L23 41.5 L22 43 L21 41.5 L19 41 L21 40.5 Z" fill="#fde047"/>
  </g>
</svg>