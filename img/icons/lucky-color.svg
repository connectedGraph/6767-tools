<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="lc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#lc-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#lc-glow)">
    <!-- Constellation Zodiac Star Orbit Ring -->
    <circle cx="24" cy="24" r="15" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

    <!-- Connected Constellation Nodes -->
    <line x1="24" y1="9" x2="35" y2="16" stroke="#c7d2fe" stroke-width="0.8" opacity="0.7"/>
    <line x1="35" y1="16" x2="37" y2="29" stroke="#c7d2fe" stroke-width="0.8" opacity="0.7"/>
    <line x1="37" y1="29" x2="24" y2="39" stroke="#c7d2fe" stroke-width="0.8" opacity="0.7"/>
    <line x1="24" y1="39" x2="11" y2="29" stroke="#c7d2fe" stroke-width="0.8" opacity="0.7"/>
    <line x1="11" y1="29" x2="13" y2="16" stroke="#c7d2fe" stroke-width="0.8" opacity="0.7"/>
    <line x1="13" y1="16" x2="24" y2="9" stroke="#c7d2fe" stroke-width="0.8" opacity="0.7"/>

    <!-- Star Nodes (Glowing Colors) -->
    <circle cx="24" cy="9" r="1.8" fill="#f43f5e"/>
    <circle cx="35" cy="16" r="1.8" fill="#fbbf24"/>
    <circle cx="37" cy="29" r="1.8" fill="#10b981"/>
    <circle cx="24" cy="39" r="1.8" fill="#06b6d4"/>
    <circle cx="11" cy="29" r="1.8" fill="#8b5cf6"/>
    <circle cx="13" cy="16" r="1.8" fill="#ec4899"/>

    <!-- Central Multi-Faceted Prismatic Crystal (Refracting Rainbow Colors) -->
    <!-- Top Left Facet (Pink/Red) -->
    <polygon points="24,15 24,24 16,21 18,17" fill="#f43f5e" stroke="#ffffff" stroke-width="0.6"/>
    <!-- Top Right Facet (Gold/Amber) -->
    <polygon points="24,15 30,17 32,21 24,24" fill="#fbbf24" stroke="#ffffff" stroke-width="0.6"/>
    <!-- Bottom Right Facet (Cyan/Emerald) -->
    <polygon points="24,24 32,21 29,29 24,33" fill="#10b981" stroke="#ffffff" stroke-width="0.6"/>
    <!-- Bottom Left Facet (Violet/Blue) -->
    <polygon points="24,24 24,33 19,29 16,21" fill="#3b82f6" stroke="#ffffff" stroke-width="0.6"/>
    
    <!-- Central Crystal Core -->
    <circle cx="24" cy="24" r="2.2" fill="#ffffff"/>

    <!-- Sparkle Stars -->
    <polygon points="24,5 24.8,7 27,7.8 24.8,8.6 24,11 23.2,8.6 21,7.8 23.2,7" fill="#fde047"/>
  </g>
</svg>