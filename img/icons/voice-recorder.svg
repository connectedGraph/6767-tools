<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="vr-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vr-grad" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="vr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#vr-bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Waveform Ribbon Background -->
  <path d="M8 24C12 18 16 30 20 22C24 14 28 34 32 20C36 12 40 28 44 24" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Studio Microphone Capsule -->
  <rect x="20" y="9" width="8" height="15" rx="4" fill="url(#vr-grad)" filter="url(#vr-glow)"/>
  <line x1="20" y1="16" x2="28" y2="16" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  
  <!-- Microphone Cradle & Stand -->
  <path d="M16 18C16 22.4 19.6 26 24 26C28.4 26 32 22.4 32 18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="26" x2="24" y2="34" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="34" x2="30" y2="34" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Audio Waveform Bars Bottom -->
  <g fill="#22d3ee" opacity="0.9">
    <rect x="9" y="37" width="2" height="4" rx="1"/>
    <rect x="13" y="35" width="2" height="7" rx="1"/>
    <rect x="17" y="38" width="2" height="3" rx="1"/>
    <rect x="29" y="38" width="2" height="3" rx="1"/>
    <rect x="33" y="34" width="2" height="8" rx="1"/>
    <rect x="37" y="36" width="2" height="5" rx="1"/>
  </g>
</svg>
