<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-ac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="area-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-ac)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  
  <!-- Base Grid Box -->
  <rect x="9" y="9" width="30" height="30" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1.3"/>
  
  <!-- Internal Grid Subdivisions -->
  <path d="M19 9 v30 M29 9 v30 M9 19 h30 M9 29 h30" stroke="#047857" stroke-width="1" stroke-dasharray="2 1.5"/>
  
  <!-- Active Highlighted Sub-Area (Top Left 2x2 blocks) -->
  <rect x="10.5" y="10.5" width="17" height="17" rx="2.5" fill="url(#area-box)" stroke="#34d399" stroke-width="1.3"/>
  <path d="M10.5 19 h17 M19 10.5 v17" stroke="#6ee7b7" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Unit Badge in Bottom Right -->
  <rect x="22.5" y="22.5" width="14" height="14" rx="3.5" fill="#065f46" stroke="#34d399" stroke-width="1.1"/>
  <text x="29.5" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" fill="#ffffff">m²</text>
  
  <!-- Dimension arrows on Top -->
  <path d="M11 6.5 h16 m-2 -1.5 l2 1.5 l-2 1.5 m-14 -1.5 l2 -1.5 m-2 1.5 l2 1.5" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
