<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="orb-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="orb-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-glass-card)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Background Colorful Vibrant Orbs (showing through glass) -->
  <circle cx="15" cy="17" r="9" fill="url(#orb-grad1)" opacity="0.85"/>
  <circle cx="34" cy="33" r="10" fill="url(#orb-grad2)" opacity="0.85"/>

  <!-- Frosted Glass Layer with High-light Border -->
  <rect x="10" y="13" width="28" height="23" rx="6" fill="url(#glass-grad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>
  
  <!-- Glass Reflection Shimmer Line -->
  <path d="M12 16 L28 16" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="33" cy="16" r="1.5" fill="#FFFFFF"/>
  
  <!-- Mini UI content on frosted card -->
  <rect x="14" y="21" width="12" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.95"/>
  <rect x="14" y="26" width="20" height="2" rx="1" fill="#FFFFFF" opacity="0.65"/>
  <rect x="14" y="30" width="8" height="2" rx="1" fill="#67E8F9"/>

  <!-- CSS Blur Filter Badge -->
  <g transform="translate(24, 38)">
    <text x="0" y="0" fill="#FDE047" font-family="monospace" font-weight="bold" font-size="4.2" text-anchor="middle">blur(16px)</text>
  </g>
</svg>
