<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-bmi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0f3b56"/>
      <stop offset="100%" stop-color="#051e2e"/>
    </linearGradient>
    <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-bmi)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
  
  <!-- Gauge Arc -->
  <path d="M11 27 A14 14 0 0 1 37 27" fill="none" stroke="url(#gauge-grad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Gauge Needle (Pointing to optimal BMI ~22) -->
  <line x1="24" y1="27" x2="20" y2="17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="27" r="3.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="20" cy="17" r="1.2" fill="#22c55e"/>
  
  <!-- Human Silhouette at base -->
  <circle cx="24" cy="33.5" r="2.2" fill="#7dd3fc"/>
  <path d="M19 41 C19 37.5 21 36.5 24 36.5 C27 36.5 29 37.5 29 41" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- BMI Ticks -->
  <line x1="12" y1="23" x2="14" y2="23.5" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  <line x1="24" y1="12" x2="24" y2="14" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
  <line x1="36" y1="23" x2="34" y2="23.5" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
</svg>
