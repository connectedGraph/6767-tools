<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-bfr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#022c2a"/>
    </linearGradient>
    <linearGradient id="caliper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow-bfr" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#14b8a6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-bfr)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(94, 234, 212, 0.25)" stroke-width="1"/>
  
  <!-- Caliper Tool -->
  <!-- Pivot joint at top -->
  <circle cx="24" cy="10" r="2.5" fill="#0f766e" stroke="#5eead4" stroke-width="1.5"/>
  
  <!-- Left Caliper Arm -->
  <path d="M22.5 11 C17 16 15 25 18 34 L21 32 C18 25 19.5 17 23.5 12" fill="none" stroke="url(#caliper-grad)" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Right Caliper Arm -->
  <path d="M25.5 11 C31 16 33 25 30 34 L27 32 C30 25 28.5 17 24.5 12" fill="none" stroke="url(#caliper-grad)" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Measurement Dial Bar -->
  <path d="M17 21 C21 22.5 27 22.5 31 21" fill="none" stroke="#ccfbf1" stroke-width="1.8"/>
  <line x1="21" y1="20" x2="21" y2="23" stroke="#5eead4" stroke-width="1"/>
  <line x1="24" y1="19.5" x2="24" y2="23.5" stroke="#fde047" stroke-width="1.2"/>
  <line x1="27" y1="20" x2="27" y2="23" stroke="#5eead4" stroke-width="1"/>
  
  <!-- Percentage % Symbol nestled at measurement point -->
  <circle cx="21.5" cy="27.5" r="1.5" fill="#fde047"/>
  <line x1="26" y1="26" x2="22" y2="34" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="26.5" cy="32.5" r="1.5" fill="#fde047"/>
</svg>
