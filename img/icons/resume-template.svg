  <rect x="13" y="13" width="5" height="5" rx="1.5" fill="#a855f7"/>
  <rect x="20" y="14" width="12" height="2" rx="1" fill="#f8fafc"/>
  <rect x="20" y="17" width="8" height="1.5" rx="0.75" fill="#94a3b8"/>
  <path d="M13 21 L33 21" stroke="#334155" stroke-width="1"/>

