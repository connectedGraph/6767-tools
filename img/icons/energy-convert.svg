<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-energy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d36"/>
      <stop offset="50%" stop-color="#2d1566"/>
      <stop offset="100%" stop-color="#12082b"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow-bolt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-energy)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1"/>
  
  <!-- Bidirectional Conversion Circular Arrows -->
  <!-- Top-Right kJ arrow -->
  <path d="M29 11 A14 14 0 0 1 39 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="35,24 39,24 39,20" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom-Left kcal arrow -->
  <path d="M19 37 A14 14 0 0 1 9 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="13,24 9,24 9,28" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Electric Energy Lightning Bolt -->
  <polygon points="26,7 15,23 22.5,23 20,41 33,21 25,21" fill="url(#bolt-grad)" filter="url(#glow-bolt)"/>
</svg>
