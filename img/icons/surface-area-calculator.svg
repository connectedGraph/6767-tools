<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-sac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-sac)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  
  <!-- Unfolded Prism / Cube Surface Net (Cross Shape) -->
  <g fill="#14b8a6" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="1.3">
    <!-- Center Face -->
    <rect x="18" y="18" width="12" height="12" rx="1"/>
    <!-- Top Face -->
    <rect x="18" y="7" width="12" height="10" rx="1"/>
    <!-- Bottom Face -->
    <rect x="18" y="31" width="12" height="10" rx="1"/>
    <!-- Left Face -->
    <rect x="7" y="18" width="10" height="12" rx="1"/>
    <!-- Right Face -->
    <rect x="31" y="18" width="10" height="12" rx="1"/>
  </g>
  
  <!-- Dashed Fold Lines -->
  <path d="M18 18 H30 M18 30 H30 M18 18 V30 M30 18 V30" stroke="#99f6e4" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  
  <!-- Center Surface Area Text: 6a² -->
  <text x="24" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="900" fill="#ffffff">6a²</text>
  
  <!-- Fold hint arrow -->
  <path d="M13 13 Q16 10 20 12 m-1.5 -2.5 l2.5 1.5 l-3 1" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
