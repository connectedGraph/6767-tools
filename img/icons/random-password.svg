<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-pwd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-pwd)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Robust Lock Shackle -->
  <path d="M17 17v-4.5a7 7 0 0 1 14 0V17" fill="none" stroke="#FDE047" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Lock Body Shield -->
  <rect x="11" y="16" width="26" height="21" rx="4" fill="rgba(15,23,42,0.8)" stroke="#FFFFFF" stroke-width="1.8"/>
  <!-- Password Input Field Pill -->
  <rect x="13.5" y="20.5" width="21" height="6.5" rx="3.2" fill="#020617" stroke="#38BDF8" stroke-width="1"/>
  <!-- 4 Password Bullets -->
  <circle cx="17" cy="23.7" r="1.4" fill="#38BDF8"/>
  <circle cx="21.5" cy="23.7" r="1.4" fill="#38BDF8"/>
  <circle cx="26" cy="23.7" r="1.4" fill="#38BDF8"/>
  <circle cx="30.5" cy="23.7" r="1.4" fill="#38BDF8"/>
  <!-- Keyhole in Center -->
  <circle cx="24" cy="30.5" r="1.6" fill="#FDE047"/>
  <path d="M23 31l-0.8 3.5h3.6l-0.8-3.5z" fill="#FDE047"/>
  <!-- Precision Golden Security Key in Bottom-Right -->
  <g transform="rotate(-35 34 33)">
    <circle cx="31" cy="33" r="3.6" fill="none" stroke="#FDE047" stroke-width="2"/>
    <line x1="34.6" y1="33" x2="44" y2="33" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="33" x2="40" y2="36" stroke="#FDE047" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="43" y1="33" x2="43" y2="35.5" stroke="#FDE047" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
