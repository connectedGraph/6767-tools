<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-pt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="card-pt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#062e2b" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-pt)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(45,212,191,0.2)" stroke-width="1"/>
  
  <!-- Periodic Element Card -->
  <rect x="8" y="8" width="32" height="32" rx="6" fill="url(#card-pt)" stroke="#14b8a6" stroke-width="1.2"/>
  
  <!-- Top header: Atomic Number 118 & Mass -->
  <text x="12" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="4.5" font-weight="900" fill="#2dd4bf">118</text>
  <text x="36" y="15" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="4" font-weight="700" fill="#99f6e4" opacity="0.8">294</text>
  
  <!-- Atomic Nucleus & Orbital Rings -->
  <g transform="translate(0, -1)">
    <!-- Orbits -->
    <ellipse cx="24" cy="24" rx="11.5" ry="4.2" transform="rotate(-30 24 24)" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="2 1.2" opacity="0.85"/>
    <ellipse cx="24" cy="24" rx="11.5" ry="4.2" transform="rotate(30 24 24)" fill="none" stroke="#2dd4bf" stroke-width="1.1" stroke-dasharray="2 1.2" opacity="0.85"/>
    <!-- Orbit Electrons -->
    <circle cx="15.2" cy="18.8" r="1.2" fill="#38bdf8"/>
    <circle cx="32.8" cy="29.2" r="1.2" fill="#2dd4bf"/>
    <!-- Nucleus Core Glow -->
    <circle cx="24" cy="24" r="5.5" fill="url(#core-glow)" opacity="0.6"/>
    <circle cx="24" cy="24" r="2.6" fill="#f0fdfa"/>
  </g>
  
  <!-- Chemical Symbol Og -->
  <text x="24" y="36.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">Og</text>
</svg>
