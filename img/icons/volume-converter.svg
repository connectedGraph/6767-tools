<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-vc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-vc)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  
  <!-- Laboratory Beaker Container -->
  <path d="M12 9 h24 v4 l-2 2.5 v19 a4.5 4.5 0 0 1 -4.5 4.5 h-11 a4.5 4.5 0 0 1 -4.5 -4.5 v-19 l-2 -2.5 z" fill="#0f172a" stroke="#60a5fa" stroke-width="1.4" stroke-linejoin="round"/>
  
  <!-- Pour Spout Lip -->
  <path d="M10 9 h3" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Liquid Volume Fill with Wave Meniscus -->
  <path d="M14.5 21 q4.5 2 9.5 0 t9.5 0 v13 a3 3 0 0 1 -3 3 h-13 a3 3 0 0 1 -3 -3 z" fill="url(#liquid-grad)" opacity="0.85"/>
  
  <!-- Graduated Ticks on Right Wall -->
  <path d="M29 16 h3.5 M28 21 h4.5 M29 26 h3.5 M28 31 h4.5" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Bubbles -->
  <circle cx="19" cy="27" r="1.2" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="23" cy="30" r="1.5" fill="#e0f2fe" opacity="0.7"/>
  
  <!-- Unit Badge Text m³ -->
  <text x="21" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff">m³</text>
</svg>
