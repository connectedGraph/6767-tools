<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-food" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c14"/>
    </linearGradient>
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow-flame" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-food)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(74, 222, 128, 0.25)" stroke-width="1"/>
  
  <!-- Apple Body -->
  <path d="M24 16 C20.5 16 13 18 13 26 C13 34 19 40 22.5 40 C23.8 40 24.5 39.2 25.5 39.2 C26.5 39.2 27.2 40 28.5 40 C32 40 38 34 38 26 C38 18 30.5 16 27 16 C25.5 16 24.8 16.8 24 16.8 C23.2 16.8 22.5 16 24 16 Z" fill="url(#apple-grad)" stroke="#22c55e" stroke-width="1.5"/>
  
  <!-- Apple Stem & Leaf -->
  <path d="M24 16 C24.5 13 26 10 28 8.5" fill="none" stroke="#a16207" stroke-width="2" stroke-linecap="round"/>
  <path d="M25 12 C28 9 34 10 34 10 C34 10 33 15 28 15 Z" fill="#86efac" stroke="#22c55e" stroke-width="1"/>
  
  <!-- Calorie Flame in Apple center -->
  <path d="M25.5 23 C25.5 23 21 27 21 31 C21 34 23 36 25.5 36 C28 36 30 34 30 31 C30 28 27.5 25.5 27.5 23 C27.5 23 27 26 25.5 26 C24.5 26 24 24.5 25.5 23 Z" fill="url(#flame-grad)" filter="url(#glow-flame)"/>
  
  <!-- Specular highlight on apple -->
  <path d="M16 22 C14.5 25 14.5 29 16 33" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
