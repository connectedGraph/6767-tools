<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="mt-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mt-gold" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="mt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#mt-bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Metronome Body Pyramid Shape -->
  <path d="M19 10L12 37C11.8 38 12.5 39 13.5 39H34.5C35.5 39 36.2 38 36 37L29 10C28.8 9.4 28.2 9 27.5 9H20.5C19.8 9 19.2 9.4 19 10Z" fill="#1e1e24" stroke="url(#mt-gold)" stroke-width="1.4"/>

  <!-- Dial Scale Arc inside -->
  <path d="M16 26C20 23 28 23 32 26" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 2.5" opacity="0.6"/>

  <!-- Pendulum Needle with Tuner Weight -->
  <line x1="24" y1="36" x2="16" y2="13" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" filter="url(#mt-glow)"/>
  <!-- Sliding Weight Block on Needle -->
  <rect x="18" y="17" width="5" height="4" rx="1" transform="rotate(-20 20.5 19)" fill="#fbbf24"/>
  <!-- Pivot Point at bottom -->
  <circle cx="24" cy="36" r="2.5" fill="#f59e0b"/>
  <circle cx="24" cy="36" r="1" fill="#09090b"/>

  <!-- Tuner Frequency Pulse Rays Top Left -->
  <circle cx="16" cy="13" r="2" fill="#22d3ee" filter="url(#mt-glow)"/>
</svg>
