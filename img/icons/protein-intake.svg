<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-protein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e24"/>
      <stop offset="50%" stop-color="#0f513f"/>
      <stop offset="100%" stop-color="#03241c"/>
    </linearGradient>
    <linearGradient id="shaker-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="egg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-protein" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#34d399" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-protein)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1"/>
  
  <!-- Protein Shaker Bottle (Right side) -->
  <path d="M26 14 L36 14 L34.5 37 C34.3 39 33 40 31 40 L30 40 C28 40 26.7 39 26.5 37 Z" fill="rgba(52, 211, 153, 0.15)" stroke="url(#shaker-grad)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Shaker Cap & Loop -->
  <rect x="25.5" y="11" width="11" height="3.5" rx="1" fill="url(#shaker-grad)"/>
  <path d="M29 8 h4 v3 h-4 z" fill="#6ee7b7"/>
  <path d="M33 8.5 C35 8.5 36 9.5 36 11" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shaker Level Marks -->
  <line x1="31" y1="20" x2="34" y2="20" stroke="#6ee7b7" stroke-width="1.2"/>
  <line x1="30.5" y1="25" x2="33.5" y2="25" stroke="#6ee7b7" stroke-width="1.2"/>
  <line x1="30" y1="30" x2="33" y2="30" stroke="#6ee7b7" stroke-width="1.2"/>
  
  <!-- Egg Nutrition (Left side) -->
  <path d="M18 20 C13.5 20 10 25.5 10 32 C10 37 13.5 40 18 40 C22.5 40 26 37 26 32 C26 25.5 22.5 20 18 20 Z" fill="url(#egg-grad)" filter="url(#glow-protein)"/>
  <circle cx="16.5" cy="27" r="1.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Peptide / Amino Acid Molecule Nodes -->
  <circle cx="14" cy="12" r="2" fill="#38bdf8"/>
  <circle cx="20" cy="9" r="1.5" fill="#6ee7b7"/>
  <line x1="15.5" y1="11" x2="18.5" y2="9.5" stroke="#ffffff" stroke-width="1.2"/>
</svg>
