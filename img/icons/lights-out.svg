<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-lights" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="lit-bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-lights)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(250,204,21,0.25)" stroke-width="1"/>
  
  <!-- Ambient Center Glow for Cross Pattern -->
  <circle cx="24" cy="24" r="16" fill="url(#center-glow)"/>
  
  <!-- 3x3 Matrix Buttons -->
  <!-- Row 1 -->
  <!-- (1,1) Dark -->
  <rect x="8" y="8" width="9.5" height="9.5" rx="2.5" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <!-- (1,2) Lit -->
  <rect x="19.25" y="8" width="9.5" height="9.5" rx="2.5" fill="url(#lit-bulb)" stroke="#fef08a" stroke-width="1.2"/>
  <circle cx="24" cy="12.75" r="1.5" fill="#ffffff"/>
  <!-- (1,3) Dark -->
  <rect x="30.5" y="8" width="9.5" height="9.5" rx="2.5" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  
  <!-- Row 2 -->
  <!-- (2,1) Lit -->
  <rect x="8" y="19.25" width="9.5" height="9.5" rx="2.5" fill="url(#lit-bulb)" stroke="#fef08a" stroke-width="1.2"/>
  <circle cx="12.75" cy="24" r="1.5" fill="#ffffff"/>
  <!-- (2,2) Lit Center with Extra Glow -->
  <rect x="19.25" y="19.25" width="9.5" height="9.5" rx="2.5" fill="url(#lit-bulb)" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="24" cy="24" r="2" fill="#ffffff"/>
  <!-- (2,3) Lit -->
  <rect x="30.5" y="19.25" width="9.5" height="9.5" rx="2.5" fill="url(#lit-bulb)" stroke="#fef08a" stroke-width="1.2"/>
  <circle cx="35.25" cy="24" r="1.5" fill="#ffffff"/>
  
  <!-- Row 3 -->
  <!-- (3,1) Dark -->
  <rect x="8" y="30.5" width="9.5" height="9.5" rx="2.5" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <!-- (3,2) Lit -->
  <rect x="19.25" y="30.5" width="9.5" height="9.5" rx="2.5" fill="url(#lit-bulb)" stroke="#fef08a" stroke-width="1.2"/>
  <circle cx="24" cy="35.25" r="1.5" fill="#ffffff"/>
  <!-- (3,3) Dark -->
  <rect x="30.5" y="30.5" width="9.5" height="9.5" rx="2.5" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
</svg>
