<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-aspect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-aspect)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- 16:9 Widescreen Box -->
  <rect x="6" y="14" width="36" height="20" rx="3.5" fill="rgba(15,23,42,0.65)" stroke="#38BDF8" stroke-width="1.8"/>
  <!-- 4:3 Box Overlay (Dashed) -->
  <rect x="11.5" y="10" width="25" height="28" rx="3.5" fill="rgba(255,255,255,0.1)" stroke="#FDE047" stroke-width="1.8" stroke-dasharray="3.5 2"/>
  <!-- Mountain Landscape inside -->
  <circle cx="16" cy="19" r="2" fill="#FBBF24"/>
  <path d="M8 29l7-6 5 4.5 4-4 8 5.5v2H8v-2z" fill="#38BDF8" opacity="0.85"/>
  <!-- Aspect Ratio Badge 16:9 -->
  <rect x="15" y="20.5" width="18" height="7.5" rx="2.5" fill="rgba(15,23,42,0.88)" stroke="#FFFFFF" stroke-width="1"/>
  <text x="24" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="4.8" text-anchor="middle" letter-spacing="0.5">16:9</text>
  <!-- Corner Ratio Brackets -->
  <path d="M6 18v-4h4 M42 18v-4h-4 M6 30v4h4 M42 30v4h-4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
