<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-rnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-rnd)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- 3D Isometric Rolling Die on Left -->
  <g transform="translate(6, 12)">
    <!-- Top Face -->
    <path d="M11 1l9 4.5-9 4.5-9-4.5z" fill="#FFFFFF"/>
    <circle cx="11" cy="5.5" r="1.3" fill="#0F172A"/>
    <!-- Left Face -->
    <path d="M2 5.5l9 4.5v10l-9-4.5z" fill="#E2E8F0"/>
    <circle cx="5" cy="9.5" r="1.1" fill="#0F172A"/>
    <circle cx="8" cy="14" r="1.1" fill="#0F172A"/>
    <!-- Right Face -->
    <path d="M11 10l9-4.5v10l-9 4.5z" fill="#CBD5E1"/>
    <circle cx="14" cy="13.5" r="1.1" fill="#EF4444"/>
    <circle cx="15.5" cy="11.2" r="1.1" fill="#EF4444"/>
    <circle cx="17" cy="9" r="1.1" fill="#EF4444"/>
  </g>
  <!-- Glowing Lucky '7' Orb in Top-Right -->
  <circle cx="34" cy="17" r="8" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="34" y="22.5" fill="#0F172A" font-family="system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle">7</text>
  <!-- Motion Orbit Streak -->
  <path d="M27 32a9 9 0 0 0 11-2" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
  <!-- Floating Rolling Numbers (3, 5) -->
  <circle cx="37" cy="35" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1"/>
  <text x="37" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="5.5" text-anchor="middle">3</text>
  <circle cx="26" cy="37" r="3.5" fill="#EC4899" stroke="#FFFFFF" stroke-width="0.8"/>
  <text x="26" y="39.6" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="4.2" text-anchor="middle">5</text>
</svg>
