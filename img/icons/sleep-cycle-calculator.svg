<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-sleep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#241b5a"/>
      <stop offset="100%" stop-color="#191038"/>
    </linearGradient>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-moon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fde047" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-sleep)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1"/>
  
  <!-- Crescent Moon -->
  <path d="M25 8 C18.4 8 13 13.4 13 20 C13 26.6 18.4 32 25 32 C27.8 32 30.3 31 32.3 29.5 C26.5 28.5 22 23.5 22 17.5 C22 13.5 24 10 27.2 8.2 C26.5 8.1 25.8 8 25 8 Z" fill="url(#moon-grad)" filter="url(#glow-moon)"/>
  
  <!-- Sleep Cycle Sine Wave (REM / Deep Sleep stages) -->
  <path d="M8 36 C11 36 12 28 15 28 C18 28 19 39 23 39 C27 39 28 26 32 26 C36 26 37 36 40 36" fill="none" stroke="url(#wave-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sleep Stage Peak Dots -->
  <circle cx="15" cy="28" r="1.8" fill="#38bdf8"/>
  <circle cx="32" cy="26" r="1.8" fill="#c084fc"/>
  <circle cx="23" cy="39" r="1.5" fill="#818cf8"/>
  
  <!-- Night Sky Stars -->
  <path d="M35 11 L36 13 L38 14 L36 15 L35 17 L34 15 L32 14 L34 13 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="12" cy="14" r="1" fill="#c084fc" opacity="0.8"/>
  <circle cx="39" cy="20" r="0.8" fill="#fde047" opacity="0.7"/>
</svg>
