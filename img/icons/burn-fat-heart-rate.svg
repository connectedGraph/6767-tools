<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-heartfire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0718"/>
      <stop offset="50%" stop-color="#5c0d24"/>
      <stop offset="100%" stop-color="#24040e"/>
    </linearGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="flame-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow-heart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-heartfire)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1"/>
  
  <!-- Surrounding Fat Burning Flames -->
  <path d="M24 6 C20 11 13 15 13 23 C13 29 17 33 19 35 C17 31 18 27 20 25 C20 29 23 31 24 33 C26 30 28 27 28 23 C30 26 31 29 29 35 C31 33 35 29 35 23 C35 15 28 11 24 6 Z" fill="url(#flame-outer)" opacity="0.6"/>
  
  <!-- Heart Silhouette -->
  <path d="M24 16 C22 13 17.5 13 15.5 16.5 C13 21 16.5 26 24 33 C31.5 26 35 21 32.5 16.5 C30.5 13 26 13 24 16 Z" fill="url(#heart-grad)" filter="url(#glow-heart)"/>
  
  <!-- Crisp ECG Pulse Rate Wave traversing Heart -->
  <path d="M10 24 L18 24 L20.5 19 L23.5 29 L26.5 21 L29 24 L38 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
