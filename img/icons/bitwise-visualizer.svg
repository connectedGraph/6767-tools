<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-bw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02201c"/>
      <stop offset="50%" stop-color="#062e2a"/>
      <stop offset="100%" stop-color="#02141a"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-bw)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>

  <!-- Top 4-bit Binary Register Cells -->
  <g transform="translate(6, 8)">
    <!-- Bit 3: 1 (Active Glow) -->
    <rect x="0" y="0" width="7.5" height="10" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="3.75" y="7.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="6.5" font-weight="900" fill="#34d399">1</text>

    <!-- Bit 2: 0 (Dim) -->
    <rect x="9.5" y="0" width="7.5" height="10" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="13.25" y="7.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="6.5" font-weight="700" fill="#64748b">0</text>

    <!-- Bit 1: 1 (Active Glow) -->
    <rect x="19" y="0" width="7.5" height="10" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="22.75" y="7.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="6.5" font-weight="900" fill="#34d399">1</text>

    <!-- Bit 0: 1 (Active Glow) -->
    <rect x="28.5" y="0" width="7.5" height="10" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="32.25" y="7.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="6.5" font-weight="900" fill="#34d399">1</text>
  </g>

  <!-- Middle Logic Gate Diagram: XOR / AND Gate & Flow Lines -->
  <!-- Circuit Traces -->
  <path d="M12 20 V25 H20 M36 20 V25 H28" stroke="#334155" stroke-width="1.2" fill="none"/>
  
  <!-- Operator Chip in Center -->
  <rect x="15" y="22" width="18" height="9" rx="3" fill="#091e2b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="28.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="5.2" font-weight="900" fill="#38bdf8">&amp; | ^</text>

  <!-- Output Arrow Downwards -->
  <path d="M24 31 V35 M21 34 L24 37 L27 34" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Result Hex & Shift Icon -->
  <rect x="8" y="37" width="32" height="6.5" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="42" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="4.5" font-weight="800" fill="#6ee7b7" letter-spacing="1">0x0B &lt;&lt; 1</text>
</svg>
