<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dm-dice-top" x1="12" y1="10" x2="36" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dm-dice-l" x1="12" y1="16" x2="24" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="dm-dice-r" x1="24" y1="16" x2="36" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="dm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#dm-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#dm-glow)">
    <!-- Rotating Decision Dynamic Orbit Ring -->
    <path d="M9 24 C9 14 17 8 26 8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <polyline points="22,6 27,8 23,12" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 24 C39 34 31 40 22 40" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <polyline points="26,42 21,40 25,36" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3D Isometric Decision Cube / Dice -->
    <!-- Top Face -->
    <polygon points="24,12 35,18 24,24 13,18" fill="url(#dm-dice-top)" stroke="#f5d0fe" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Left Face -->
    <polygon points="13,18 24,24 24,36 13,30" fill="url(#dm-dice-l)" stroke="#f5d0fe" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Right Face -->
    <polygon points="24,24 35,18 35,30 24,36" fill="url(#dm-dice-r)" stroke="#f5d0fe" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Decision Question Mark / Pip on Top Face -->
    <circle cx="24" cy="18" r="2" fill="#fde047"/>
    
    <!-- Pips on Left Face (2 dots) -->
    <circle cx="17" cy="23" r="1.5" fill="#ffffff"/>
    <circle cx="20" cy="30" r="1.5" fill="#ffffff"/>

    <!-- Checkmark on Right Face (Decision Yes/No) -->
    <polyline points="27,29 29.5,31.5 33,26" fill="none" stroke="#4ade80" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>