<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-aes" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#040d1a"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="key-gold" x1="24" y1="18" x2="34" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-aes)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Security Shield Outer -->
  <path d="M24 10c7 2.5 11 3.5 11 3.5v9.5c0 8.5-5.5 14-11 15.5-5.5-1.5-11-7-11-15.5v-9.5s4-1 11-3.5z" 
        stroke="url(#shield-grad)" stroke-width="2.2" fill="#082f49" fill-opacity="0.5" stroke-linejoin="round"/>

  <!-- AES 4x4 Cipher Matrix Grid Nodes inside Shield -->
  <circle cx="18" cy="19" r="1.2" fill="#38bdf8"/>
  <circle cx="22" cy="19" r="1.2" fill="#38bdf8"/>
  <circle cx="26" cy="19" r="1.2" fill="#38bdf8"/>
  <circle cx="30" cy="19" r="1.2" fill="#38bdf8"/>

  <circle cx="18" cy="23" r="1.2" fill="#38bdf8"/>
  <circle cx="30" cy="23" r="1.2" fill="#38bdf8"/>

  <circle cx="18" cy="27" r="1.2" fill="#38bdf8"/>
  <circle cx="30" cy="27" r="1.2" fill="#38bdf8"/>

  <!-- Central Key Symbol -->
  <circle cx="24" cy="23" r="3" stroke="url(#key-gold)" stroke-width="2" fill="#0f172a"/>
  <path d="M24 26v7M24 30h2.5M24 32.5h2" stroke="url(#key-gold)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
