<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="led-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="led-phone" x1="6" y1="12" x2="42" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="led-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#led-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#led-glow)">
    <!-- Smartphone Bezel (Horizontal) -->
    <rect x="6" y="13" width="36" height="22" rx="3.5" fill="url(#led-phone)" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- LED Screen Area -->
    <rect x="9" y="15.5" width="30" height="17" rx="1.5" fill="#000000"/>
    
    <!-- Dot Matrix Grid Emitting "LED" -->
    <!-- Letter L in green matrix dots -->
    <circle cx="12" cy="19" r="1" fill="#4ade80"/>
    <circle cx="12" cy="22" r="1" fill="#4ade80"/>
    <circle cx="12" cy="25" r="1" fill="#4ade80"/>
    <circle cx="12" cy="28" r="1" fill="#4ade80"/>
    <circle cx="15" cy="28" r="1" fill="#4ade80"/>
    <circle cx="18" cy="28" r="1" fill="#4ade80"/>

    <!-- Letter E in cyan matrix dots -->
    <circle cx="21" cy="19" r="1" fill="#22d3ee"/>
    <circle cx="24" cy="19" r="1" fill="#22d3ee"/>
    <circle cx="27" cy="19" r="1" fill="#22d3ee"/>
    <circle cx="21" cy="22" r="1" fill="#22d3ee"/>
    <circle cx="21" cy="25" r="1" fill="#22d3ee"/>
    <circle cx="24" cy="25" r="1" fill="#22d3ee"/>
    <circle cx="21" cy="28" r="1" fill="#22d3ee"/>
    <circle cx="24" cy="28" r="1" fill="#22d3ee"/>
    <circle cx="27" cy="28" r="1" fill="#22d3ee"/>

    <!-- Letter D in rose/pink dots -->
    <circle cx="30" cy="19" r="1" fill="#f43f5e"/>
    <circle cx="33" cy="19" r="1" fill="#f43f5e"/>
    <circle cx="30" cy="22" r="1" fill="#f43f5e"/>
    <circle cx="35.5" cy="22" r="1" fill="#f43f5e"/>
    <circle cx="30" cy="25" r="1" fill="#f43f5e"/>
    <circle cx="35.5" cy="25" r="1" fill="#f43f5e"/>
    <circle cx="30" cy="28" r="1" fill="#f43f5e"/>
    <circle cx="33" cy="28" r="1" fill="#f43f5e"/>

    <!-- Speed / Marquee Waves -->
    <line x1="7" y1="38" x2="16" y2="38" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="38" x2="32" y2="38" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="38" x2="41" y2="38" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>