<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mcs-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mcs-suit" x1="10" y1="12" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mcs-tie" x1="22" y1="16" x2="26" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="mcs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#mcs-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#mcs-glow)">
    <!-- Suit Jacket Body -->
    <path d="M17 12 L9 18 L12 24 L14 21 V39 H34 V21 L36 24 L39 18 L31 12 Z" fill="url(#mcs-suit)" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- White Inner Shirt Collar -->
    <polygon points="19,12 24,19 29,12" fill="#ffffff"/>

    <!-- Blue Silk Tie -->
    <!-- Tie Knot -->
    <polygon points="22.5,15 25.5,15 26,17.5 22,17.5" fill="#38bdf8"/>
    <!-- Tie Body -->
    <polygon points="22.5,17.5 25.5,17.5 26.5,29 24,32 21.5,29" fill="url(#mcs-tie)" stroke="#ffffff" stroke-width="0.6"/>

    <!-- Suit Lapels -->
    <path d="M17 12 L21 22 L24 30 L20 30 L15 16 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="0.8"/>
    <path d="M31 12 L27 22 L24 30 L28 30 L33 16 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Breast Pocket & Gold Pocket Square -->
    <line x1="14" y1="24" x2="18" y2="24" stroke="#94a3b8" stroke-width="1.2"/>
    <polygon points="15,24 16,21.5 17,24" fill="#fde047"/>

    <!-- Size Label Stamp "L / 50" on bottom right -->
    <rect x="27" y="32" width="10" height="6.5" rx="1" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <!-- Letter L -->
    <path d="M30 34 V37 H32.5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34.5" cy="35.5" r="0.8" fill="#fde047"/>
  </g>
</svg>