<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-cycle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0a1e"/>
      <stop offset="50%" stop-color="#4d1234"/>
      <stop offset="100%" stop-color="#200615"/>
    </linearGradient>
    <linearGradient id="flower-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow-cycle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f43f5e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-cycle)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1"/>
  
  <!-- Menstrual Cycle Dial Arcs (3 Phases: Menstruation, Fertile, Safe) -->
  <!-- Phase 1: Menstruation Arc (Top, Pink-Red) -->
  <path d="M15 15 A14 14 0 0 1 33 15" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Phase 2: Ovulation / Fertile Arc (Right-Bottom, Purple-Rose) -->
  <path d="M35 19 A14 14 0 0 1 27 37.5" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  <!-- Phase 3: Safe Period Arc (Left-Bottom, Mint Emerald) -->
  <path d="M21 37.5 A14 14 0 0 1 13 19" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Center Blooming Lotus / Fertility Flower -->
  <!-- Petals -->
  <path d="M24 16 C21 21 21 25 24 27 C27 25 27 21 24 16 Z" fill="url(#flower-grad)" filter="url(#glow-cycle)"/>
  <path d="M17 21 C19 25 22 26 24 27 C22 23 20 20 17 21 Z" fill="url(#flower-grad)" opacity="0.8"/>
  <path d="M31 21 C29 25 26 26 24 27 C26 23 28 20 31 21 Z" fill="url(#flower-grad)" opacity="0.8"/>
  <!-- Center Pearl / Pistil -->
  <circle cx="24" cy="25.5" r="2.2" fill="#fde047"/>
  
  <!-- Phase Indicators / Pearls on perimeter -->
  <circle cx="24" cy="10" r="1.5" fill="#f43f5e"/>
  <circle cx="37" cy="27" r="1.5" fill="#c084fc"/>
  <circle cx="15" cy="31" r="1.5" fill="#34d399"/>
</svg>
