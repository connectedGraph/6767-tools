<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="wcp-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wcp-globe" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wcp-dial" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="wcp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#wcp-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#wcp-glow)">
    <!-- Globe Outline & Grid Lines -->
    <circle cx="21" cy="23" r="14" fill="none" stroke="url(#wcp-globe)" stroke-width="1.8"/>
    <!-- Equator -->
    <ellipse cx="21" cy="23" rx="14" ry="4.5" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
    <!-- Prime Meridian -->
    <ellipse cx="21" cy="23" rx="5.5" ry="14" fill="none" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2"/>
    <!-- Latitude Arc -->
    <path d="M9 18 Q 21 22 33 18" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M9 28 Q 21 24 33 28" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Clock / Timeline Cursor Ring (Bottom Right) -->
    <circle cx="33" cy="31" r="9.5" fill="#0f172a" stroke="url(#wcp-dial)" stroke-width="2"/>
    <circle cx="33" cy="31" r="1.5" fill="#fbbf24"/>
    <!-- Hands pointing to 9:00 and 15:00 -->
    <line x1="33" y1="31" x2="33" y2="25.5" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="33" y1="31" x2="38" y2="31" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Timeline tick markers -->
    <circle cx="33" cy="23.5" r="0.7" fill="#94a3b8"/>
    <circle cx="40.5" cy="31" r="0.7" fill="#94a3b8"/>
    <circle cx="33" cy="38.5" r="0.7" fill="#94a3b8"/>
    <circle cx="25.5" cy="31" r="0.7" fill="#94a3b8"/>
  </g>
</svg>
