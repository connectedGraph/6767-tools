<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-http" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="http-green" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-http)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Code Card Frame -->
  <rect x="9" y="10" width="30" height="28" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Mini Terminal Header -->
  <circle cx="14" cy="15" r="1.5" fill="#ef4444"/>
  <circle cx="18" cy="15" r="1.5" fill="#f59e0b"/>
  <circle cx="22" cy="15" r="1.5" fill="#10b981"/>

  <!-- Status Number "200" & Status Indicator -->
  <text x="14" y="27" fill="url(#http-green)" font-family="monospace" font-weight="900" font-size="10" letter-spacing="0.5">200</text>
  
  <!-- OK Checkmark Tag -->
  <rect x="27" y="20" width="9" height="7" rx="2" fill="#10b981" fill-opacity="0.2"/>
  <path d="M29 23.5l1.5 1.5 3-3" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Status indicator dots bottom: 1xx, 3xx, 4xx, 5xx -->
  <circle cx="14" cy="33" r="1.5" fill="#38bdf8"/>
  <circle cx="20" cy="33" r="1.5" fill="#fbbf24"/>
  <circle cx="26" cy="33" r="1.5" fill="#fb7185"/>
  <circle cx="32" cy="33" r="1.5" fill="#ef4444"/>
</svg>
