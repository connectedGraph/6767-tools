<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-figure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#310b24"/>
      <stop offset="50%" stop-color="#54123d"/>
      <stop offset="100%" stop-color="#230619"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="tape-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow-figure" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f472b6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-figure)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(244, 114, 182, 0.25)" stroke-width="1"/>
  
  <!-- Hourglass Physique Silhouette -->
  <!-- Head -->
  <circle cx="24" cy="10.5" r="2.5" fill="#fbcfe8"/>
  <!-- Elegant curves (Bust, narrow waist, hips) -->
  <path d="M19 16 C21 16 22 17 24 17 C26 17 27 16 29 16 C31 16 32 19 30 22 C28.5 24 26.5 25 26.5 27 C26.5 29 29.5 32 31 35 C32.5 38 31 41 29 41 L19 41 C17 41 15.5 38 17 35 C18.5 32 21.5 29 21.5 27 C21.5 25 19.5 24 18 22 C16 19 17 16 19 16 Z" fill="url(#body-grad)" opacity="0.35" stroke="url(#body-grad)" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Golden Tape Measure wrapping waist -->
  <path d="M15 27 C18 24 30 24 33 27 C31 30 17 30 15 27 Z" fill="url(#tape-grad)" filter="url(#glow-figure)"/>
  <!-- Tape Measure Tick Marks -->
  <line x1="19" y1="25.5" x2="19" y2="28" stroke="#78350f" stroke-width="1"/>
  <line x1="23" y1="25" x2="23" y2="28.5" stroke="#78350f" stroke-width="1"/>
  <line x1="27" y1="25" x2="27" y2="28.5" stroke="#78350f" stroke-width="1"/>
  <line x1="31" y1="25.5" x2="31" y2="28" stroke="#78350f" stroke-width="1"/>
  
  <!-- Golden Proportion Sparkle ✨ -->
  <path d="M35 15 L36 17 L38 18 L36 19 L35 21 L34 19 L32 18 L34 17 Z" fill="#fde047"/>
  <circle cx="13" cy="20" r="1" fill="#fde047"/>
</svg>
