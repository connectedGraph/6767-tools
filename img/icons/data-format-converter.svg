<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="bg-converter" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0e26"/>
    </linearGradient>
    <linearGradient id="conv-purple" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="conv-amber" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg-converter)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Left Format Symbol: { } JSON -->
  <path d="M14 14c-2 0-3 1.5-3 3.5v2c0 1.5-1 2.5-2 2.5 1 0 2 1 2 2.5v2c0 2 1 3.5 3 3.5" stroke="#c084fc" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Right Format Symbol: < > XML -->
  <path d="M34 14c2 0 3 1.5 3 3.5v2c0 1.5 1 2.5 2 2.5-1 0-2 1-2 2.5v2c0 2-1 3.5-3 3.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Center Double Arrows Swap -->
  <path d="M19 20h10m-3-3l3 3-3 3" stroke="url(#conv-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29 28H19m3-3l-3 3 3 3" stroke="url(#conv-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner format badges dots: YAML & TOML -->
  <circle cx="15" cy="38" r="2" fill="#34d399"/>
  <circle cx="33" cy="38" r="2" fill="#f43f5e"/>
</svg>
