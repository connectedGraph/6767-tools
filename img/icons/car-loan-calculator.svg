<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="clc-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="clc-car" x1="8" y1="12" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="clc-gold" x1="26" y1="26" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="clc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#clc-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#clc-glow)">
    <!-- Car Body Shape -->
    <!-- Car Cabin & Hood Roofline -->
    <path d="M8 26 C8 24 9.5 22.5 11.5 22.5 L14 22.5 L19 14.5 C19.8 13.3 21.2 12.5 22.8 12.5 L31.5 12.5 C33.2 12.5 34.5 13.5 35.2 14.8 L39 21.5 L40.5 22.5 C42 23.5 42.5 25 42.5 26.5 L42.5 29 C42.5 30 41.8 30.8 40.8 30.8 L39.5 30.8 C39.5 30.8 39 28 35 28 C31 28 30.5 30.8 30.5 30.8 L18.5 30.8 C18.5 30.8 18 28 14 28 C10 28 9.5 30.8 9.5 30.8 L7.5 30.8 C6.7 30.8 6 30 6 29 L6 27 C6 26.5 6.5 26 7 26 Z" fill="url(#clc-car)" stroke="#7dd3fc" stroke-width="0.8"/>
    
    <!-- Car Windows -->
    <path d="M20.2 14.8 L15.8 21.5 L24 21.5 L24 14.8 Z" fill="#0f172a" fill-opacity="0.75"/>
    <path d="M25.5 14.8 L25.5 21.5 L33.2 21.5 L30.2 14.8 Z" fill="#0f172a" fill-opacity="0.75"/>

    <!-- Left Wheel -->
    <circle cx="14" cy="30.5" r="4.2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="14" cy="30.5" r="1.8" fill="#38bdf8"/>

    <!-- Right Wheel -->
    <circle cx="35" cy="30.5" r="4.2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="35" cy="30.5" r="1.8" fill="#38bdf8"/>

    <!-- Loan / Financial Percentage Badge (Bottom Right Overlay) -->
    <circle cx="33" cy="35" r="9" fill="url(#clc-gold)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Percentage symbol % -->
    <text x="33" y="39" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle">%</text>
  </g>
</svg>
