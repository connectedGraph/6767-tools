<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="flag-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="flag-grad" x1="12" y1="10" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="flag-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#flag-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#flag-glow)">
    <!-- Flagpole Base -->
    <path d="M8 40 H16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Flagpole Shaft -->
    <line x1="12" y1="8" x2="12" y2="40" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Golden Finial Ball -->
    <circle cx="12" cy="8" r="2.2" fill="#fbbf24" stroke="#fef08a" stroke-width="0.8"/>

    <!-- Fluttering Wave Flag (Double S-curve) -->
    <path d="M13 11 C20 8 24 16 31 12 C34.5 10 37 11 39 12 V25 C37 24 34.5 23 31 25 C24 29 20 21 13 24 Z" fill="url(#flag-grad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Canton Star -->
    <polygon points="17,14 17.6,15.3 19,15.5 18,16.4 18.2,17.8 17,17.2 15.8,17.8 16,16.4 15,15.5 16.4,15.3" fill="#ffffff"/>

    <!-- Mini Globe / Compass Star in background -->
    <circle cx="34" cy="33" r="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2"/>
    <ellipse cx="34" cy="33" rx="6" ry="2" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
    <line x1="34" y1="27" x2="34" y2="39" stroke="#38bdf8" stroke-width="0.8"/>
  </g>
</svg>