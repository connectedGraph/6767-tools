<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cic-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cic-curve" x1="8" y1="36" x2="38" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="cic-bar-p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cic-bar-i" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#cic-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#cic-glow)">
    <!-- Base Coordinate Axes -->
    <path d="M9 37 L39 37" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9 37 L9 11" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stacked Bar 1 (Year 1) -->
    <rect x="12" y="28" width="5" height="9" rx="1" fill="url(#cic-bar-p)"/>
    <rect x="12" y="25" width="5" height="3" rx="1" fill="url(#cic-bar-i)"/>

    <!-- Stacked Bar 2 (Year 2) -->
    <rect x="19" y="24" width="5" height="13" rx="1" fill="url(#cic-bar-p)"/>
    <rect x="19" y="18" width="5" height="6" rx="1" fill="url(#cic-bar-i)"/>

    <!-- Stacked Bar 3 (Year 3) -->
    <rect x="26" y="21" width="5" height="16" rx="1" fill="url(#cic-bar-p)"/>
    <rect x="26" y="12" width="5" height="9" rx="1" fill="url(#cic-bar-i)"/>

    <!-- Compounding Exponential Growth Curve -->
    <path d="M10 33 Q 22 28, 30 17 T 39 9" fill="none" stroke="url(#cic-curve)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Arrow Head at top right -->
    <polyline points="34,8 39,8 39,13" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sparkle / Star at peak -->
    <circle cx="39" cy="8" r="1.5" fill="#ffffff"/>
  </g>
</svg>
