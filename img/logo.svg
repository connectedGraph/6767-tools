<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Wrench logo: self-drawn, open-end wrench with 45-degree handle, dark-theme cyan-to-violet gradient -->
  <defs>
    <linearGradient id="wg" x1="20" y1="18" x2="76" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#wg)" stroke-linecap="round" stroke-linejoin="round">
    <!-- head: open ring, gap facing upper-left -->
    <path d="M30.4 17.8 A19 19 0 1 1 17.8 30.4" stroke-width="9"/>
    <!-- handle -->
    <path d="M45 45 L76 76" stroke-width="14"/>
  </g>
</svg>
