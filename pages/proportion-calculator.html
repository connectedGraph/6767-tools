<main class="main-body tool-page-body" id="app">
    <div class="tool-body">
        <div class="card-model">
            <div class="card-body">
                <div class="tool-head"><h1 class="title">比例计算器</h1></div>
                <div class="description">输入三个已知数，实时求解比例中的缺失值。适用于图片缩放、配方换算和数学计算。</div>
                <section class="proportion-tool" aria-label="比例计算器">
                    <div class="tool-form">
                        <div class="item">
                            <label class="field-label" for="proportion-a">比例 A</label>
                            <el-input id="proportion-a" type="number" inputmode="decimal" aria-label="比例 A 分子" v-model="number[0]" v-on:keyup="convert(0)"></el-input>
                            <div class="fraction-line" aria-hidden="true"></div>
                            <el-input type="number" inputmode="decimal" aria-label="比例 A 分母" v-model="number[1]" v-on:keyup="convert(1)"></el-input>
                        </div>
                        <div class="equal" aria-label="等于">=</div>
                        <div class="item">
                            <label class="field-label" for="proportion-b">比例 B</label>
                            <el-input id="proportion-b" type="number" inputmode="decimal" aria-label="比例 B 分子" v-model="number[2]" v-on:keyup="convert(2)"></el-input>
                            <div class="fraction-line" aria-hidden="true"></div>
                            <el-input type="number" inputmode="decimal" aria-label="比例 B 分母" v-model="number[3]" v-on:keyup="convert(3)"></el-input>
                        </div>
                    </div>
                    <div class="helper-row"><span class="status-dot" aria-hidden="true"></span><span>修改任意数值，结果会即时同步</span></div>
                    <div class="compute-result" v-if="ratio!=null" role="status" aria-live="polite"><span class="result-label">当前比例</span><span class="result-value">{{ratio}}</span></div>
                    <div class="divider"></div>
                    <div class="content">
