<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script>try{Object.defineProperty(Document.prototype,"domain",{get:function(){return location.hostname},configurable:true});}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生活 - 在线工具集</title>
    <meta name="description" content="日常生活与财务工具：理财、健康、日期、尺码与生活查询工具" />
    <meta name="keywords" content="生活,在线工具,在线工具集,6767工具" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link href="./lib/element-plus/index.css" rel="stylesheet" />
    <link href="./css/6767-tailwind.css?v=20260905" rel="stylesheet" />
    <link href="./css/6767-site.css?v=20260905" rel="stylesheet" />
    <link href="./css/tool-dark.css?v=20260905" rel="stylesheet" />
    <style>
        :root { --life-accent:#38bdf8; --life-accent-strong:#0284c7; }
        * { box-sizing:border-box; }
        .life-shell { width:100%; max-width:1180px; margin:0 auto; padding:clamp(18px,3vw,36px) 16px 72px; }
        .tool-page-body { min-height:calc(100vh - 60px); }
        .tool-body { width:100%; }
        .card-model { width:100%; max-width:1180px; margin:0 auto; }
        .card-body { width:100%; border-radius:14px; overflow:hidden; }
        .tool-head { display:flex; align-items:center; gap:12px; margin:0; }
        .tool-head .title { margin:0; font-size:clamp(24px,4vw,34px); line-height:1.15; font-weight:800; letter-spacing:-.03em; }
        .description { margin:10px 0 24px; line-height:1.7; max-width:700px; }
        .life-intro { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding:clamp(20px,4vw,34px); border-radius:14px; margin-bottom:16px; }
        .life-kicker { margin:0 0 8px; font:700 11px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--life-accent); }
        .life-subtitle { margin:0; font-size:14px; line-height:1.6; }
        .life-count { display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:7px 12px; border-radius:999px; white-space:nowrap; font:700 13px Consolas,monospace; }
        .life-count-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.14); }
        .life-dashboard { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 16px; border-radius:12px; margin-bottom:20px; }
        .life-search-wrap { position:relative; flex:1 1 280px; max-width:460px; }
        .life-search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:16px; }
        .life-search { width:100%; min-height:40px; border-radius:9px; border:1px solid; padding:8px 38px 8px 38px; font-size:14px; outline:0; transition:.2s ease; }
        .life-search:focus { border-color:var(--life-accent); box-shadow:0 0 0 3px rgba(56,189,248,.18); }
        .life-search-clear { position:absolute; right:7px; top:3px; min-width:32px; height:34px; border:0; background:transparent; border-radius:7px; cursor:pointer; font-size:18px; }
        .life-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:12px; }
        .life-tool-card { display:flex; align-items:center; gap:13px; min-width:0; min-height:70px; padding:12px 14px; border:1px solid; border-radius:12px; text-decoration:none; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease; }
        .life-tool-card:hover { transform:translateY(-2px); }
        .life-tool-card:focus-visible, .life-search-clear:focus-visible { outline:3px solid rgba(56,189,248,.45); outline-offset:2px; }
        .life-tool-icon { width:38px; height:38px; padding:6px; border-radius:10px; object-fit:contain; flex:0 0 38px; }
        .life-tool-copy { min-width:0; }
        .life-tool-name { display:block; font-size:14px; font-weight:650; line-height:1.4; overflow-wrap:anywhere; }
        .life-tool-code { display:block; margin-top:4px; font:11px Consolas,monospace; opacity:.58; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .life-empty { padding:52px 18px; text-align:center; border:1px dashed; border-radius:12px; line-height:1.7; }
        html.dark .card-body { color:#e2e8f0; }
        html.dark .life-intro { background:linear-gradient(135deg,#0b172b,#0f2438); border:1px solid #1e293b; box-shadow:0 14px 38px rgba(0,0,0,.22); }
        html.dark .tool-head .title { color:#f8fafc; }
        html.dark .description, html.dark .life-subtitle { color:#94a3b8; }
        html.dark .life-count { color:#bae6fd; background:rgba(14,116,144,.22); border:1px solid rgba(56,189,248,.35); }
        html.dark .life-dashboard { background:#090e1f; border:1px solid #1e293b; box-shadow:inset 0 1px 3px rgba(0,0,0,.4); }
        html.dark .life-search { color:#f8fafc; background:#0f172a; border-color:#334155; }
        html.dark .life-search::placeholder, html.dark .life-search-icon { color:#94a3b8; }
        html.dark .life-search-clear { color:#94a3b8; }
        html.dark .life-search-clear:hover { color:#f8fafc; background:#1e293b; }
        html.dark .life-tool-card { color:#cbd5e1; background:#0f172a; border-color:#1e293b; }
        html.dark .life-tool-card:hover { color:#f8fafc; background:#102a43; border-color:#38bdf8; box-shadow:0 8px 24px rgba(0,0,0,.3); }
        html.dark .life-tool-icon { background:#172554; }
        html.dark .life-empty { color:#94a3b8; border-color:#334155; }
        html:not(.dark) .card-body { color:#0f172a; }
        html:not(.dark) .life-intro { background:linear-gradient(135deg,#ffffff,#f0f9ff); border:1px solid #e2e8f0; box-shadow:0 10px 30px rgba(15,23,42,.07); }
        html:not(.dark) .tool-head .title { color:#0f172a; }
        html:not(.dark) .description, html:not(.dark) .life-subtitle { color:#475569; }
        html:not(.dark) .life-count { color:#075985; background:#e0f2fe; border:1px solid #bae6fd; }
        html:not(.dark) .life-dashboard { background:#f8fafc; border:1px solid #e2e8f0; box-shadow:inset 0 1px 2px rgba(15,23,42,.03); }
        html:not(.dark) .life-search { color:#0f172a; background:#fff; border-color:#cbd5e1; }
        html:not(.dark) .life-search::placeholder, html:not(.dark) .life-search-icon { color:#64748b; }
        html:not(.dark) .life-search-clear { color:#64748b; }
        html:not(.dark) .life-search-clear:hover { color:#0f172a; background:#e2e8f0; }
        html:not(.dark) .life-tool-card { color:#1e293b; background:#fff; border-color:#e2e8f0; box-shadow:0 2px 8px rgba(15,23,42,.04); }
        html:not(.dark) .life-tool-card:hover { color:#0f172a; background:#f0f9ff; border-color:#38bdf8; box-shadow:0 8px 22px rgba(14,116,144,.12); }
        html:not(.dark) .life-tool-icon { background:#f0f9ff; }
        html:not(.dark) .life-empty { color:#64748b; border-color:#cbd5e1; background:#fff; }
        @media (max-width:600px) { .life-shell { padding:16px 12px 48px; } .life-intro { align-items:flex-start; flex-direction:column; gap:14px; } .life-dashboard { align-items:stretch; } .life-search-wrap { max-width:none; } .life-grid { grid-template-columns:1fr; } }
        @media (prefers-reduced-motion:reduce) { .life-tool-card { transition:none; } .life-tool-card:hover { transform:none; } }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar"><a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a><span class="tool-topbar-sep">/</span><span class="tool-topbar-title">生活</span><a href="./" class="tool-topbar-home">&#8592; 首页</a></header>
<main class="main-body tool-page-body" id="app">
    <div class="tool-body life-shell">
        <div class="card-model">
            <div class="card-body">
                <section class="life-intro" aria-labelledby="life-title">
                    <div><div class="life-kicker">LIFE TOOLKIT / 6767</div><div class="tool-head"><h1 class="title" id="life-title">生活工具箱</h1></div><div class="description">把财务规划、时间管理与日常查询，整理成随手可用的轻量工具。</div></div>
                    <div class="life-count" aria-live="polite"><span class="life-count-dot"></span>{{ filteredCount }} 款可用工具</div>
                </section>
                <div class="life-dashboard" role="search">
                    <div class="life-search-wrap"><span class="life-search-icon" aria-hidden="true">⌕</span><input class="life-search" type="search" v-model="searchQuery" placeholder="搜索工具名称或代码…" aria-label="搜索生活工具" /><button v-if="searchQuery" class="life-search-clear" type="button" aria-label="清除搜索" @click="searchQuery = ''">×</button></div>
                    <span class="life-subtitle">输入关键词即可快速筛选</span>
                </div>
                <div v-if="filteredList.length" class="life-grid" aria-label="生活工具列表">
                    <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="life-tool-card" :title="t.toolName">
                        <img :src="t.icon || './img/icons/default.svg'" alt="" class="life-tool-icon" loading="lazy" />
                        <span class="life-tool-copy"><span class="life-tool-name">{{ t.toolName }}</span><span class="life-tool-code">/{{ t.toolCode }}</span></span>
                    </a>
                </div>
                <div v-else class="life-empty" role="status">未找到匹配的工具<br><small>请尝试更换关键词“{{ searchQuery }}”</small></div>
            </div>
        </div>
    </div>
</main>
<script src="./lib/vue/vue.global.prod.js"></script>
<script src="./lib/element-plus/index.js"></script>
<script src="./lib/element-plus/locale/en.js"></script>
<script src="./lib/element-plus/locale/zh-tw.js"></script>
<script>
var toolData=[{"key":"life","desc":"生活","toolList":[{"toolName":"复利定投与理财收益计算器","toolCode":"compound-interest-calculator","icon":"./img/icons/compound-interest-calculator.svg"},{"toolName":"全款与车贷落地费用精算器","toolCode":"car-loan-calculator","icon":"./img/icons/car-loan-calculator.svg"},{"toolName":"世界时钟与跨时区会议规划器","toolCode":"world-clock-planner","icon":"./img/icons/world-clock-planner.svg"},{"toolName":"生活垃圾分类离线速查字典","toolCode":"garbage-classification","icon":"./img/icons/garbage-classification.svg"},{"toolName":"中国亲戚关系称谓换算器","toolCode":"kinship-calculator","icon":"./img/icons/kinship-calculator.svg"},{"toolName":"2026最新个税与五险一金计算器","toolCode":"salary-tax-calculator","icon":"./img/icons/salary-tax-calculator.svg"},{"toolName":"房贷提前还款与省息对比器","toolCode":"mortgage-advanced-calculator","icon":"./img/icons/mortgage-advanced-calculator.svg"},{"toolName":"日期间隔与重要日子倒计时","toolCode":"date-calculator","icon":"./img/icons/date-calculator.svg"},{"toolName":"年龄计算器","toolCode":"age","icon":"./img/icons/age.svg"},{"toolName":"退休年龄查询","toolCode":"retirement-time-query","icon":"./img/icons/retirement-time-query.svg"},{"toolName":"世界各国首都","toolCode":"capital","icon":"./img/icons/capital.svg"},{"toolName":"世界各国国旗和区旗图案","toolCode":"flag","icon":"./img/icons/flag.svg"},{"toolName":"贷款计算器","toolCode":"loan-calculator","icon":"./img/icons/loan-calculator.svg"},{"toolName":"文胸尺码查询","toolCode":"bra-size","icon":"./img/icons/bra-size.svg"},{"toolName":"内裤尺码查询","toolCode":"underwear-size","icon":"./img/icons/underwear-size.svg"},{"toolName":"女装尺码查询","toolCode":"woman-clothing-size","icon":"./img/icons/woman-clothing-size.svg"},{"toolName":"女士衬衫尺码查询","toolCode":"woman-shirt-size","icon":"./img/icons/woman-shirt-size.svg"},{"toolName":"连衣裙尺码查询","toolCode":"dress-size","icon":"./img/icons/dress-size.svg"},{"toolName":"小孩服装尺码查询","toolCode":"child-clothe-size","icon":"./img/icons/child-clothe-size.svg"},{"toolName":"男士服装尺码查询","toolCode":"man-clothing-size","icon":"./img/icons/man-clothing-size.svg"},{"toolName":"男士裤子尺码查询","toolCode":"man-pant-size","icon":"./img/icons/man-pant-size.svg"}]},{"key":"brain","desc":"脑力训练","children":[]}];
var currentCatKey="life";
const {createApp,ref,computed}=Vue;
createApp({setup(){const searchQuery=ref('');const currentCat=toolData.find(c=>c.key===currentCatKey)||{toolList:[],children:[]};const isBrain=currentCatKey==='brain';const filteredList=computed(()=>{const list=currentCat.toolList||[];if(!searchQuery.value.trim())return list;const q=searchQuery.value.trim().toLowerCase();return list.filter(t=>t.toolName.toLowerCase().includes(q)||t.toolCode.toLowerCase().includes(q));});const filteredSubgroups=computed(()=>{if(!isBrain)return[];const groups=currentCat.children||[];if(!searchQuery.value.trim())return groups;const q=searchQuery.value.trim().toLowerCase();return groups.map(g=>({...g,toolList:g.toolList.filter(t=>t.toolName.toLowerCase().includes(q)||t.toolCode.toLowerCase().includes(q))})).filter(g=>g.toolList.length>0);});const filteredCount=computed(()=>{if(isBrain)return filteredSubgroups.value.reduce((acc,g)=>acc+g.toolList.length,0);return filteredList.value.length;});return{searchQuery,filteredList,filteredSubgroups,filteredCount};}}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
