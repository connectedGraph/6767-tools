<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script>try{Object.defineProperty(Document.prototype,"domain",{get:function(){return location.hostname},configurable:true});}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>图像工具 - 在线工具集</title>
    <meta name="description" content="图像处理与转换工具：调色板提取、多图拼接、马赛克、GIF制作、ICO生成" />
    <meta name="keywords" content="图像,在线工具,在线工具集,6767工具" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link href="./lib/element-plus/index.css" rel="stylesheet" />
    <link href="./css/6767-tailwind.css?v=20260905" rel="stylesheet" />
    <link href="./css/6767-site.css?v=20260905" rel="stylesheet" />
    <link href="./css/tool-dark.css?v=20260905" rel="stylesheet" />
    <style>
        /* Image tools workspace: every custom rule is scoped to this page. */
        *, *::before, *::after { box-sizing: border-box; }
        .image-page { min-height: 100vh; width: 100%; overflow-x: hidden; }
        .image-page .tool-body { width: 100%; max-width: 1180px; margin: 0 auto; padding: 28px 18px 72px; }
        .image-page .card-model { width: 100%; border-radius: 14px; overflow: hidden; }
        .image-page .card-body { width: 100%; padding: 0; }
        .image-page .tool-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; }
        .image-page .title { margin:0; font-size:clamp(26px, 4vw, 36px); line-height:1.15; font-weight:800; letter-spacing:-.035em; }
        .image-page .description { margin:0 0 24px; font-size:14px; line-height:1.7; max-width:700px; }
        .image-page .eyebrow { display:flex; align-items:center; gap:8px; margin:0 0 10px; font:700 11px/1.2 Consolas, monospace; letter-spacing:.12em; text-transform:uppercase; color:#38bdf8; }
        .image-page .eyebrow::before { content:''; width:22px; height:2px; border-radius:2px; background:#38bdf8; }
        .image-page .tool-dashboard { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; padding:14px 16px; margin-bottom:18px; border-radius:12px; transition:all .2s ease; }
        .image-page .dashboard-copy { display:flex; align-items:center; gap:10px; min-width:0; }
        .image-page .dashboard-label { font-size:14px; font-weight:700; white-space:nowrap; }
        .image-page .count-badge { display:inline-flex; align-items:center; min-height:25px; padding:3px 9px; border-radius:999px; font:700 12px/1 Consolas,monospace; color:#bae6fd; background:rgba(14,116,144,.3); border:1px solid rgba(56,189,248,.45); }
        .image-page .search-wrap { position:relative; width:min(100%, 360px); flex:1 1 250px; }
        .image-page .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:15px; pointer-events:none; }
        .image-page .cat-search-input { width:100%; height:40px; padding:0 13px 0 34px; border-radius:9px; outline:none; font-size:14px; transition:all .18s ease; }
        .image-page .cat-search-input::placeholder { color:#94a3b8; }
        .image-page .cat-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap:12px; }
        .image-page .cat-tool-card { display:flex; align-items:center; gap:13px; min-width:0; min-height:68px; padding:12px 14px; border-radius:11px; text-decoration:none; transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; }
        .image-page .cat-tool-card:focus-visible, .image-page .cat-search-input:focus-visible { outline:3px solid rgba(56,189,248,.45); outline-offset:2px; }
        .image-page .cat-tool-card:hover { transform:translateY(-2px); }
        .image-page .cat-tool-icon { width:34px; height:34px; flex:0 0 34px; object-fit:contain; border-radius:8px; }
        .image-page .cat-tool-name { min-width:0; font-size:14px; line-height:1.4; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .image-page .cat-tool-arrow { margin-left:auto; flex:0 0 auto; font-size:18px; opacity:.45; transition:transform .18s ease, opacity .18s ease; }
        .image-page .cat-tool-card:hover .cat-tool-arrow { opacity:1; transform:translateX(3px); }
        .image-page .empty-hint { padding:56px 16px; border-radius:12px; text-align:center; font:14px/1.7 Consolas,monospace; }

        html.dark .image-page { background:transparent; color:#e2e8f0; }
        html.dark .image-page .title { color:#f8fafc; }
        html.dark .image-page .description { color:#94a3b8; }
        html.dark .image-page .tool-dashboard { background:#090e1f; border:1px solid #1e293b; box-shadow:inset 0 1px 3px rgba(0,0,0,.4); }
        html.dark .image-page .cat-search-input { color:#f8fafc; background:#0f172a; border:1px solid #334155; }
        html.dark .image-page .cat-search-input:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.18); }
        html.dark .image-page .cat-tool-card { color:#cbd5e1; background:#0f172a; border:1px solid #1e293b; box-shadow:0 4px 14px rgba(0,0,0,.12); }
        html.dark .image-page .cat-tool-card:hover { color:#f8fafc; background:#10243a; border-color:#38bdf8; box-shadow:0 8px 22px rgba(0,0,0,.3); }
        html.dark .image-page .empty-hint { color:#94a3b8; background:#0f172a; border:1px dashed #334155; }
        html:not(.dark) .image-page { background:transparent; color:#1e293b; }
        html:not(.dark) .image-page .title { color:#0f172a; }
        html:not(.dark) .image-page .description { color:#475569; }
        html:not(.dark) .image-page .tool-dashboard { background:#f8fafc; border:1px solid #e2e8f0; box-shadow:inset 0 1px 2px rgba(0,0,0,.03); }
        html:not(.dark) .image-page .dashboard-label { color:#1e293b; }
        html:not(.dark) .image-page .count-badge { color:#075985; background:#e0f2fe; border-color:#7dd3fc; }
        html:not(.dark) .image-page .cat-search-input { color:#0f172a; background:#fff; border:1px solid #cbd5e1; }
        html:not(.dark) .image-page .cat-search-input:focus { border-color:#0284c7; box-shadow:0 0 0 3px rgba(2,132,199,.16); }
        html:not(.dark) .image-page .cat-tool-card { color:#334155; background:#fff; border:1px solid #e2e8f0; box-shadow:0 3px 12px rgba(15,23,42,.05); }
        html:not(.dark) .image-page .cat-tool-card:hover { color:#0f172a; background:#f0f9ff; border-color:#38bdf8; box-shadow:0 8px 20px rgba(14,116,144,.12); }
        html:not(.dark) .image-page .empty-hint { color:#475569; background:#fff; border:1px dashed #cbd5e1; }
        @media (max-width:768px) { .image-page .tool-body { padding:20px 12px 48px; } .image-page .tool-dashboard { align-items:stretch; } .image-page .dashboard-copy { width:100%; justify-content:space-between; } .image-page .search-wrap { flex-basis:100%; } }
        @media (max-width:420px) { .image-page .cat-grid { grid-template-columns:1fr; } .image-page .cat-tool-card { min-height:62px; } }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar">
  <a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a>
  <span class="tool-topbar-sep">/</span><span class="tool-topbar-title">图像</span>
  <a href="./" class="tool-topbar-home">&#8592; 首页</a>
</header>

<main class="main-body tool-page-body image-page" id="app">
    <div class="tool-body">
        <div class="card-model">
            <div class="card-body">
                <div class="tool-head">
                    <div><p class="eyebrow">IMAGE WORKSPACE</p><h1 class="title">图像工具</h1></div>
                </div>
                <div class="description">一组轻量、快速且注重隐私的图像处理工具。选择一个工具开始处理，不需要上传到服务器。</div>
                <div class="tool-dashboard" aria-label="图像工具筛选">
                    <div class="dashboard-copy"><span class="dashboard-label">可用工具</span><span class="count-badge">{{ filteredCount }} 款</span></div>
                    <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input type="search" v-model="searchQuery" placeholder="搜索工具名称或代码..." class="cat-search-input" aria-label="搜索图像工具" /></label>
                </div>
                <div v-if="filteredList.length" class="cat-grid">
                    <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="cat-tool-card" :title="t.toolName">
                        <img :src="t.icon || './img/icons/default.svg'" alt="" class="cat-tool-icon" /><span class="cat-tool-name">{{ t.toolName }}</span><span class="cat-tool-arrow" aria-hidden="true">›</span>
                    </a>
                </div>
                <div v-else class="empty-hint">// 未找到匹配的工具: “{{ searchQuery }}”</div>
            </div>
        </div>
    </div>
</main>

<script src="./lib/vue/vue.global.prod.js"></script>
<script src="./lib/element-plus/index.js"></script>
<script src="./lib/element-plus/locale/en.js"></script>
<script src="./lib/element-plus/locale/zh-tw.js"></script>
<script>
    var toolData = [{"key":"image","desc":"图像","toolList":[
      {"toolName":"图片调色板提取器","toolCode":"color-palette-extractor","icon":"./img/icons/color-palette-extractor.svg"},{"toolName":"多图无损拼接与长图生成器","toolCode":"image-stitcher","icon":"./img/icons/image-stitcher.svg"},{"toolName":"图片马赛克与局部隐私遮挡","toolCode":"image-mosaic-blur","icon":"./img/icons/image-mosaic-blur.svg"},{"toolName":"图像格式转换器","toolCode":"convert-image","icon":"./img/icons/convert-image.svg"},{"toolName":"压缩图像","toolCode":"compress-image","icon":"./img/icons/compress-image.svg"},{"toolName":"调整图像大小","toolCode":"resize-image","icon":"./img/icons/resize-image.svg"},{"toolName":"调整图像宽高比例","toolCode":"adjust-image-aspect-ratio","icon":"./img/icons/adjust-image-aspect-ratio.svg"},{"toolName":"批量给图片加水印","toolCode":"watermark-image","icon":"./img/icons/watermark-image.svg"},{"toolName":"批量旋转图像","toolCode":"rotate-image","icon":"./img/icons/rotate-image.svg"},{"toolName":"在线生成透明ICO图标","toolCode":"ico-generator","icon":"./img/icons/ico-generator.svg"},{"toolName":"在线生成透明圆角图片","toolCode":"round-image","icon":"./img/icons/round-image.svg"},{"toolName":"制作gif图片，编辑gif图片","toolCode":"create-gif","icon":"./img/icons/create-gif.svg"},{"toolName":"视频转gif图片，视频转动图","toolCode":"video-to-gif","icon":"./img/icons/video-to-gif.svg"},{"toolName":"分解gif图片","toolCode":"decompose-gif","icon":"./img/icons/decompose-gif.svg"},{"toolName":"裁剪、编辑图像","toolCode":"crop-image","icon":"./img/icons/crop-image.svg"},{"toolName":"生成宫格图像，分割图片","toolCode":"generate-grid-image","icon":"./img/icons/generate-grid-image.svg"},{"toolName":"图像处理助手桌面应用程序","toolCode":"image-processing-assistant-app","icon":"./up/2023/1028/image-processing-assistant-icon.png"},{"toolName":"图像压缩器桌面应用程序","toolCode":"image-compressor-app","icon":"./up/2023/1028/image-compress-logo.png"}
    ]}];
    var currentCatKey = "image";
    const { createApp, ref, computed } = Vue;
    createApp({ setup() {
        const searchQuery = ref('');
        const currentCat = toolData.find(c => c.key === currentCatKey) || { toolList: [], children: [] };
        const isBrain = currentCatKey === 'brain';
        const filteredList = computed(() => { const list = currentCat.toolList || []; if (!searchQuery.value.trim()) return list; const q = searchQuery.value.trim().toLowerCase(); return list.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q)); });
        const filteredSubgroups = computed(() => { if (!isBrain) return []; const groups = currentCat.children || []; if (!searchQuery.value.trim()) return groups; const q = searchQuery.value.trim().toLowerCase(); return groups.map(g => ({...g, toolList:g.toolList.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q))})).filter(g => g.toolList.length > 0); });
        const filteredCount = computed(() => isBrain ? filteredSubgroups.value.reduce((acc,g) => acc + g.toolList.length, 0) : filteredList.value.length);
        return { searchQuery, filteredList, filteredSubgroups, filteredCount };
    }}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
