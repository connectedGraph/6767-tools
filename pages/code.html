            align-items: center;

            margin-bottom: 24px;
            padding-bottom: 20px;

        .cat-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cat-title {
            font-size: 24px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cat-badge {
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;

            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);

        }
        .cat-search-input {
            width: 260px;
            height: 38px;
            background: #090f1d !important;
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 8px;
            padding: 0 14px;
            color: #f1f5f9 !important;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .cat-search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        /* 响应式网格 */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }
        .cat-tool-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(51, 65, 85, 0.7);
            border-radius: 10px;
            text-decoration: none;
            color: #cbd5e1;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0;
            backdrop-filter: blur(8px);
        }
        .cat-tool-card:hover {
            background: rgba(8, 47, 73, 0.5);
            border-color: rgba(56, 189, 248, 0.6);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 14px rgba(56, 189, 248, 0.15);
        }
        .cat-tool-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .cat-tool-name {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        /* 子分组 (脑力训练等) */
        .subgroup-section {
            margin-bottom: 28px;
        }
        .subgroup-title {
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .subgroup-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background: #38bdf8;
            border-radius: 2px;
        }
        .empty-hint {
            text-align: center;
            padding: 60px 0;
            color: #64748b;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }

    <!-- Brain Children View -->
    
    <!-- Standard Category Grid -->
    <div v-if="filteredList.length" class="cat-grid">
        <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="cat-tool-card" :title="t.toolName">

        </a>
    </div>
    <div v-else class="empty-hint">
        // 未找到匹配的工具: "{{ searchQuery }}"

</main>

    var currentCatKey = "code";

    const { createApp, ref, computed } = Vue;

    createApp({
        setup() {
            const searchQuery = ref('');
            const currentCat = toolData.find(c => c.key === currentCatKey) || { toolList: [], children: [] };

            const isBrain = currentCatKey === 'brain';

            const filteredList = computed(() => {
                const list = currentCat.toolList || [];
                if (!searchQuery.value.trim()) return list;
                const q = searchQuery.value.trim().toLowerCase();
                return list.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q));
            });

            const filteredSubgroups = computed(() => {
                if (!isBrain) return [];
                const groups = currentCat.children || [];
                if (!searchQuery.value.trim()) return groups;
                const q = searchQuery.value.trim().toLowerCase();
                return groups.map(g => ({
                    ...g,
                    toolList: g.toolList.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q))
                })).filter(g => g.toolList.length > 0);
            });

            const filteredCount = computed(() => {
                if (isBrain) {
                    return filteredSubgroups.value.reduce((acc, g) => acc + g.toolList.length, 0);
                }
                return filteredList.value.length;
            });

            return {
                searchQuery,
                filteredList,
                filteredSubgroups,
                filteredCount
            };
        }
    }).use(ElementPlus).mount('#app');
