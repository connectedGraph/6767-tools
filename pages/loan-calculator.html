        .results-heading h2 { margin:0; font-size:17px; color:inherit; }

        html:not(.dark) .results-heading span { color:#64748b; }
        .result-section { margin-top:18px; }

                <div class="loan-layout">
                    <section class="loan-panel" aria-labelledby="input-heading">

                        <el-form :model="formData" ref="computeForm" size="large" class="tool-form loan-form">
                            <el-form-item prop="loanAmount" :rules="[{required: true, message: `请输入`, trigger: 'blur'}, { pattern: /^(?!(0[0-9]{0,}$))[0-9]{1,}[.]{0,}[0-9]{0,}$/, message: `必须是大于0的数字`, trigger: 'blur' }]">
                                <el-input-extend type="number" v-model="formData.loanAmount" label="贷款金额" class="w100"></el-input-extend>
                            </el-form-item>
                            <el-form-item prop="loanRate" :rules="[{required: true, message: `请输入`, trigger: 'blur'}]">
                                <el-input-extend type="number" v-model="formData.loanRate" label="贷款利率(%)" class="w100"></el-input-extend>
                            </el-form-item>
                            <el-form-item prop="loanTerm" :rules="[{required: true, message: `请输入`, trigger: 'blur'}, { pattern: /^[1-9]\d*$/, message: `必须是大于0的整数`, trigger: 'blur' }]">
                                <el-input-extend type="number" v-model="formData.loanTerm" label="贷款期限(月)" class="w100"></el-input-extend>

                            <el-button type="primary" v-on:click="compute">计算</el-button>
                        </el-form>
                    </section>
                    <section class="loan-panel" aria-labelledby="results-heading">

                            <div class="result-grid">
                                <div class="result-card"><el-input-extend v-model="monthAmount" label="每月还款" :readonly="true" class="w100"></el-input-extend></div>
                                <div class="result-card"><el-input-extend v-model="totalInterest" label="总支付利息" :readonly="true" class="w100"></el-input-extend></div>
                                <div class="result-card"><el-input-extend v-model="totalAmount" label="本金和利息合计" :readonly="true" class="w100"></el-input-extend></div>
                            </div>
                        </div>
                        <div class="result-section">

                                <div class="result-card"><el-input-extend v-model="monthDecrease" label="每月递减" :readonly="true" class="w100"></el-input-extend></div>
                                <div class="result-card"><el-input-extend v-model="totalInterest2" label="总支付利息" :readonly="true" class="w100"></el-input-extend></div>
                                <div class="result-card"><el-input-extend v-model="totalAmount2" label="本金和利息合计" :readonly="true" class="w100"></el-input-extend></div>
                            </div>
                            <div class="month-repayment-list" v-if="monthRepaymentList!=null" v-html="monthRepaymentList"></div>
                        </div>
                    </section>

                <div class="loan-note"><p>商业贷款计算器，贷款利率在线计算器，贷款利率计算公式，房贷利率计算器，房屋抵押贷款计算，商业贷款计算器,银行贷款计算器</p></div>
