<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script>try{Object.defineProperty(Document.prototype,"domain",{get:function(){return location.hostname},configurable:true});}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>健康 - 在线工具集</title>
    <meta name="description" content="身体健康与运动计算：每日饮水、90分钟睡眠、食物热量、BMI与燃脂心率" />
    <meta name="keywords" content="健康,在线工具,在线工具集,6767工具" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link href="./lib/element-plus/index.css" rel="stylesheet" />
    <link href="./css/6767-tailwind.css?v=20260905" rel="stylesheet" />
    <link href="./css/6767-site.css?v=20260905" rel="stylesheet" />
    <link href="./css/tool-dark.css?v=20260905" rel="stylesheet" />
    <style>
        /* Health catalogue: all rules are local to this page and intentionally define both themes. */
        .health-page { min-height: 100vh; box-sizing: border-box; padding: 24px 16px 64px; }
        .health-page *, .health-page *::before, .health-page *::after { box-sizing: border-box; }
        .health-page .tool-body { width: 100%; max-width: 1180px; margin: 0 auto; }
        .health-page .card-model { width: 100%; border-radius: 14px; overflow: hidden; }
        .health-page .card-body { padding: clamp(20px, 4vw, 38px); }
        .health-page .tool-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 8px; }
        .health-page .title { margin: 0; font-size: clamp(25px, 4vw, 36px); line-height: 1.15; letter-spacing: -.03em; font-weight: 800; }
        .health-page .description { margin: 0 0 24px; font-size: 15px; line-height: 1.7; }
        .health-page .health-dashboard { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 24px; border-radius: 12px; transition: .2s ease; }
        .health-page .health-kicker { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .health-page .health-kicker strong { font-size: 14px; white-space: nowrap; }
        .health-page .health-kicker span { font: 600 12px/1.2 Consolas, monospace; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
        .health-page .health-search { width: min(100%, 310px); min-height: 40px; padding: 8px 12px; border-radius: 8px; outline: none; font-size: 14px; transition: .15s ease; }
        .health-page .health-search:focus { box-shadow: 0 0 0 3px rgba(56,189,248,.2); }
        .health-page .health-search::placeholder { opacity: .7; }
        .health-page .health-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 245px), 1fr)); gap: 12px; }
        .health-page .health-card { display: flex; align-items: center; gap: 12px; min-height: 68px; min-width: 0; padding: 12px 14px; border-radius: 11px; text-decoration: none; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease; }
        .health-page .health-card:hover { transform: translateY(-2px); }
        .health-page .health-card:active { transform: translateY(0); }
        .health-page .health-card:focus-visible, .health-page .health-search:focus-visible { outline: 3px solid rgba(56,189,248,.45); outline-offset: 2px; }
        .health-page .health-icon { width: 36px; height: 36px; object-fit: contain; flex: 0 0 36px; border-radius: 9px; }
        .health-page .health-name { min-width: 0; font-size: 14px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
        .health-page .empty-hint { padding: 44px 16px; text-align: center; font: 14px/1.7 Consolas, monospace; }

        html.dark .health-page { color: #e2e8f0; background: transparent; }
        html.dark .health-page .card-model { background: #0f172a; border: 1px solid #1e293b; box-shadow: 0 18px 50px rgba(0,0,0,.24); }
        html.dark .health-page .title { color: #f8fafc; }
        html.dark .health-page .description { color: #94a3b8; }
        html.dark .health-page .health-dashboard { background: #090e1f; border: 1px solid #1e293b; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
        html.dark .health-page .health-kicker strong { color: #e2e8f0; }
        html.dark .health-page .health-kicker span { color: #7dd3fc; background: rgba(14,116,144,.2); border: 1px solid rgba(56,189,248,.35); }
        html.dark .health-page .health-search { color: #f8fafc; background: #0b1120; border: 1px solid #334155; }
        html.dark .health-page .health-search:focus { border-color: #38bdf8; }
        html.dark .health-page .health-card { color: #cbd5e1; background: #111c31; border: 1px solid #26364d; }
        html.dark .health-page .health-card:hover { color: #f8fafc; background: #122a42; border-color: #38bdf8; box-shadow: 0 8px 22px rgba(0,0,0,.28); }
        html.dark .health-page .empty-hint { color: #94a3b8; }

        html:not(.dark) .health-page { color: #1e293b; background: transparent; }
        html:not(.dark) .health-page .card-model { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 14px 38px rgba(15,23,42,.08); }
        html:not(.dark) .health-page .title { color: #0f172a; }
        html:not(.dark) .health-page .description { color: #475569; }
        html:not(.dark) .health-page .health-dashboard { background: #f8fafc; border: 1px solid #e2e8f0; box-shadow: inset 0 1px 2px rgba(15,23,42,.03); }
        html:not(.dark) .health-page .health-kicker strong { color: #1e293b; }
        html:not(.dark) .health-page .health-kicker span { color: #0369a1; background: #e0f2fe; border: 1px solid #bae6fd; }
        html:not(.dark) .health-page .health-search { color: #0f172a; background: #ffffff; border: 1px solid #cbd5e1; }
        html:not(.dark) .health-page .health-search:focus { border-color: #0284c7; }
        html:not(.dark) .health-page .health-card { color: #334155; background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(15,23,42,.04); }
        html:not(.dark) .health-page .health-card:hover { color: #0f172a; background: #f0f9ff; border-color: #7dd3fc; box-shadow: 0 8px 20px rgba(14,116,144,.12); }
        html:not(.dark) .health-page .empty-hint { color: #64748b; }
        @media (max-width: 600px) { .health-page { padding: 12px 10px 40px; } .health-page .card-body { padding: 20px 14px; } .health-page .health-dashboard { align-items: stretch; } .health-page .health-kicker, .health-page .health-search { width: 100%; } .health-page .health-search { max-width: none; } }
        @media (prefers-reduced-motion: reduce) { .health-page .health-card { transition: none; } .health-page .health-card:hover { transform: none; } }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar"><a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a><span class="tool-topbar-sep">/</span><span class="tool-topbar-title">健康</span><a href="./" class="tool-topbar-home">&#8592; 首页</a></header>

<main class="main-body tool-page-body health-page" id="app">
    <div class="tool-body">
        <div class="card-model">
            <div class="card-body">
                <div class="tool-head"><h1 class="title">健康工具中心</h1></div>
                <div class="description">从日常饮水、睡眠节律到营养与运动指标，选择一个工具开始快速计算。结果仅供参考，请结合专业建议。</div>
                <section class="health-dashboard" aria-label="健康工具筛选">
                    <div class="health-kicker"><strong>健康工具</strong><span>{{ filteredCount }} 项可用</span></div>
                    <input v-model="searchQuery" class="health-search" type="search" aria-label="搜索健康工具" placeholder="搜索工具名称或编号…" />
                </section>
                <div v-if="filteredList.length" class="health-grid">
                    <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="health-card" :title="t.toolName">
                        <img :src="t.icon || './img/icons/default.svg'" alt="" class="health-icon" loading="lazy" />
                        <span class="health-name">{{ t.toolName }}</span>
                    </a>
                </div>
                <div v-else class="empty-hint">// 未找到匹配的工具：“{{ searchQuery }}”</div>
            </div>
        </div>
    </div>
</main>

<script src="./lib/vue/vue.global.prod.js"></script>
<script src="./lib/element-plus/index.js"></script>
<script src="./lib/element-plus/locale/en.js"></script>
<script src="./lib/element-plus/locale/zh-tw.js"></script>
<script>
    var toolData = [{"key":"health","desc":"健康","toolList":[
        {"toolName":"科学每日饮水量计算器","toolCode":"water-intake-calculator","icon":"./img/icons/water-intake-calculator.svg"},
        {"toolName":"90分钟睡眠周期与起床时间计算器","toolCode":"sleep-cycle-calculator","icon":"./img/icons/sleep-cycle-calculator.svg"},
        {"toolName":"常用食物热量与营养成分速查表","toolCode":"food-calories-lookup","icon":"./img/icons/food-calories-lookup.svg"},
        {"toolName":"BMI指数计算","toolCode":"bmi","icon":"./img/icons/bmi.svg"},
        {"toolName":"基础代谢率(BMR)计算器","toolCode":"bmr","icon":"./img/icons/bmr.svg"},
        {"toolName":"体脂率（BFR）计算器","toolCode":"bfr","icon":"./img/icons/bfr.svg"},
        {"toolName":"标准体重计算器","toolCode":"weight","icon":"./img/icons/weight.svg"},
        {"toolName":"燃脂心率计算器","toolCode":"burn-fat-heart-rate","icon":"./img/icons/burn-fat-heart-rate.svg"},
        {"toolName":"体质综合测试","toolCode":"physical-fitness-test","icon":"./img/icons/physical-fitness-test.svg"},
        {"toolName":"蛋白质摄入量计算器","toolCode":"protein-intake","icon":"./img/icons/protein-intake.svg"},
        {"toolName":"焦耳卡路里换算器","toolCode":"energy-convert","icon":"./img/icons/energy-convert.svg"},
        {"toolName":"跑步卡路里消耗计算器","toolCode":"running-calorie","icon":"./img/icons/running-calorie.svg"},
        {"toolName":"女性最佳身材计算器","toolCode":"best-figure","icon":"./img/icons/best-figure.svg"},
        {"toolName":"女性安全期计算器","toolCode":"female-safe-period","icon":"./img/icons/female-safe-period.svg"},
        {"toolName":"孩子身高预测","toolCode":"child-height","icon":"./img/icons/child-height.svg"},
        {"toolName":"血型遗传规律和血型性格","toolCode":"bood-type","icon":"./img/icons/bood-type.svg"},
        {"toolName":"色盲色弱检测","toolCode":"color-blindness-test","icon":"./img/icons/color-blindness-test.svg"},
        {"toolName":"植物油脂肪含量查询","toolCode":"vegetable-oil","icon":"./img/icons/vegetable-oil.svg"}
    ]}];
    var currentCatKey = "health";
    const { createApp, ref, computed } = Vue;
    createApp({ setup() {
        const searchQuery = ref('');
        const currentCat = toolData.find(c => c.key === currentCatKey) || { toolList: [], children: [] };
        const isBrain = currentCatKey === 'brain';
        const filteredList = computed(() => {
            const list = currentCat.toolList || [];
            if (!searchQuery.value.trim()) return list;
            const q = searchQuery.value.trim().toLowerCase();
            return list.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q));
        });
        const filteredSubgroups = computed(() => {
            if (!isBrain) return [];
            const groups = currentCat.children || [];
            if (!searchQuery.value.trim()) return groups;
            const q = searchQuery.value.trim().toLowerCase();
            return groups.map(g => ({...g, toolList: g.toolList.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q))})).filter(g => g.toolList.length > 0);
        });
        const filteredCount = computed(() => isBrain ? filteredSubgroups.value.reduce((acc, g) => acc + g.toolList.length, 0) : filteredList.value.length);
        return { searchQuery, filteredList, filteredSubgroups, filteredCount };
    }}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
