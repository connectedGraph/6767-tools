<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script>try{Object.defineProperty(Document.prototype,"domain",{get:function(){return location.hostname},configurable:true});}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>娱乐 - 在线工具集</title>
    <meta name="description" content="休闲趣味工具：做决定、手持弹幕、摩斯密码、大转盘抽奖、身价测试" />
    <meta name="keywords" content="娱乐,在线工具,在线工具集,6767工具" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link href="./lib/element-plus/index.css" rel="stylesheet" />
    <link href="./css/6767-tailwind.css?v=20260905" rel="stylesheet" />
    <link href="./css/6767-site.css?v=20260905" rel="stylesheet" />
    <link href="./css/tool-dark.css?v=20260905" rel="stylesheet" />
    <style>
        /* Entertainment directory — all component styles are locally scoped. */
        .ent-page { width:100%; max-width:1180px; margin:0 auto; padding:28px 18px 72px; box-sizing:border-box; }
        .ent-page .card-model { overflow:hidden; border-radius:14px; }
        .ent-page .card-body { padding:0; }
        .ent-page .tool-head { margin:0; padding:26px 28px 8px; border:0; }
        .ent-page .title { margin:0; font-size:clamp(24px,4vw,34px); line-height:1.2; font-weight:800; letter-spacing:-.03em; }
        .ent-page .description { margin:0; padding:0 28px 22px; line-height:1.7; font-size:14px; }
        .ent-dashboard { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:0 22px 22px; padding:14px 16px; border-radius:12px; transition:background .2s ease,border-color .2s ease; }
        .ent-summary { display:flex; align-items:center; gap:10px; min-width:0; }
        .ent-kicker { display:inline-flex; align-items:center; gap:7px; font:700 12px/1 'JetBrains Mono',Consolas,monospace; letter-spacing:.08em; text-transform:uppercase; }
        .ent-kicker::before { content:''; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.14); }
        .ent-count { display:inline-flex; align-items:center; min-height:28px; padding:0 10px; border-radius:999px; font:700 12px/1 'JetBrains Mono',Consolas,monospace; }
        .ent-search-wrap { position:relative; flex:1 1 260px; max-width:360px; }
        .ent-search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }
        .ent-search { display:block; box-sizing:border-box; width:100%; min-height:40px; padding:8px 14px 8px 36px; border-radius:9px; outline:none; font-size:14px; transition:border-color .15s,box-shadow .15s,background .15s; }
        .ent-search::placeholder { opacity:.72; }
        .ent-search:focus-visible { box-shadow:0 0 0 3px rgba(14,165,233,.2); }
        .ent-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:12px; padding:0 22px 24px; }
        .ent-tool-card { display:flex; align-items:center; gap:13px; min-width:0; min-height:66px; padding:11px 13px; box-sizing:border-box; border-radius:11px; text-decoration:none; transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease; }
        .ent-tool-card:focus-visible { outline:3px solid rgba(14,165,233,.38); outline-offset:2px; }
        .ent-tool-card:hover { transform:translateY(-2px); }
        .ent-tool-card:active { transform:translateY(0); }
        .ent-icon { width:34px; height:34px; object-fit:contain; flex:0 0 34px; border-radius:8px; }
        .ent-tool-copy { min-width:0; display:flex; flex-direction:column; gap:4px; }
        .ent-tool-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:650; }
        .ent-tool-code { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:11px/1.2 'JetBrains Mono',Consolas,monospace; opacity:.68; }
        .ent-empty { margin:0 22px 24px; padding:48px 18px; border-radius:12px; text-align:center; font:13px/1.7 'JetBrains Mono',Consolas,monospace; }
        html.dark .ent-page .card-model { background:#0f172a; border:1px solid #1e293b; box-shadow:0 18px 50px rgba(0,0,0,.24); }
        html.dark .ent-page .tool-head .title { color:#f8fafc; }
        html.dark .ent-page .description { color:#94a3b8; }
        html.dark .ent-dashboard { background:#090e1f; border:1px solid #1e293b; box-shadow:inset 0 1px 3px rgba(0,0,0,.4); }
        html.dark .ent-kicker { color:#e2e8f0; }
        html.dark .ent-count { color:#bae6fd; background:rgba(14,116,144,.25); border:1px solid #155e75; }
        html.dark .ent-search { color:#f8fafc; background:#0b1120; border:1px solid #334155; }
        html.dark .ent-search:focus { border-color:#38bdf8; }
        html.dark .ent-search-icon { color:#7dd3fc; }
        html.dark .ent-tool-card { color:#cbd5e1; background:#111c31; border:1px solid #26354b; }
        html.dark .ent-tool-card:hover { color:#f8fafc; background:#102a43; border-color:#38bdf8; box-shadow:0 9px 22px rgba(0,0,0,.28); }
        html.dark .ent-tool-code { color:#94a3b8; }
        html.dark .ent-empty { color:#94a3b8; background:#0b1120; border:1px dashed #334155; }
        html:not(.dark) .ent-page .card-model { background:#fff; border:1px solid #e2e8f0; box-shadow:0 14px 38px rgba(15,23,42,.08); }
        html:not(.dark) .ent-page .tool-head .title { color:#0f172a; }
        html:not(.dark) .ent-page .description { color:#475569; }
        html:not(.dark) .ent-dashboard { background:#f8fafc; border:1px solid #e2e8f0; box-shadow:inset 0 1px 2px rgba(15,23,42,.03); }
        html:not(.dark) .ent-kicker { color:#1e293b; }
        html:not(.dark) .ent-count { color:#075985; background:#e0f2fe; border:1px solid #bae6fd; }
        html:not(.dark) .ent-search { color:#0f172a; background:#fff; border:1px solid #cbd5e1; }
        html:not(.dark) .ent-search:focus { border-color:#0284c7; }
        html:not(.dark) .ent-search-icon { color:#0369a1; }
        html:not(.dark) .ent-tool-card { color:#1e293b; background:#fff; border:1px solid #e2e8f0; box-shadow:0 2px 6px rgba(15,23,42,.03); }
        html:not(.dark) .ent-tool-card:hover { color:#0f172a; background:#f0f9ff; border-color:#7dd3fc; box-shadow:0 8px 20px rgba(14,116,144,.12); }
        html:not(.dark) .ent-tool-code { color:#64748b; }
        html:not(.dark) .ent-empty { color:#475569; background:#f8fafc; border:1px dashed #cbd5e1; }
        @media (max-width:768px) { .ent-page{padding:16px 10px 48px}.ent-page .tool-head{padding:21px 18px 7px}.ent-page .description{padding:0 18px 18px}.ent-dashboard{margin:0 12px 16px;padding:12px;align-items:stretch}.ent-summary{width:100%;justify-content:space-between}.ent-search-wrap{max-width:none;flex-basis:100%}.ent-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));padding:0 12px 18px;gap:10px}.ent-empty{margin:0 12px 18px} }
        @media (max-width:430px) { .ent-grid{grid-template-columns:1fr}.ent-tool-card{min-height:62px}.ent-tool-name{font-size:13px} }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar">
  <a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a>
  <span class="tool-topbar-sep">/</span><span class="tool-topbar-title">娱乐</span>
  <a href="./" class="tool-topbar-home">&#8592; 首页</a>
</header>

<main class="main-body tool-page-body ent-page" id="app">
    <div class="tool-body">
        <div class="card-model">
            <div class="card-body">
                <div class="tool-head"><h1 class="title">娱乐工具</h1></div>
                <div class="description">轻松一点，发现适合当下的趣味工具。决定吃什么、制作像素画，或和朋友来一场随机抽奖。</div>
                <section class="ent-dashboard" aria-label="工具筛选">
                    <div class="ent-summary"><span class="ent-kicker">Entertainment hub</span><span class="ent-count">{{ filteredCount }} 款工具</span></div>
                    <label class="ent-search-wrap"><span class="ent-search-icon" aria-hidden="true">⌕</span><input v-model="searchQuery" class="ent-search" type="search" placeholder="搜索工具名称或编号…" aria-label="搜索娱乐工具" /></label>
                </section>
                <div v-if="filteredList.length" class="ent-grid">
                    <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="ent-tool-card" :title="t.toolName">
                        <img :src="t.icon || './img/icons/default.svg'" alt="" class="ent-icon" loading="lazy" />
                        <span class="ent-tool-copy"><span class="ent-tool-name">{{ t.toolName }}</span><span class="ent-tool-code">/{{ t.toolCode }}</span></span>
                    </a>
                </div>
                <div v-else class="ent-empty">没有找到匹配的工具<br><span>请尝试更换关键词：{{ searchQuery }}</span></div>
            </div>
        </div>
    </div>
</main>

<script src="./lib/vue/vue.global.prod.js"></script>
<script src="./lib/element-plus/index.js"></script>
<script src="./lib/element-plus/locale/en.js"></script>
<script src="./lib/element-plus/locale/zh-tw.js"></script>
<script>
    var toolData = [{"key":"ent","desc":"娱乐","toolList":[{"toolName":"像素画 / 8-bit 图标在线编辑器","toolCode":"pixel-art-maker","icon":"./img/icons/pixel-art-maker.svg"},{"toolName":"今天吃什么 / 帮我做决定","toolCode":"decision-maker","icon":"./img/icons/decision-maker.svg"},{"toolName":"手持全屏弹幕 / LED 滚动屏幕","toolCode":"led-banner","icon":"./img/icons/led-banner.svg"},{"toolName":"摩斯密码翻译器，摩斯密码音频播放器","toolCode":"morse-code-translator","icon":"./img/icons/morse-code-translator.svg"},{"toolName":"幸运大转盘抽奖","toolCode":"lucky-wheel","icon":"./img/icons/lucky-wheel.svg"},{"toolName":"在线抽奖工具","toolCode":"lottery","icon":"./img/icons/lottery.svg"},{"toolName":"身价计算器","toolCode":"worth","icon":"./img/icons/worth.svg"},{"toolName":"死亡时间计算器","toolCode":"death-time","icon":"./img/icons/death-time.svg"},{"toolName":"幸运数字计算器","toolCode":"lucky-number","icon":"./img/icons/lucky-number.svg"},{"toolName":"星座幸运色","toolCode":"lucky-color","icon":"./img/icons/lucky-color.svg"},{"toolName":"哈希头像生成器","toolCode":"hash-avatar","icon":"./img/icons/hash-avatar.svg"}]}];
    var currentCatKey = "ent";
    const { createApp, ref, computed } = Vue;
    createApp({ setup() {
        const searchQuery = ref('');
        const currentCat = toolData.find(c => c.key === currentCatKey) || { toolList: [], children: [] };
        const isBrain = currentCatKey === 'brain';
        const filteredList = computed(() => {
            const list = currentCat.toolList || [];
            if (!searchQuery.value.trim()) return list;
            const q = searchQuery.value.trim().toLowerCase();
            return list.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q));
        });
        const filteredSubgroups = computed(() => {
            if (!isBrain) return [];
            const groups = currentCat.children || [];
            if (!searchQuery.value.trim()) return groups;
            const q = searchQuery.value.trim().toLowerCase();
            return groups.map(g => ({ ...g, toolList: g.toolList.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q)) })).filter(g => g.toolList.length > 0);
        });
        const filteredCount = computed(() => isBrain ? filteredSubgroups.value.reduce((acc, g) => acc + g.toolList.length, 0) : filteredList.value.length);
        return { searchQuery, filteredList, filteredSubgroups, filteredCount };
    }}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
