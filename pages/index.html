<script>
    /* ── 渲染工具分类（vanilla JS，遍历 toolData，支持 i18n 动态切换） ── */
    (function () {
        var container = document.getElementById('toolSections');
        if (!container || typeof toolData === 'undefined') return;

        function toolLink(t) {
            var icon = t.icon
                ? '<img class="tool-icon" src="' + t.icon + '" alt="" loading="lazy">'
                : '';
            var name = t.toolName;
            if (window.__i18n) {
                name = window.__i18n.getToolName(t.toolCode, name);
            }
            return '<a class="tool-chip" href="./' + t.toolCode + '">' + icon + '<span>' + name + '</span></a>';
        }

        function traffic(key) {
            return '<div class="flex gap-2 mb-5">'
                + '<div class="w-3 h-3 rounded-full bg-red-500 opacity-80"></div>'
                + '<div class="w-3 h-3 rounded-full bg-yellow-500 opacity-80"></div>'
                + '<div class="w-3 h-3 rounded-full bg-green-500 opacity-80"></div>'
                + '<span class="ml-3 text-xs text-slate-600 font-mono">~ ' + key + '</span>'
                + '</div>';
        }

        function renderToolSections() {
            var activeData = window.__i18n ? window.__i18n.translateToolData(toolData) : toolData;
            container.innerHTML = activeData.map(function (cat, i) {
                var inner = '';
                var catTitle = window.__i18n ? window.__i18n.getCategoryName(cat.key) : cat.desc;
                if (cat.children && cat.children.length) {
                    inner = cat.children.map(function (sub) {
                        var tools = (sub.toolList || []).map(toolLink).join('');
                        var subTitle = window.__i18n ? window.__i18n.getSubcategoryName(sub.key || sub.desc) : sub.desc;
                        return '<div class="tool-subgroup">'
                            + '<div class="tool-subtitle">' + subTitle + '</div>'
                            + '<div class="tool-grid">' + tools + '</div>'
                            + '</div>';
                    }).join('');
                } else {
                    var tools = (cat.toolList || []).map(toolLink).join('');
                    inner = '<div class="tool-grid">' + tools + '</div>';
                }
                return '<section id="' + cat.key + '" class="fade-in delay-' + Math.min(i + 1, 6) + '">'
                    + '<div class="sec-label font-kai mb-3">' + catTitle + '</div>'
                    + '<div class="terminal p-6 tool-terminal">' + traffic(cat.key) + inner + '</div>'
                    + '</section>';
            }).join('');
        }

        renderToolSections();
        window.addEventListener('langchange', renderToolSections);
    })();

    /* ── 本站元素：搜索跳转 ── */
    (function () {
        var input = document.getElementById('homeSearchInput');
        var btn = document.getElementById('homeSearchBtn');
        if (!input || !btn) return;
        var go = function () {
            var kw = (input.value || '').trim();
            if (!kw) { input.focus(); return; }
            location.href = './Search?keyword=' + encodeURIComponent(kw);
        };
        btn.addEventListener('click', go);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') go();
        });
    })();
</script>

</body>
</html>
