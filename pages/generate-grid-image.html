        .grid-studio .choose-file-cover:active { transform:scale(.995); }

        html.dark .grid-studio .setting { background:#090e1f; border-color:#1e293b; box-shadow:inset 0 1px 3px rgba(0,0,0,.35); }
        .grid-studio .setting-label { color:#64748b; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin:3px 0 0; }
        html.dark .grid-studio .setting-label { color:#94a3b8; }
        .grid-studio .crop--tool-list { display:flex; flex-wrap:wrap; gap:5px; margin:0; padding:8px; border-radius:10px; background:#eef2f7; }

        .grid-studio .crop--tool-list .item { min-width:38px; min-height:36px; width:auto; padding:5px 8px; display:inline-flex; justify-content:center; align-items:center; border:1px solid #cbd5e1; border-radius:7px; background:#fff; color:#334155; cursor:pointer; transition:all .15s ease; }
        html.dark .grid-studio .crop--tool-list .item { border-color:#334155; background:#162033; color:#e2e8f0; }
        .grid-studio .crop--tool-list .item:hover,.grid-studio .crop--tool-list .item.active { background:#0284c7; border-color:#0284c7; color:#fff; }
        html.dark .grid-studio .crop--tool-list .item:hover,html.dark .grid-studio .crop--tool-list .item.active { background:#0369a1; border-color:#38bdf8; color:#fff; }
        .grid-studio .crop--tool-list .item:active { transform:translateY(1px); }
        .grid-studio .crop-input { width:100%; margin:0; }
        .grid-studio .setting .el-button { min-height:40px; border-radius:9px; font-weight:700; }
        .grid-studio .setting .w100 { width:100%; }
        .grid-studio .studio-note { display:flex; gap:8px; align-items:center; margin:2px 0 4px; color:#64748b; font-size:12px; }
        html.dark .grid-studio .studio-note { color:#94a3b8; }
        .grid-studio .studio-status { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border-radius:999px; background:#dcfce7; color:#166534; font-size:12px; font-weight:700; }
        html.dark .grid-studio .studio-status { background:#123524; color:#86efac; }
        .grid-studio .divider { margin:24px 0 20px; border-color:#e2e8f0; }
        html.dark .grid-studio .divider { border-color:#1e293b; }
        .grid-studio .content { color:#334155; line-height:1.8; }
        html.dark .grid-studio .content { color:#cbd5e1; }
        .grid-studio .content h3 { color:#0f172a; font-size:18px; }
        html.dark .grid-studio .content h3 { color:#f8fafc; }
        .grid-studio .content img { max-width:100%; height:auto; border-radius:10px; border:1px solid #e2e8f0; }
        html.dark .grid-studio .content img { border-color:#334155; }

        @media (max-width:600px) { .grid-studio .file-box { height:330px; min-height:240px; } .grid-studio .setting { padding:10px; } .grid-studio .crop--tool-list .item { min-width:36px; } .grid-studio .tip { font-size:15px; } }

<body>
<div class="grid-bg"></div>
<header class="tool-topbar"><a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a><span class="tool-topbar-sep">/</span><span class="tool-topbar-title">生成宫格图像，分割图片</span><a href="./" class="tool-topbar-home">&#8592; 首页</a></header>
<main class="main-body tool-page-body" id="app">
    <div class="tool-body"><div class="card-model"><div class="card-body">
        <div class="tool-head"><h1 class="title">生成宫格图像，分割图片</h1></div>
        <div class="description">可以将任意一个图片切分为多个格子图像，格子行数和列数可以自定义。</div>
        <div class="grid-studio">
        <div class="tool-form" v-cloak>
            <div class="file">
                <input id="flFile" name="flFile" type="file" accept="image/*" style="display:none;" aria-label="选择图像" />
                <div v-if="!showImgGrid" class="file-box">
                    <div v-if="file==null" class="choose-file-cover" v-on:click="selectImg" role="button" tabindex="0" aria-label="拖放图片或单击选择图片">
                        <i class="my-icon my-icon-add-image" aria-hidden="true"></i><div class="tip">拖放图片到此处或单击选择</div><div class="drop-hint">支持 JPG、PNG、GIF 等常见格式</div>
                    </div><img v-else class="cropper-img" v-bind:src="file.sourceBlobUrl" alt="待裁剪的图片" />
                </div>
                <div v-show="showImgGrid" class="img-grid" :style="'width:'+(width+4*column)+'px;'" aria-label="生成的宫格图片"><img v-for="item in imgGridBase64Arr" :src="item" alt="宫格切片" :style="'width:'+(100/column)+'%;'" /></div>
            </div>
            <div class="setting">
                <template v-if="!showImgGrid">
                    <div class="studio-note"><span class="studio-status">● 编辑中</span><span>调整裁剪区域后生成</span></div>
                    <div><el-button type="primary" v-on:click="selectImg" class="w100"><i class="my-icon my-icon-add-image" aria-hidden="true"></i><span>选择图像</span></el-button></div>
                    <div><el-button type="primary" class="w100" v-on:click="createGridImg" :loading="creating">生成宫格图像</el-button></div>
                    <div class="setting-label">裁剪工具</div>
                    <div class="crop--tool-list">
                        <el-tooltip hide-after="0" content="移动" placement="top"><div class="item" v-on:click="cropperSetDragMode('move')" aria-label="移动"><i class="my-icon my-icon-move"></i></div></el-tooltip>
                        <el-tooltip hide-after="0" content="裁剪" placement="top"><div class="item" v-on:click="cropperSetDragMode('crop')" aria-label="裁剪"><i class="my-icon my-icon-crop"></i></div></el-tooltip>
                        <el-tooltip hide-after="0" content="放大" placement="top"><div class="item" v-on:click="cropperZoom(0.1)" aria-label="放大"><i class="my-icon my-icon-fangda"></i></div></el-tooltip>
                        <el-tooltip hide-after="0" content="缩小" placement="top"><div class="item" v-on:click="cropperZoom(-0.1)" aria-label="缩小"><i class="my-icon my-icon-suoxiao"></i></div></el-tooltip>
                        <div class="item" v-on:click="cropperMove(-10,0)" aria-label="向左移动"><i class="my-icon my-icon-arrow-right" style="transform:rotate(180deg)"></i></div><div class="item" v-on:click="cropperMove(10,0)" aria-label="向右移动"><i class="my-icon my-icon-arrow-right"></i></div><div class="item" v-on:click="cropperMove(0,-10)" aria-label="向上移动"><i class="my-icon my-icon-arrow-right" style="transform:rotate(270deg)"></i></div><div class="item" v-on:click="cropperMove(0,10)" aria-label="向下移动"><i class="my-icon my-icon-arrow-right" style="transform:rotate(90deg)"></i></div>
                        <div class="item" v-on:click="cropperRotate(-45)" aria-label="向左旋转"><i class="my-icon my-icon-left-rotate"></i></div><div class="item" v-on:click="cropperRotate(45)" aria-label="向右旋转"><i class="my-icon my-icon-right-rotate"></i></div><div class="item" v-on:click="cropperScale(scaleX==1?-1:1,scaleY)" aria-label="水平翻转"><i class="my-icon my-icon-flip-horizontal"></i></div><div class="item" v-on:click="cropperScale(scaleX,scaleY==1?-1:1)" aria-label="垂直翻转"><i class="my-icon my-icon-flip-vertical"></i></div><div class="item" v-on:click="cropperReset" aria-label="重置"><i class="my-icon my-icon-reset"></i></div>
                    </div>
                    <div class="setting-label">比例</div><div class="crop--tool-list"><div class="item" v-bind:class="{'active':aspectRatio=='NaN'}" v-on:click="cropperSetAspectRatio('NaN')">自由比例</div><div class="item" v-bind:class="{'active':aspectRatio==1.7777777777777777}" v-on:click="cropperSetAspectRatio(1.7777777777777777)">16:9</div><div class="item" v-bind:class="{'active':aspectRatio==1.3333333333333333}" v-on:click="cropperSetAspectRatio(1.3333333333333333)">4:3</div><div class="item" v-bind:class="{'active':aspectRatio==1}" v-on:click="cropperSetAspectRatio(1)">1:1</div><div class="item" v-bind:class="{'active':aspectRatio==0.6666666666666666}" v-on:click="cropperSetAspectRatio(0.6666666666666666)">2:3</div></div>
                    <div class="setting-label">画布与网格</div><el-input v-model="row" type="number" class="crop-input"><template #prepend>格子行</template></el-input><el-input v-model="column" type="number" class="crop-input"><template #prepend>格子列</template></el-input><el-input v-model="width" type="number" class="crop-input" v-on:input="widthInput"><template #prepend>宽度(px)</template></el-input><el-input v-model="height" type="number" class="crop-input" v-on:input="heightInput"><template #prepend>高度(px)</template></el-input><el-input v-model="x" type="number" class="crop-input" v-on:input="xInput"><template #prepend>X(px)</template></el-input><el-input v-model="y" type="number" class="crop-input" v-on:input="yInput"><template #prepend>Y(px)</template></el-input><el-input v-model="rotate" type="number" class="crop-input" v-on:input="rotateInput"><template #prepend>旋转(deg)</template></el-input>
                </template>
                <template v-else><div class="studio-note"><span class="studio-status">● 已完成</span><span>共 {{ imgGridBase64Arr.length }} 张切片</span></div><div><el-button type="primary" class="w100" v-on:click="downloadGridImg">下载宫格图片</el-button></div><div><el-button type="primary" class="w100" v-on:click="back">返回重设</el-button></div></template>
            </div>
        </div></div>
        <div class="divider"></div><div class="content"><h3>工具介绍</h3><p>可以将任意一个图片切分为多个格子图像，格子行数和列数可以自定义。例如把你拍摄的照片切成9个图像后发在网上，样式精美，适合各行各业的从业者。</p><p>1、可进行九宫格切图，四宫格切图，多格切图。</p><p>2、支持 JPG、PNG、GIF 等各种图像格式。</p><p style="text-align:center"><img src="./up/2024/0411/grid-img1.jpg" alt="宫格切图示例" /></p><p style="text-align:center"><img src="./up/2024/0411/grid-img2.jpg" alt="宫格切图结果示例" /></p></div>
    </div></div></div>
</main>

<script src="./lib/vue/vue.global.prod.js"></script><script src="./lib/element-plus/index.js"></script><script src="./lib/element-plus/locale/en.js"></script><script src="./lib/element-plus/locale/zh-tw.js"></script><script src="./js/components/SlideCaptcha.js?v=260728100716"></script><script src="./js/common.js?260728100716"></script><script src="./js/search.js?260728100716"></script><link href="./lib/cropper/cropper.min.css" rel="stylesheet" /><script src="./lib/cropper/cropper.min.js"></script><script src="./lib/jszip/jszip.min.js"></script><script src="./lib/jszip/filesaver.js"></script><script src="./js/components/Comment.js?260728100716"></script><script src="./js/tools/image/generate-grid-image.js?260728100716"></script>
</body></html>
