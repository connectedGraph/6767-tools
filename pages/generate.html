    <style>
        /* This page owns its component styles so it remains legible with either theme. */
        .generate-page { width:100%; max-width:1180px; margin:0 auto; padding:28px 18px 72px; box-sizing:border-box; }
        .generate-page, .generate-page * { box-sizing:border-box; }
        .generate-page .card-model { border-radius:14px; overflow:hidden; }
        html.dark .generate-page .card-model { background:#0b1120; border:1px solid #1e293b; box-shadow:0 20px 55px rgba(0,0,0,.22); }
        html:not(.dark) .generate-page .card-model { background:#ffffff; border:1px solid #e2e8f0; box-shadow:0 16px 40px rgba(15,23,42,.08); }
        .generate-page .card-body { padding:clamp(18px,3vw,32px); }
        .generate-page .tool-head { display:flex; align-items:center; gap:12px; margin:0; }
        .generate-page .title { margin:0; font-size:clamp(24px,3vw,34px); line-height:1.2; letter-spacing:-.035em; font-weight:800; }
        html.dark .generate-page .title { color:#f8fafc; }
        html:not(.dark) .generate-page .title { color:#0f172a; }
        .generate-page .title-mark { width:10px; height:34px; border-radius:6px; flex:none; background:linear-gradient(180deg,#38bdf8,#6366f1); }
        .generate-page .description { margin:10px 0 24px; line-height:1.7; font-size:14px; }
        html.dark .generate-page .description { color:#94a3b8; }
        html:not(.dark) .generate-page .description { color:#475569; }
        .generate-page .tool-dashboard { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 16px; margin-bottom:22px; border-radius:12px; transition:background .2s ease,border-color .2s ease; }
        html.dark .generate-page .tool-dashboard { background:#090e1f; border:1px solid #1e293b; box-shadow:inset 0 1px 3px rgba(0,0,0,.4); }
        html:not(.dark) .generate-page .tool-dashboard { background:#f8fafc; border:1px solid #e2e8f0; box-shadow:inset 0 1px 2px rgba(0,0,0,.03); }
        .generate-page .dashboard-copy { display:flex; align-items:center; gap:10px; min-width:0; }
        .generate-page .eyebrow { font:700 11px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; }
        html.dark .generate-page .eyebrow { color:#64748b; } html:not(.dark) .generate-page .eyebrow { color:#64748b; }
        .generate-page .count-badge { display:inline-flex; align-items:center; min-height:28px; padding:4px 10px; border-radius:999px; font:700 12px/1 Consolas,monospace; }
        html.dark .generate-page .count-badge { color:#bae6fd; background:rgba(14,116,144,.28); border:1px solid #0e7490; }
        html:not(.dark) .generate-page .count-badge { color:#075985; background:#e0f2fe; border:1px solid #7dd3fc; }
        .generate-page .search-wrap { position:relative; width:min(100%,350px); }
        .generate-page .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:16px; }
        html.dark .generate-page .search-icon { color:#7dd3fc; } html:not(.dark) .generate-page .search-icon { color:#0369a1; }
        .generate-page .cat-search-input { width:100%; min-height:40px; padding:8px 12px 8px 36px; border-radius:8px; outline:none; font:14px inherit; transition:border-color .18s,box-shadow .18s; }
        html.dark .generate-page .cat-search-input { color:#f8fafc; background:#0f172a; border:1px solid #334155; } html:not(.dark) .generate-page .cat-search-input { color:#0f172a; background:#fff; border:1px solid #cbd5e1; }
        .generate-page .cat-search-input::placeholder { color:#64748b; }
        .generate-page .cat-search-input:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.18); }
        .generate-page .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr)); gap:12px; }
        .generate-page .cat-tool-card { display:flex; align-items:center; gap:12px; min-height:66px; min-width:0; padding:12px 14px; border-radius:11px; text-decoration:none; transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease; }
        html.dark .generate-page .cat-tool-card { color:#cbd5e1; background:#0f172a; border:1px solid #1e293b; } html:not(.dark) .generate-page .cat-tool-card { color:#334155; background:#f8fafc; border:1px solid #e2e8f0; }
        .generate-page .cat-tool-card:hover { transform:translateY(-2px); }
        html.dark .generate-page .cat-tool-card:hover { color:#f8fafc; background:#10243b; border-color:#38bdf8; box-shadow:0 8px 24px rgba(2,132,199,.16); } html:not(.dark) .generate-page .cat-tool-card:hover { color:#0f172a; background:#f0f9ff; border-color:#38bdf8; box-shadow:0 8px 22px rgba(14,116,144,.12); }
        .generate-page .cat-tool-card:focus-visible { outline:3px solid rgba(56,189,248,.45); outline-offset:2px; }
        .generate-page .cat-tool-icon { width:32px; height:32px; flex:0 0 32px; object-fit:contain; border-radius:8px; }
        .generate-page .cat-tool-name { min-width:0; font-size:14px; line-height:1.45; font-weight:600; overflow-wrap:anywhere; }
        .generate-page .empty-hint { padding:48px 16px; text-align:center; font:14px Consolas,monospace; }
        html.dark .generate-page .empty-hint { color:#94a3b8; } html:not(.dark) .generate-page .empty-hint { color:#475569; }
        @media (max-width:600px) { .generate-page { padding:14px 10px 48px; } .generate-page .card-body { padding:18px 14px; } .generate-page .tool-dashboard { align-items:stretch; } .generate-page .dashboard-copy,.generate-page .search-wrap { width:100%; } .generate-page .search-wrap { max-width:none; } .generate-page .cat-grid { grid-template-columns:1fr; } }
        @media (prefers-reduced-motion:reduce) { .generate-page * { transition:none !important; } }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar">
  <a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a>
  <span class="tool-topbar-sep">/</span><span class="tool-topbar-title">生成</span>
  <a href="./" class="tool-topbar-home">&#8592; 首页</a>
</header>

<main class="main-body tool-page-body generate-page" id="app">
    <div class="tool-body">
        <div class="card-model">
            <div class="card-body">
                <div class="tool-head"><span class="title-mark" aria-hidden="true"></span><h1 class="title">生成工具集</h1></div>
                <div class="description">从二维码、条形码到 CSS 与随机数据，快速找到适合当前任务的生成器。</div>
                <section class="tool-dashboard" aria-label="工具筛选">
                    <div class="dashboard-copy"><span class="eyebrow">GENERATOR INDEX</span><span class="count-badge" aria-live="polite">{{ filteredCount }} 款工具</span></div>
                    <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><span class="sr-only">搜索生成工具</span><input type="search" v-model="searchQuery" placeholder="按名称或代码筛选..." class="cat-search-input" /></label>
                </section>
                <div v-if="filteredList.length" class="cat-grid">
                    <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="cat-tool-card" :title="t.toolName">
                        <img :src="t.icon || './img/icons/default.svg'" alt="" class="cat-tool-icon" /><span class="cat-tool-name">{{ t.toolName }}</span>
                    </a>
                </div>
                <div v-else class="empty-hint">// 未找到匹配的工具: "{{ searchQuery }}"</div>
            </div>
        </div>
    </div>
</main>

<script src="./lib/vue/vue.global.prod.js"></script>
<script src="./lib/element-plus/index.js"></script>
<script src="./lib/element-plus/locale/en.js"></script>
<script src="./lib/element-plus/locale/zh-tw.js"></script>
<script>
    var toolData = [{"key":"generate","desc":"生成","toolList":[{"toolName":"测试模拟数据 (Mock Data) 批量生成器","toolCode":"mock-data-generator","icon":"./img/icons/mock-data-generator.svg"},{"toolName":"WiFi 扫码直连二维码生成器","toolCode":"wifi-qrcode","icon":"./img/icons/wifi-qrcode.svg"},{"toolName":"无障碍色彩对比度检测器 (WCAG)","toolCode":"contrast-checker","icon":"./img/icons/contrast-checker.svg"},{"toolName":"CSS 玻璃拟态与毛玻璃生成器","toolCode":"css-glassmorphism","icon":"./img/icons/css-glassmorphism.svg"},{"toolName":"ASCII 艺术字与字符 Logo 生成器","toolCode":"ascii-art-generator","icon":"./img/icons/ascii-art-generator.svg"},{"toolName":"UUID / ULID / NanoID 批量生成器","toolCode":"uuid-generator","icon":"./img/icons/uuid-generator.svg"},{"toolName":"CSS 渐变色生成器","toolCode":"css-gradient-generator","icon":"./img/icons/css-gradient-generator.svg"},{"toolName":"CSS 盒子阴影生成器","toolCode":"css-shadow-generator","icon":"./img/icons/css-shadow-generator.svg"},{"toolName":"条形码生成器","toolCode":"bar-code","icon":"./img/icons/bar-code.svg"},{"toolName":"二维码生成器","toolCode":"qrcode","icon":"./img/icons/qrcode.svg"},{"toolName":"序列号生成器","toolCode":"serial-number","icon":"./img/icons/serial-number.svg"},{"toolName":"随机数生成器","toolCode":"random-number","icon":"./img/icons/random-number.svg"},{"toolName":"在线随机密码生成器","toolCode":"random-password","icon":"./img/icons/random-password.svg"}]}];
    var currentCatKey = "generate";
    const { createApp, ref, computed } = Vue;
    createApp({ setup() {
        const searchQuery = ref('');
        const currentCat = toolData.find(c => c.key === currentCatKey) || { toolList: [], children: [] };
        const isBrain = currentCatKey === 'brain';
        const filteredList = computed(() => { const list = currentCat.toolList || []; if (!searchQuery.value.trim()) return list; const q = searchQuery.value.trim().toLowerCase(); return list.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q)); });
        const filteredSubgroups = computed(() => { if (!isBrain) return []; const groups = currentCat.children || []; if (!searchQuery.value.trim()) return groups; const q = searchQuery.value.trim().toLowerCase(); return groups.map(g => ({ ...g, toolList: g.toolList.filter(t => t.toolName.toLowerCase().includes(q) || t.toolCode.toLowerCase().includes(q)) })).filter(g => g.toolList.length > 0); });
        const filteredCount = computed(() => isBrain ? filteredSubgroups.value.reduce((acc, g) => acc + g.toolList.length, 0) : filteredList.value.length);
        return { searchQuery, filteredList, filteredSubgroups, filteredCount };
    }}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
