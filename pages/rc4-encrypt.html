        html.dark .rc4-form .el-textarea__inner::placeholder, html.dark .rc4-form .el-input__inner::placeholder { color:#64748b; }
        html:not(.dark) .rc4-form .el-textarea__inner::placeholder, html:not(.dark) .rc4-form .el-input__inner::placeholder { color:#94a3b8; }
        .rc4-form .el-input__wrapper:hover, .rc4-form .el-textarea__inner:hover { border-color:#38bdf8; }

        .rc4-action-btn.el-button--primary { background:#0284c7; border-color:#0284c7; color:#fff; }
        .rc4-action-btn.el-button--primary:hover { background:#0369a1; border-color:#0369a1; }

<div class="grid-bg"></div>
<header class="tool-topbar">
  <a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a>

</header>
<main class="main-body tool-page-body" id="app">
  <div class="tool-body">
    <div class="card-model">
      <div class="card-body">
        <div class="tool-head"><h1 class="title">RC4加密/解密</h1></div>
        <div class="description">RC4加密解密工具，提供了以RC4算法为基础的加密和解密功能。在浏览器本地完成处理，内容不会上传。</div>
        <div class="rc4-workspace">
          <div class="rc4-dashboard" role="status"><div class="rc4-kicker"><span class="rc4-kicker-mark">RC4</span><div><strong>流加密工作台</strong><small>输入内容与密钥，选择操作</small></div></div><span class="rc4-status">本地处理</span></div>
          <section class="rc4-panel" aria-label="RC4加密解密表单">
            <el-form :model="formData" ref="computeForm" label-position="top" class="tool-form rc4-form" v-on:submit.native.prevent>
              <el-form-item label="加/解密内容" prop="text" :rules="{required: true, message: `请输入`, trigger: 'blur'}"><el-input v-model="formData.text" :rows="4" type="textarea" class="w100" placeholder="输入要处理的文本"></el-input></el-form-item>
              <el-form-item label="密钥（选填）"><el-input v-model="formData.key" class="w100" placeholder="输入密钥"></el-input></el-form-item>
              <div class="rc4-actions"><el-button class="rc4-action-btn" type="primary" v-on:click="encrypt">加密</el-button><el-button class="rc4-action-btn" type="primary" v-on:click="decrypt">解密</el-button></div>
            </el-form>
            <div class="compute-result rc4-result" v-if="computeResult!=null" role="region" aria-live="polite"><div class="passworld rc4-result-value" v-html="computeResultHtml"></div><a class="rc4-copy" href="javascript:;" v-on:click="copy">复制</a></div>
            <div v-cloak class="compute-result error rc4-error" v-if="errorMsg!=null" role="alert">{{errorMsg}}</div>
            <div class="content rc4-notes"><h3>说明</h3><p>RC4（Rivest Cipher 4）是一种密钥长度可变的流加密算法，加密和解密使用相同的密钥。</p><p>算法通过密钥生成伪随机密钥流，再将密钥流与原始数据进行异或运算。它曾因简单高效而广泛使用，但已发现偏差攻击、密钥重用等安全问题。</p><p>RC4 已不再推荐用于现代安全应用。涉及敏感数据时，请优先选择 AES 等更现代的加密算法。</p></div>
          </section>
        </div>
        <comment :relate-id="76" :comment-class="2"></comment>
      </div>
    </div>
