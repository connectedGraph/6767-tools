<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历生成器 - 在线工具</title>
    <meta name="description" content="在线简历生成器：所见即所得 A4 简历编辑器，四套精英风主题，JSON 数据驱动，支持导出 HTML/PNG/PDF，全部本地运行零上传。" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/resume-maker" />
    <link rel="canonical" href="https://tool.6767.chat/resume-maker" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link href="./lib/element-plus/index.css" rel="stylesheet" />
    <link href="./css/6767-tailwind.css?v=20260905" rel="stylesheet" />
    <link href="./css/6767-site.css?v=20260905" rel="stylesheet" />
    <link href="./css/tool-dark.css?v=20260905" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 100%; max-width: 100%; min-width: 0; overflow-x: hidden; }
      body { margin: 0; }
      .tool-topbar { width: 100%; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
      .tool-topbar-logo, .tool-topbar-title, .tool-topbar-home, .tool-topbar-sep { min-width: 0; }
      .tool-topbar-title { overflow-wrap: anywhere; }
      .tool-topbar-home { margin-left: auto; }
      .tool-page-body { width: 100%; min-width: 0; padding: clamp(24px, 5vw, 64px) clamp(14px, 4vw, 32px); }
      .tool-body { width: 100%; min-width: 0; }
      .card-model { width: min(100%, 920px); margin-inline: auto; }
      .card-body { min-width: 0; overflow: hidden; }
      .tool-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
      .resume-kicker { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
      .resume-kicker::before { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 0 5px rgba(34,211,238,.13); }
      .resume-title { margin: 0; max-width: 720px; font-size: clamp(1.75rem, 4vw, 3rem); line-height: 1.1; letter-spacing: -.035em; }
      .resume-description { max-width: 680px; margin: 0 0 26px; font-size: clamp(.98rem, 2vw, 1.1rem); line-height: 1.75; }
      .resume-launch-panel { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding: 18px; border-radius: 12px; }
      .resume-status { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .resume-status-mark { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px; font-size: 19px; }
      .resume-status-copy { min-width: 0; }
      .resume-status-copy strong, .resume-status-copy span { display: block; overflow-wrap: anywhere; }
      .resume-status-copy strong { font-size: 14px; margin-bottom: 3px; }
      .resume-status-copy span { font-size: 13px; line-height: 1.45; }
      .resume-action { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 9px 17px; border-radius: 9px; font-size: 14px; font-weight: 700; text-decoration: none; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
      .resume-action:hover { transform: translateY(-1px); }
      .resume-action:active { transform: translateY(0); }
      .resume-action:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
      .resume-features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
      .resume-feature { padding: 16px; border-radius: 11px; min-width: 0; }
      .resume-feature-icon { display: block; margin-bottom: 12px; font-size: 18px; }
      .resume-feature strong { display: block; margin-bottom: 5px; font-size: 14px; }
      .resume-feature span { display: block; font-size: 13px; line-height: 1.55; }
      html.dark .card-model { background: #0f172a; border: 1px solid #1e293b; box-shadow: 0 22px 60px rgba(0,0,0,.28); }
      html:not(.dark) .card-model { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 18px 50px rgba(15,23,42,.09); }
      html.dark .card-body { color: #f8fafc; }
      html:not(.dark) .card-body { color: #0f172a; }
      html.dark .resume-kicker { color: #67e8f9; }
      html:not(.dark) .resume-kicker { color: #0369a1; }
      html.dark .resume-description { color: #94a3b8; }
      html:not(.dark) .resume-description { color: #475569; }
      html.dark .resume-launch-panel { background: #090e1f; border: 1px solid #1e293b; }
      html:not(.dark) .resume-launch-panel { background: #f8fafc; border: 1px solid #e2e8f0; }
      html.dark .resume-status-mark { color: #67e8f9; background: rgba(14,116,144,.28); }
      html:not(.dark) .resume-status-mark { color: #0369a1; background: #e0f2fe; }
      html.dark .resume-status-copy span { color: #94a3b8; }
      html:not(.dark) .resume-status-copy span { color: #475569; }
      html.dark .resume-action { color: #ecfeff; background: #0284c7; border: 1px solid #38bdf8; }
      html.dark .resume-action:hover { background: #0369a1; }
      html:not(.dark) .resume-action { color: #ffffff; background: #0369a1; border: 1px solid #0369a1; }
      html:not(.dark) .resume-action:hover { background: #075985; }
      html.dark .resume-feature { background: #111c31; border: 1px solid #1e293b; }
      html:not(.dark) .resume-feature { background: #f8fafc; border: 1px solid #e2e8f0; }
      html.dark .resume-feature-icon { color: #67e8f9; }
      html:not(.dark) .resume-feature-icon { color: #0369a1; }
      html.dark .resume-feature span { color: #94a3b8; }
      html:not(.dark) .resume-feature span { color: #475569; }
      @media (max-width: 620px) {
        .tool-topbar-home { width: 100%; margin-left: 0; }
        .tool-head { display: block; }
        .resume-features { grid-template-columns: 1fr; }
        .resume-launch-panel { align-items: stretch; }
        .resume-action { width: 100%; }
      }
      @media (max-width: 380px) {
        .tool-page-body { padding-inline: 10px; }
        .card-body { padding: 22px 14px !important; }
      }
    </style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<header class="tool-topbar">
  <a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a>
  <span class="tool-topbar-sep" aria-hidden="true">/</span>
  <span class="tool-topbar-title">简历模板</span>
  <a href="./" class="tool-topbar-home">&#8592; 首页</a>
</header>
<main class="main-body tool-page-body" id="app">
  <div class="tool-body">
    <div class="card-model">
      <div class="card-body" style="padding: clamp(26px, 5vw, 54px);">
        <div class="tool-head">
          <div>
            <p class="resume-kicker">Resume studio / 02</p>
            <h1 class="title resume-title">简历模板已升级为现代简历制作与排版器</h1>
          </div>
        </div>
        <div class="description resume-description">用更清晰的结构呈现你的专业价值。新版支持所见即所得编辑、主题排版与多格式导出，所有内容均在本地处理。</div>
        <section class="resume-launch-panel" aria-label="页面状态">
          <div class="resume-status">
            <span class="resume-status-mark" aria-hidden="true">✦</span>
            <div class="resume-status-copy">
              <strong>正在打开新版编辑器</strong>
              <span>如果页面没有自动跳转，请使用右侧按钮继续。</span>
            </div>
          </div>
          <a class="resume-action" href="/resume-maker">立即打开编辑器 <span aria-hidden="true">&nbsp;→</span></a>
        </section>
        <div class="resume-features" aria-label="编辑器功能">
          <div class="resume-feature"><span class="resume-feature-icon" aria-hidden="true">▣</span><strong>所见即所得</strong><span>实时预览 A4 页面，编辑与排版同步完成。</span></div>
          <div class="resume-feature"><span class="resume-feature-icon" aria-hidden="true">◈</span><strong>精英风主题</strong><span>多套克制、专业的视觉风格，一键切换。</span></div>
          <div class="resume-feature"><span class="resume-feature-icon" aria-hidden="true">↗</span><strong>灵活导出</strong><span>支持 HTML、PNG 与 PDF，方便投递与分享。</span></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>location.replace('/resume-maker');</script>
</body>
</html>
