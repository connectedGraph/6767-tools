        :root { color-scheme: dark; }

        .format-actions .el-button { margin: 0; min-height: 38px; border-radius: 8px; font-weight: 600; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
        .format-actions .el-button:hover { transform: translateY(-1px); }
        .format-actions .el-button:active { transform: translateY(0); }
        .format-mode { display: inline-flex; align-items: center; gap: 9px; min-height: 38px; padding: 0 4px; font-size: 13px; font-weight: 600; }

        .format-label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
        html.dark .format-label { color: #7dd3fc; background: rgba(14,116,144,.16); border: 1px solid #164e63; }
        html:not(.dark) .format-label { color: #0369a1; background: #e0f2fe; border: 1px solid #bae6fd; }

        html.dark #editor-container { border-color: #1e293b; background: #0b1120; box-shadow: 0 12px 28px rgba(2,6,23,.22); }

        .format-help { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 4px; }

        html.dark .format-help-item { background: #0f172a; border: 1px solid #1e293b; color: #cbd5e1; }

        html.dark .format-help-item strong { color: #f8fafc; }
        html:not(.dark) .format-help-item strong { color: #0f172a; }
        .format-help-item p { margin: 0; font-size: 13px; line-height: 1.65; }
        @media (max-width: 768px) {
