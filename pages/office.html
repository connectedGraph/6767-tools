<!-- Category Page: 办公助手 | Accessible responsive tool directory -->
<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script>try{Object.defineProperty(Document.prototype,"domain",{get:function(){return location.hostname},configurable:true});}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>办公助手 - 在线工具集</title>
    <meta name="description" content="文本处理与文档工具：排版美化、去重统计、表格转换、简历模板" />
    <meta name="keywords" content="办公助手,在线工具,在线工具集,6767工具" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link href="./lib/element-plus/index.css" rel="stylesheet" />
    <link href="./css/6767-tailwind.css?v=20260905" rel="stylesheet" />
    <link href="./css/6767-site.css?v=20260905" rel="stylesheet" />
    <link href="./css/tool-dark.css?v=20260905" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        .office-shell { width:100%; max-width:1180px; margin:0 auto; padding:22px 16px 64px; }
        .office-card { overflow:hidden; }
        .office-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px; }
        .office-kicker { display:flex; align-items:center; gap:10px; margin:0 0 7px; color:#38bdf8; font:700 11px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; }
        .office-kicker::before { content:''; width:24px; height:2px; border-radius:2px; background:#38bdf8; }
        .office-title { margin:0; font-size:clamp(26px,4vw,38px); line-height:1.15; letter-spacing:-.03em; }
        .office-count { display:inline-flex; align-items:center; min-height:28px; padding:4px 10px; border-radius:999px; font:600 12px/1.2 Consolas,monospace; white-space:nowrap; }
        .office-search { width:100%; max-width:330px; min-height:42px; padding:0 14px; border-radius:10px; outline:0; font-size:14px; transition:.2s ease; }
        .office-search:focus { box-shadow:0 0 0 3px rgba(56,189,248,.2); }
        .office-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 14px; margin-bottom:18px; border-radius:12px; }
        .office-toolbar-label { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
        .office-live { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.14); }
        .office-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr)); gap:12px; }
        .office-tool { display:flex; align-items:center; gap:13px; min-height:68px; min-width:0; padding:13px 14px; border-radius:12px; text-decoration:none; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease; }
        .office-tool:hover { transform:translateY(-2px); }
        .office-tool:focus-visible, .office-search:focus-visible { outline:3px solid rgba(56,189,248,.45); outline-offset:2px; }
        .office-icon { width:34px; height:34px; flex:0 0 34px; object-fit:contain; border-radius:9px; }
        .office-tool-copy { min-width:0; }
        .office-tool-name { display:block; overflow:hidden; font-size:14px; font-weight:650; line-height:1.4; text-overflow:ellipsis; white-space:nowrap; }
        .office-tool-code { display:block; overflow:hidden; margin-top:3px; font:11px/1.2 Consolas,monospace; text-overflow:ellipsis; white-space:nowrap; }
        .office-empty { padding:58px 16px; text-align:center; border-radius:12px; font:13px/1.6 Consolas,monospace; }
        html.dark .office-card { background:#0f172a; border:1px solid #1e293b; box-shadow:0 18px 50px rgba(0,0,0,.2); }
        html:not(.dark) .office-card { background:#fff; border:1px solid #e2e8f0; box-shadow:0 14px 36px rgba(15,23,42,.08); }
        html.dark .office-title { color:#f8fafc; }
        html:not(.dark) .office-title { color:#0f172a; }
        html.dark .office-count { color:#bae6fd; background:rgba(14,116,144,.25); border:1px solid #0e7490; }
        html:not(.dark) .office-count { color:#075985; background:#e0f2fe; border:1px solid #bae6fd; }
        html.dark .office-search { color:#f8fafc; background:#090e1f; border:1px solid #334155; }
        html:not(.dark) .office-search { color:#0f172a; background:#f8fafc; border:1px solid #cbd5e1; }
        html.dark .office-search::placeholder { color:#94a3b8; }
        html:not(.dark) .office-search::placeholder { color:#64748b; }
        html.dark .office-toolbar { color:#cbd5e1; background:#090e1f; border:1px solid #1e293b; }
        html:not(.dark) .office-toolbar { color:#334155; background:#f8fafc; border:1px solid #e2e8f0; }
        html.dark .office-tool { color:#cbd5e1; background:#111c31; border:1px solid #26364d; }
        html:not(.dark) .office-tool { color:#334155; background:#fff; border:1px solid #e2e8f0; }
        html.dark .office-tool:hover { color:#f8fafc; background:#102a43; border-color:#38bdf8; box-shadow:0 8px 22px rgba(0,0,0,.25); }
        html:not(.dark) .office-tool:hover { color:#0f172a; background:#f0f9ff; border-color:#0284c7; box-shadow:0 8px 22px rgba(15,23,42,.1); }
        html.dark .office-tool-code { color:#64748b; }
        html:not(.dark) .office-tool-code { color:#64748b; }
        html.dark .office-empty { color:#94a3b8; background:#090e1f; border:1px dashed #334155; }
        html:not(.dark) .office-empty { color:#64748b; background:#f8fafc; border:1px dashed #cbd5e1; }
        @media (max-width:768px) { .office-shell{padding:14px 12px 44px}.office-hero{align-items:stretch; gap:14px}.office-search{max-width:none}.office-tool{min-height:62px}.office-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.office-tool{padding:11px 10px;gap:9px}.office-icon{width:30px;height:30px;flex-basis:30px}.office-tool-name{font-size:13px} }
        @media (max-width:430px) { .office-grid{grid-template-columns:1fr}.office-toolbar{align-items:flex-start} }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar"><a href="./" class="tool-topbar-logo" aria-label="首页"><span>在线工具集</span></a><span class="tool-topbar-sep">/</span><span class="tool-topbar-title">办公助手</span><a href="./" class="tool-topbar-home">&#8592; 首页</a></header>
<main class="main-body tool-page-body" id="app">
    <div class="tool-body office-shell">
        <div class="card-model office-card">
            <div class="card-body">
                <div class="tool-head office-hero">
                    <div><div class="office-kicker">WORKSPACE / TOOLS</div><h1 class="title office-title">办公助手</h1></div>
                    <span class="office-count" aria-live="polite">{{ filteredCount }} 款工具</span>
                </div>
                <div class="description">日常办公所需的文本、文档与效率工具，轻量、快速、无需安装。</div>
                <div class="office-toolbar">
                    <div class="office-toolbar-label"><span class="office-live" aria-hidden="true"></span><span>在线工具目录</span></div>
                    <label><span class="sr-only">筛选办公工具</span><input v-model="searchQuery" type="search" class="office-search" placeholder="搜索工具名称或代码…" autocomplete="off" /></label>
                </div>
                <div v-if="filteredList.length" class="office-grid" aria-label="办公工具列表">
                    <a v-for="t in filteredList" :key="t.toolCode" :href="'/' + t.toolCode" class="office-tool" :title="t.toolName">
                        <img :src="t.icon || './img/icons/default.svg'" alt="" class="office-icon" loading="lazy" />
                        <span class="office-tool-copy"><span class="office-tool-name">{{ t.toolName }}</span><span class="office-tool-code">/{{ t.toolCode }}</span></span>
                    </a>
                </div>
                <div v-else class="office-empty">// 未找到匹配的工具: “{{ searchQuery }}”</div>
            </div>
        </div>
    </div>
</main>
<script src="./lib/vue/vue.global.prod.js"></script><script src="./lib/element-plus/index.js"></script><script src="./lib/element-plus/locale/en.js"></script><script src="./lib/element-plus/locale/zh-tw.js"></script>
<script>
var toolData=[{key:'office',desc:'办公助手',toolList:[
['文本去重与多维排序器','text-dedup-sort','text-dedup-sort.svg'],['中英文排版规范美化器','text-autospace','text-autospace.svg'],['在线表格转换器','table-converter','table-converter.svg'],['人民币大写金额转换器','rmb-capital-converter','rmb-capital-converter.svg'],['综合字数与阅读时长统计','word-counter','word-counter.svg'],['现代简历制作与排版器','resume-maker','resume-maker.svg'],['简历模板中心','resume-template','resume-template.svg'],['A4纸张尺寸，各种纸张尺寸查询','paper-size','paper-size.svg'],['转换大小写','convert-case','convert-case.svg'],['标题大小写转换器','title-case-converter','title-case-converter.svg'],['句子大小写转换器','sentence-case-converter','sentence-case-converter.svg'],['粗体文本生成器','bold-text-generator','bold-text-generator.svg'],['斜体文本生成器','italic-text-generator','italic-text-generator.svg'],['删除线文本生成器','strikethrough-text-generator','strikethrough-text-generator.svg'],['下划线文本生成器','underline-text','underline-text.svg'],['颠倒文本生成器','upside-down-text-generator','upside-down-text-generator.svg'],['镜像文本生成器','mirror-text-generator','mirror-text-generator.svg'],['反向文本生成器','reverse-text-generator','reverse-text-generator.svg'],['文本替换工具','replace-text','replace-text.svg'],['符号大全','symbols','symbols.svg'],['emoji表情大全','emoji','emoji.svg'],['颜文字表情大全','emoticon','emoticon.svg']].map(x=>({toolName:x[0],toolCode:x[1],icon:'./img/icons/'+x[2]}))}];
var currentCatKey='office';
const {createApp,ref,computed}=Vue;
createApp({setup(){const searchQuery=ref('');const currentCat=toolData.find(c=>c.key===currentCatKey)||{toolList:[],children:[]};const isBrain=currentCatKey==='brain';const filteredList=computed(()=>{const list=currentCat.toolList||[];if(!searchQuery.value.trim())return list;const q=searchQuery.value.trim().toLowerCase();return list.filter(t=>t.toolName.toLowerCase().includes(q)||t.toolCode.toLowerCase().includes(q));});const filteredSubgroups=computed(()=>{if(!isBrain)return[];const groups=currentCat.children||[];if(!searchQuery.value.trim())return groups;const q=searchQuery.value.trim().toLowerCase();return groups.map(g=>({...g,toolList:g.toolList.filter(t=>t.toolName.toLowerCase().includes(q)||t.toolCode.toLowerCase().includes(q))})).filter(g=>g.toolList.length>0);});const filteredCount=computed(()=>isBrain?filteredSubgroups.value.reduce((acc,g)=>acc+g.toolList.length,0):filteredList.value.length);return{searchQuery,filteredList,filteredSubgroups,filteredCount};}}).use(ElementPlus).mount('#app');
</script>
</body></html>
