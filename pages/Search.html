<html lang="zh" class="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,minimum-scale=1.0, user-scalable=no" />
    <title>搜索 - 在线工具</title>

    <style>
        .search-page-container {
            width: 100%;
            margin-top: 10px;
        }

        .search-header-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
        }

        .search-large-input-wrapper {
            max-width: 640px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            background: var(--bg-color-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 4px 6px 4px 20px;
            transition: all var(--transition-speed);
        }

        .search-large-input-wrapper.active {
            border-color: var(--el-color-primary);
            background: var(--bg-color);
            box-shadow: var(--shadow-glow);
        }

        .search-large-input-wrapper input {
            flex: 1;
            border: 0;
            outline: none;
            background: none;
            color: var(--text-color);
            font-size: 16px;
            height: 40px;
        }

        .search-large-input-wrapper .search-btn {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-pill);
            padding: 0 24px;
            height: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed);
        }

        .search-large-input-wrapper .search-btn:hover {
            box-shadow: 0 4px 12px rgba(42, 173, 103, 0.2);
            opacity: 0.95;
        }

        .search-large-input-wrapper .search-btn i {
            margin-right: 6px;
            font-size: 16px;
        }

        /* 分类筛选 Tags */
        .category-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 16px;
        }

        .category-filter-tag {
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            background: var(--bg-color-dark);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-speed);
            user-select: none;
            font-weight: 500;
        }

        .category-filter-tag:hover {
            border-color: var(--el-color-primary);
            color: var(--el-color-primary);
            background: rgba(var(--el-color-primary-rgb), 0.05);
        }

        .category-filter-tag.active {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(42, 173, 103, 0.2);
        }

        .search-stats {
            font-size: 14px;
            color: var(--text-gray-color);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .search-stats span strong {
            color: var(--el-color-primary);
            font-weight: 600;
        }

        /* 结果网格 (Result Grid) */
        .search-result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .search-tool-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            transition: all var(--transition-speed);
            text-decoration: none;
            color: inherit;
        }

        .search-tool-card:hover {
            border-color: var(--el-color-primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md), var(--shadow-glow);
        }

        .search-tool-card .card-top {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .search-tool-card .tool-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: var(--bg-color-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .search-tool-card .tool-icon-wrapper img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .search-tool-card .tool-icon-wrapper i {
            font-size: 20px;
            color: var(--el-color-primary);
        }

        .search-tool-card .tool-info {
            flex: 1;
            min-width: 0;
        }

        .search-tool-card .tool-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            margin: 0 0 4px 0;
            line-height: 1.3;
            word-break: break-all;
        }

        .search-tool-card .tool-code {
            font-size: 11px;
            color: var(--text-gray-color);
            font-family: monospace;
            word-break: break-all;
        }

        .search-tool-card .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: auto;
        }

        .search-tool-card .tool-category-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            background: rgba(var(--el-color-primary-rgb), 0.08);
            color: var(--el-color-primary);
            font-weight: 500;
        }

        .search-tool-card .tool-action-btn {
            font-size: 12px;
            color: var(--el-color-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .search-tool-card:hover .tool-action-btn {
            text-decoration: underline;
        }

        /* 高亮文字 */
        mark.matched-text {
            background-color: rgba(42, 173, 103, 0.15);
            color: var(--el-color-primary);
            font-weight: 600;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* 空状态 (Empty State) */
        .search-empty-state {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 48px 24px;
            text-align: center;
            margin-top: 20px;
        }

        .search-empty-state i.empty-icon {
            font-size: 64px;
            color: var(--text-gray-color);
            opacity: 0.6;
            margin-bottom: 16px;
            display: inline-block;
        }

        .search-empty-state h3 {
            font-size: 18px;
            color: var(--text-color);
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .search-empty-state p {
            color: var(--text-gray-color);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .search-empty-state .popular-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-empty-state .popular-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 480px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .search-header-box {
                padding: 16px;
                margin-bottom: 16px;
            }
            .search-large-input-wrapper {
                padding: 2px 4px 2px 14px;
            }
            .search-large-input-wrapper input {
                font-size: 14px;
                height: 36px;
            }
            .search-large-input-wrapper .search-btn {
                padding: 0 16px;
                height: 36px;
                font-size: 13px;
            }
            .category-filter-row {
                gap: 6px;
                padding-top: 12px;
            }
            .category-filter-tag {
                padding: 4px 12px;
                font-size: 12px;
            }
            .search-result-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>

</head>
<body>
<div class="grid-bg"></div>
<header class="tool-topbar">
  <a href="./" class="tool-topbar-logo" aria-label="首页">
    <span>在线工具集</span>
  </a>
  <span class="tool-topbar-sep">/</span>
  <span class="tool-topbar-title">搜索</span>
  <a href="./" class="tool-topbar-home">&#8592; 首页</a>
</header>

    <main class="main-body tool-page-body">
        

<ul class="my-breadcrumb">
    <li><a href="/"><i class="my-icon my-icon-home"></i></a></li>
    <li>搜索</li>
</ul>

<div class="small-screen-search">
    <div class='search-input-box' v-bind:class="{'active':searchInputFocus}">
        <input type="text" class='search-input' placeholder="搜索工具" ref="smallSearchInput" v-model="keyword" v-on:keyup.enter="goSearch" v-on:focus="searchInputFocus=true" v-on:blur="searchInputFocus=false" />
        <div class="my-icon my-icon-search" v-on:click="goSearch"></div>
    </div>
</div>


    </main>
</div>

    <script>
        var languageCode = 'zh';
        var websiteRoot = "";
        var mainWebSiteHost = "";
        var webApiSiteHost = "/api";
        var staticSiteHost = "";
        var staticFileVersion="260728100716";
        var toolData = [];
        var phoneSmsEnable = 0;
        var wp='zp';
        var ap='qx';
    </script>
        <script src="./lib/vue/vue.global.prod.js"></script>
        <script src="./lib/element-plus/index.js"></script>
    <script src="./lib/element-plus/locale/en.js"></script>
    <script src="./lib/element-plus/locale/zh-tw.js"></script>
    <script src="./js/components/SlideCaptcha.js?v=260728100716"></script>
    <script src="./js/common.js?260728100716"></script>
    <script src="./js/search.js?260728100716"></script>
    
    <script>
        Vue.createApp({
            data() {
                return {
                    keyword: c.urlParam("keyword") || "",
                    searchInputFocus: false,
                    activeCategory: "",
                    allTools: [],
                    categories: [],
                    currentLang: window.__i18n ? window.__i18n.getLang() : 'zh'
                }
            },
            created() {
                this.loadToolsData();
                window.addEventListener('langchange', (e) => {
                    this.currentLang = e.detail.lang;
                    this.loadToolsData();
                });
            },
            mounted() {
                setTimeout(() => {
                    if (this.$refs.searchPageInput) {
                        this.$refs.searchPageInput.focus();
                    }
                }, 300);
            },
            computed: {
                filteredTools() {
                    const kw = (this.keyword || '').trim().toLowerCase();
                    return this.allTools.filter(tool => {
                        // 分类过滤
                        if (this.activeCategory && tool.parentCode !== this.activeCategory) {
                            return false;
                        }
                        // 关键字过滤
                        if (!kw) return true;

                        return tool.toolName.toLowerCase().includes(kw) ||
                               tool.toolCode.toLowerCase().includes(kw) ||
                               (tool.parentCategory && tool.parentCategory.toLowerCase().includes(kw)) ||
                               (tool.subCategory && tool.subCategory.toLowerCase().includes(kw));
                    });
                },
                activeCategoryName() {
                    const cat = this.categories.find(c => c.key === this.activeCategory);
                    return cat ? cat.desc : '';
                },
                searchPlaceholderText() {
                    return this.t('searchPlaceholder', '输入关键字搜索工具、测试量表...');
                },
                searchBtnText() {
                    return this.t('searchBtn', '搜索');
                },
                allCategoryText() {
                    return this.t('allCategoryTag', '全部');
                },
                useToolText() {
                    return this.t('useToolNow', '立即使用');
                }
            },
            methods: {
                t(key, fallback) {
                    return window.__i18n ? window.__i18n.t(key, fallback, this.currentLang) : fallback;
                },
                async loadToolsData() {
                    try {
                        var catalog = await window.ToolsApi.loadCatalog();
                        var rawData = catalog.categories || [];
                        var activeData = window.__i18n ? window.__i18n.translateToolData(rawData, this.currentLang) : rawData;

                    // 初始化分类
                    this.categories = activeData.map(c => ({
                        key: c.key,
                        desc: window.__i18n ? window.__i18n.getCategoryName(c.key, this.currentLang) : c.desc
                    }));

                    // 扁平化所有工具
                    const list = [];
                    activeData.forEach(cat => {
                        const parentCategory = window.__i18n ? window.__i18n.getCategoryName(cat.key, this.currentLang) : cat.desc;
                        const parentCode = cat.key;
                        if (cat.toolList) {
                            cat.toolList.forEach(tool => {
                                list.push({
                                    toolName: tool.toolName,
                                    toolCode: tool.toolCode,
                                    icon: tool.icon || '',
                                    parentCategory,
                                    parentCode,
                                    subCategory: tool.subCategory
                                        ? (window.__i18n ? window.__i18n.getSubcategoryName(tool.subCategory, this.currentLang) : tool.subCategory)
                                        : null
                                });
                            });
                        }
                        if (cat.children) {
                            cat.children.forEach(sub => {
                                const subCategory = window.__i18n ? window.__i18n.getSubcategoryName(sub.key || sub.desc, this.currentLang) : sub.desc;
                                if (sub.toolList) {
                                    sub.toolList.forEach(tool => {
                                        list.push({
                                            toolName: tool.toolName,
                                            toolCode: tool.toolCode,
                                            icon: tool.icon || '',
                                            parentCategory,
                                            parentCode,
                                            subCategory
                                        });
                                    });
                                }
                            });
                        }
                    });
                        this.allTools = list;
                    } catch (error) {
                        console.error('[tools] catalog load failed', error);
                        this.categories = [];
                        this.allTools = [];
                    }
                },
                getHighlightedName(name) {
                    const kw = (this.keyword || '').trim();
                    if (!kw) return name;
                    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`(${escaped})`, 'gi');
                    return name.replace(regex, '<mark class="matched-text">$1</mark>');
                },
                handleSearch() {
                    const url = new URL(window.location);
                    if (this.keyword) {
                        url.searchParams.set('keyword', this.keyword);
                    } else {
                        url.searchParams.delete('keyword');
                    }
                    window.history.replaceState(null, '', url);
                }
            },
            template: `
                <div class="search-page-container">
                    <!-- 搜索栏 -->
                    <div class="search-header-box">
                        <div class="search-large-input-wrapper" :class="{'active': searchInputFocus}">
                            <input type="text" :placeholder="searchPlaceholderText"
                                   v-model="keyword"
                                   @focus="searchInputFocus = true"
                                   @blur="searchInputFocus = false"
                                   @keyup.enter="handleSearch"
                                   ref="searchPageInput" />
                            <button class="search-btn" @click="handleSearch">
                                <i class="my-icon my-icon-search"></i>{{ searchBtnText }}
                            </button>
                        </div>

                        <!-- 分类过滤 Tag -->
                        <div class="category-filter-row">
                            <div class="category-filter-tag"
                                  :class="{'active': activeCategory === ''}"
                                  @click="activeCategory = ''">
                                {{ allCategoryText }}
                            </div>
                            <div class="category-filter-tag"
                                  v-for="cat in categories"
                                  :key="cat.key"
                                  :class="{'active': activeCategory === cat.key}"
                                  @click="activeCategory = cat.key">
                                {{ cat.desc }}
                            </div>
                        </div>
                    </div>

                    <!-- 搜索统计 -->
                    <div class="search-stats" v-if="filteredTools.length > 0">
                        <span>找到与 <strong>"{{ keyword || activeCategoryName || allCategoryText }}"</strong> 相关的工具 <strong>{{ filteredTools.length }}</strong> 个</span>
                    </div>

                    <!-- 工具网格 -->
                    <div class="search-result-grid" v-if="filteredTools.length > 0">
                        <a :href="'/' + tool.toolCode"
                           class="search-tool-card"
                           v-for="tool in filteredTools"
                           :key="tool.toolCode">
                            <div class="card-top">
                                <div class="tool-icon-wrapper">
                                    <img v-if="tool.icon" :src="tool.icon" :alt="tool.toolName" />
                                    <i v-else class="my-icon my-icon-brain"></i>
                                </div>
                                <div class="tool-info">
                                    <h4 class="tool-title" v-html="getHighlightedName(tool.toolName)"></h4>
                                    <div class="tool-code">{{ tool.toolCode }}</div>
                                </div>
                            </div>
                            <div class="card-bottom">
                                <span class="tool-category-badge">
                                    {{ tool.parentCategory }}{{ tool.subCategory ? ' · ' + tool.subCategory : '' }}
                                </span>
                                <span class="tool-action-btn">
                                    {{ useToolText }} <i class="my-icon my-icon-jiantou-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                    <!-- 空状态 -->
                    <div class="search-empty-state" v-else>
                        <i class="my-icon my-icon-search empty-icon"></i>
                        <h3>暂无匹配工具</h3>
                        <p>没有找到与 "{{ keyword }}" 相关的工具，可以换个词试试，或者选择其他分类过滤。</p>
                        <div class="popular-title">热门工具推荐</div>
                        <div class="popular-tags">
                            <a href="/bmi" class="category-filter-tag">BMI指数计算</a>
                            <a href="/markdown" class="category-filter-tag">Markdown在线编辑器</a>
                            <a href="/js-obfuscator" class="category-filter-tag">JS混淆加密</a>
                            <a href="/md5-encrypt" class="category-filter-tag">MD5加密</a>
                            <a href="/qrcode" class="category-filter-tag">二维码生成器</a>
                        </div>
                    </div>
                </div>
            `
        }).use(ElementPlus).mount('.main-body');
    </script>


        
</body>
</html>
